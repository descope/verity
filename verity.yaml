# verity.yaml — verity-specific configuration
#
# This file holds settings that belong neither in Copa's copa-config.yaml
# nor in the standard Helm Chart.yaml.

# Tag variant overrides for chart-sourced images.
# Key: partial image path to match. If an image ref contains this string
# and its tag ends with "-<from>", the tag suffix is replaced with "-<to>".
overrides:
  "timberio/vector":
    from: "distroless-libc"
    to: "debian"
    valuePath: "image"  # explicit hint for chart-gen value path resolution
  # cert-manager-csi-driver chart computes image refs from imageRegistry +
  # imageNamespace + image.name while leaving image.repository empty, so
  # chart-gen cannot auto-detect the values path from repository/tag pairs.
  # Pin the main driver override path explicitly; sidecar images remain
  # upstream and are allowlisted in chart-integration.
  "jetstack/cert-manager-csi-driver":
    valuePath: "image"

# Per-chart values injected both during helm template image discovery and into
# generated wrapper-chart values.yaml defaults.
chartValues:
  # grafana chart 10.5.15 otherwise renders a bats test pod. Disable it so the
  # wrapper only needs to route the primary Grafana workload image.
  #
  # Plus two CI-compat fixes for verity's wolfi grafana rebuild:
  #
  # 1. securityContext.run{AsUser,AsGroup,fsGroup}: 65532
  #    Chart defaults runAsUser=runAsGroup=fsGroup=472 (matching the
  #    upstream `grafana/grafana` image's `grafana` user uid). Verity's
  #    wolfi rebuild has no uid 472 in /etc/passwd — it ships only `root`
  #    (0) and `nonroot` (65532). Without a passwd entry for the running
  #    uid, grafana fails at startup with:
  #      "could not get current OS user to detect process privileges"
  #    Pinning to verity's wolfi `nonroot` uid 65532 (which DOES have
  #    a /etc/passwd entry) lets grafana detect its own user. The
  #    chart's `runAsNonRoot: true` invariant stays intact (65532 is
  #    a nonroot uid).
  #
  # 2. env.GF_PATHS_HOME: /usr/share/grafana
  #    Grafana looks for `defaults.ini` relative to `homepath` (default
  #    is the working dir, which is `/`). Verity's image installs the
  #    config at `/usr/share/grafana/conf/defaults.ini` (matching the
  #    wolfi package layout). Without this env var, grafana fails:
  #      "Could not find config defaults, make sure homepath command
  #       line parameter is set or working directory is homepath"
  #    Setting GF_PATHS_HOME points grafana at the right install root.
  #
  # See verity-org/verity#318 (was originally suspected to be wolfi-
  # package issue; turned out chartValues fully address it).
  grafana:
    testFramework.enabled: false
    securityContext.runAsUser: 65532
    securityContext.runAsGroup: 65532
    securityContext.fsGroup: 65532
    env.GF_PATHS_HOME: /usr/share/grafana

  # loki 7.0.0 requires explicit test schema + bucket names to render, and its
  # default gateway/caches add unpatchable auxiliary images. Keep a minimal
  # runtime: Loki + already-Copa-backed kiwigrid sidecar.
  loki:
    loki.storage.bucketNames.admin: admin
    loki.storage.bucketNames.chunks: chunks
    loki.storage.bucketNames.ruler: ruler
    loki.useTestSchema: true
    test.enabled: false
    lokiCanary.enabled: false
    gateway.enabled: false
    chunksCache.enabled: false
    resultsCache.enabled: false
    # Default replicas: 3 per component with anti-affinity. Single-node kind
    # can only place 1; the others sit Pending forever (FailedScheduling:
    # didn't match pod anti-affinity rules). Drop to 1 each for CI smoke
    # — see verity-org/verity#322.
    backend.replicas: 1
    read.replicas: 1
    write.replicas: 1

  # minio 5.4.0 (charts.min.io) defaults to mode: distributed with 16-replica
  # StatefulSet and 16Gi memory requests — kind cannot place even one pod
  # (FailedScheduling: Insufficient memory). Standalone mode + 1 replica +
  # 256Mi requests fits CI smoke. See verity-org/verity#322.
  minio:
    mode: standalone
    replicas: 1
    resources.requests.memory: 256Mi

  # mimir-distributed 6.0.6 can render as a single-image runtime if we turn off
  # optional bundled infra components (MinIO, Kafka, nginx gateway, rollout-operator).
  #
  # Additionally: with `kafka.enabled: false`, the chart's hardcoded
  # `ingest_storage.enabled: true` template still tries to validate a
  # Kafka address and aborts mimir components at startup with
  # `invalid ingest storage config: the Kafka address has not been
  # configured` (verified against chart-integration run 25961993442
  # mimir-distributed-* pod logs). Override `ingest_storage.enabled:
  # false` via `mimir.structuredConfig` — the chart's documented hook
  # for overriding the rendered text-config.
  mimir-distributed:
    gateway.enabled: false
    kafka.enabled: false
    minio.enabled: false
    rollout_operator.enabled: false
    mimir.structuredConfig.ingest_storage.enabled: false
    # mimir's usage-stats module is enabled by default and creates an
    # S3 client at startup to upload anonymous installation telemetry.
    # The chart's mimir.config template configures the storage backend
    # as `s3` with no `endpoint:` value, so the binary aborts at init
    # with:
    #   error running application err="no s3 endpoint in config file"
    # (chart-integration run 25964060759 mimir-distributed-* pod
    # logs). Disabling usage_stats removes the S3 client and lets the
    # binary boot.
    mimir.structuredConfig.usage_stats.enabled: false
    # The chart's `mimir.config` template hardcodes
    # `ingester.push_grpc_method_enabled: false` (values.yaml L249,
    # mimir-distributed 6.0.6) because the upstream architecture
    # routes writes via Kafka under ingest_storage. With
    # `ingest_storage.enabled: false`, the ingester binary validates
    # the combination at startup and aborts with:
    #   error validating config: cannot disable Push gRPC method in
    #   ingester, while ingest storage (-ingest-storage.enabled) is
    #   not enabled
    # (chart-integration run 25974769298 mimir-distributed-ingester-*
    # pod logs). Re-enable the Push gRPC method via structuredConfig.
    mimir.structuredConfig.ingester.push_grpc_method_enabled: true
    # With `minio.enabled: false`, the chart's `mimir.config` template
    # still hardcodes `backend: s3` for blocks_storage,
    # alertmanager_storage, and ruler_storage but emits NO `s3:`
    # endpoint block (values.yaml L138-147, L180-187, L302-311 are
    # `{{- if .Values.minio.enabled }}` gated). The mimir binary then
    # aborts the store-gateway / querier / compactor / ruler with:
    #   error running application err="no s3 endpoint in config file"
    # (chart-integration run 25974769298 store-gateway, querier,
    # compactor pod logs). Switch all three storage subsystems to
    # `filesystem` — CI smoke just needs the binaries to boot; it
    # doesn't exercise persistence across pods. Real users override
    # to s3/gcs/azure via their own structuredConfig.
    #
    # `readOnlyRootFilesystem: true` is set on all mimir pods (chart
    # `templates/*-statefulset.yaml`), so the ONLY writable path
    # inside the container is the `storage` PVC mounted at `/data`.
    # Both the filesystem storage dirs AND each component's data_dir
    # must therefore live under `/data`, AND mimir's validator
    # rejects any overlap between the two (e.g. `data_dir: /data`
    # vs `filesystem.dir: /data/blocks` — chart-integration run
    # 25982132035 alertmanager-0/compactor-0/ruler-* logs:
    # "the configured ... data directory \"/data\" cannot overlap
    # with the configured ... storage filesystem directory
    # \"/data/blocks\""). Resolve by giving each component its own
    # `/data/<component>` subdir AND putting filesystem storage in
    # sibling `/data/storage-<kind>` subdirs that no component
    # data_dir templates into.
    mimir.structuredConfig.compactor.data_dir: /data/compactor
    mimir.structuredConfig.alertmanager.data_dir: /data/alertmanager
    mimir.structuredConfig.ruler.rule_path: /data/ruler
    mimir.structuredConfig.blocks_storage.bucket_store.sync_dir: /data/tsdb-sync
    mimir.structuredConfig.blocks_storage.tsdb.dir: /data/tsdb
    mimir.structuredConfig.blocks_storage.backend: filesystem
    mimir.structuredConfig.blocks_storage.filesystem.dir: /data/storage-blocks
    mimir.structuredConfig.alertmanager_storage.backend: filesystem
    mimir.structuredConfig.alertmanager_storage.filesystem.dir: /data/storage-alertmanager
    mimir.structuredConfig.ruler_storage.backend: filesystem
    mimir.structuredConfig.ruler_storage.filesystem.dir: /data/storage-ruler

  # tempo-distributed 1.61.3 defaults to a separate Memcached statefulset;
  # the minimal CI-friendly wrapper just runs the Tempo microservices
  # themselves.
  #
  # `global.image.registry: ghcr.io` overrides the chart's per-component
  # `image.registry: docker.io` defaults. Without this, chart-gen rewrites
  # `image.repository` from `grafana/tempo` → `verity-org/tempo` but
  # leaves `image.registry` at `docker.io`, producing the broken
  # `docker.io/verity-org/tempo:2` reference (verified via May 9 nightly
  # diagnostic dump on verity-org/verity#318). Same chart-side workaround
  # as the chart-gen ClearDefaultRegistry plumbing for `defaultRegistry`
  # siblings in verity-org/verity#312, but `image.registry` siblings need
  # their own fix path — this chartValues override is the surgical
  # equivalent.
  tempo-distributed:
    memcached.enabled: false
    global.image.registry: ghcr.io

  # aws-load-balancer-controller — three placeholder values that wrapper
  # chart consumers MUST override before deploying to a real cluster:
  #   - clusterName: identifies the EKS cluster; controller refuses to
  #                  start without it
  #   - region:     normally auto-detected from EC2 IMDS; kind has no
  #                  IMDS so the auto-detect fails. Any AWS region works
  #                  for CI smoke
  #   - vpcId:      same EC2-IMDS-fallback pattern as region. Format
  #                  `vpc-` + 17 hex chars matches the AWS-issued shape
  #                  so any controller-side format validator stays happy.
  #
  # All three diagnosed via verity-org/verity#323 (region:, clusterName:)
  # and the May 9 nightly dump (vpcId:). Real users override all three
  # to their actual EKS cluster identifiers.
  aws-load-balancer-controller:
    clusterName: verity-placeholder
    region: us-east-1
    vpcId: vpc-00000000000000000

  # cluster-autoscaler requires autoDiscovery.clusterName to render templates.
  # The wrapper chart consumers MUST override this to their actual cluster name.
  cluster-autoscaler:
    autoDiscovery.clusterName: verity-placeholder

  # workload-identity-webhook requires azureTenantID to render templates.
  # The wrapper chart consumers MUST override this to their actual tenant ID.
  #
  # replicaCount: 1 — chart default is 2 replicas. On the single-node
  # kind cluster used by chart-integration, both pods race the
  # controller-runtime cert-rotator state machine on first install
  # (both write to the same Secret, both restart on rotation), and
  # `/readyz` returns HTTP 500 until the rotator converges. With two
  # replicas the race extends past the helm `--wait` 10-minute
  # budget; single replica converges in ~30s (verified on a local
  # kind run, see verity-org/verity#375). Production deployments
  # should keep the default 2 replicas; this override is scoped to
  # the verity wrapper chart for CI smoke.
  workload-identity-webhook:
    azureTenantID: verity-placeholder
    replicaCount: 1

  # nfs-subdir-external-provisioner chart's Deployment requires `nfs.server`
  # to render — without it, helm install aborts with:
  #   Deployment.apps "nfs-subdir-external-provisioner" is invalid:
  #     spec.template.spec.volumes[0].nfs.server: Required value
  # CI smoke just needs the provisioner pod up; it doesn't actually request
  # storage from NFS at startup, so any placeholder satisfies the validator.
  # Real users would set this to their actual NFS server hostname/IP and
  # `nfs.path` to the export root. Mirror the `verity-placeholder` pattern
  # used by aws-load-balancer-controller / cluster-autoscaler /
  # workload-identity-webhook.
  nfs-subdir-external-provisioner:
    nfs.server: 10.0.0.1
    nfs.path: /

  # cilium chart pins each component image by digest (e.g.
  # `image.digest: sha256:2e61680...`) AND has `image.useDigest: true`,
  # so the rendered pod spec is `image@sha256:...`. chart-gen replaces
  # the repository with `ghcr.io/verity-org/cilium`, but the upstream
  # digest doesn't match verity's rebuild content — pull fails:
  #   Failed to pull image "ghcr.io/verity-org/cilium:1.19@sha256:2e616...":
  #     failed to resolve reference (digest mismatch)
  # Disable per-component useDigest so the chart pulls by tag only.
  # Same `useDigest: false` flip needed for the operator image (chart
  # tracks digests separately per component).
  #
  # Also: `operator.replicas: 1` — chart defaults to 2 with anti-affinity,
  # but a single-node kind cluster can only place 1. Mirror the loki /
  # minio kind-sizing pattern.
  #
  # See verity-org/verity#318. The upstream chart's digest pinning is
  # intentional for production users (sigstore/cosign verification),
  # but cannot survive chart-gen's repository rewrite.
  cilium:
    image.useDigest: false
    operator.image.useDigest: false
    envoy.image.useDigest: false
    operator.replicas: 1

  # etcd chart (cloudpirates-io 0.7.1) defaults to a 3-replica
  # StatefulSet for quorum. Single-node kind can only place 1; the
  # other 2 pods sit Pending forever (no anti-affinity required
  # — there literally isn't a second node). The 10-minute helm
  # install --wait budget then expires with:
  #   resource StatefulSet/etcd/etcd not ready.
  #   status: InProgress, message: Ready: 0/3
  # Drop to 1 replica for CI smoke. Same kind-sizing pattern as
  # loki / minio / cilium operator above. Trade-off: a 1-node etcd
  # has no quorum redundancy (any restart loses the cluster), but
  # the smoke test only verifies install + pod readiness, not HA.
  # See verity-org/verity#322 for the kind-sizing methodology.
  etcd:
    replicaCount: 1

  # valkey 0.20.2 (cloudpirates chart) pins its default image tag to
  # `9.0.0-alpine3.22@sha256:...`. chart-gen's replacement maps
  # `valkey/valkey` to `ghcr.io/verity-org/valkey:9.0`, but the
  # digest suffix can survive the wrapper render and force kubelet
  # back to the upstream docker.io image, tripping the image-origin
  # gate. Explicitly set the chart's image tuple to the Integer-backed
  # rebuild tag so the wrapper renders only verity-org/valkey.
  valkey:
    image.registry: ghcr.io
    image.repository: verity-org/valkey
    image.tag: "9.0"

  # airflow chart previously needed an upstream `apache/airflow` image
  # allowlist because the chart sources its main application image from
  # top-level scalars (`defaultAirflowRepository`, `defaultAirflowTag`) rather
  # than an `image.repository` map that chart-gen can auto-rewrite. The Verity
  # Wolfi rebuild also lacked `/opt/airflow/bin` on PATH, so the chart's
  # `bash -c "exec airflow ..."` commands failed even when these scalars were
  # pointed at `ghcr.io/verity-org/airflow`. Keep those scalars explicitly on
  # the Verity rebuild now that images/airflow.yaml publishes PATH + /usr/bin
  # compatibility.
  #
  # airflow chart bundles a `postgresql` sub-chart with image
  # `bitnamilegacy/postgresql:16.1.0-debian-11-r15`. chart-gen rewrites
  # the repository (`bitnamilegacy/postgresql` →
  # `verity-org/bitnamilegacy/postgresql`) but doesn't touch the
  # chart's own `postgresql.image.registry: docker.io` default, so the
  # rendered reference is the broken double-prefix:
  #
  #   docker.io/ghcr.io/verity-org/bitnamilegacy/postgresql:16.1.0-debian-11-r15
  #                                          ^^^^^^^^^^^^^^^^^^^^^^^^^
  #                                          (chart-gen-rewritten repo,
  #                                           with docker.io still
  #                                           prepended from the
  #                                           untouched image.registry
  #                                           field)
  #
  # The `ghcr.io/verity-org/bitnamilegacy/postgresql:16.1.0-debian-11-r15`
  # tag DOES exist in verity-org/ — the only thing wrong with the
  # generated wrapper is the extraneous `docker.io/` prefix.
  #
  # Clearing `postgresql.image.registry` prevents the parent chart's
  # registry scalar from being prepended to chartgen's generated FQDN
  # repository override, yielding the clean
  # `ghcr.io/verity-org/bitnamilegacy/postgresql:16.1.0-debian-11-r15`.
  # See verity-org/verity#318 for the related registry-composition class.
  #
  # Bucket E (probe-race) — bucket-confirmation.md (airflow row) shows
  # `wait-for-airflow-migrations` init container looping `Waiting for
  # migrations... NN second(s)`. Root cause is NOT just probe race — the
  # upstream chart ships `migrateDatabaseJob.useHelmHooks: true` (chart
  # default), which annotates the migrations Job with
  # `helm.sh/hook: post-install,post-upgrade`. Under `helm install --wait`
  # this creates a deadlock:
  #
  #   1. helm applies non-hook resources (api-server / scheduler /
  #      worker Deployments + StatefulSets).
  #   2. helm `--wait` blocks until those Deployments become Ready.
  #   3. Each Deployment's pod has a `wait-for-airflow-migrations`
  #      init container that polls the DB for an applied alembic
  #      revision and never exits.
  #   4. The migrations Job (post-install hook) only runs AFTER the
  #      install step succeeds — which it never does, because step 2
  #      times out first.
  #
  # Fix: flip `migrateDatabaseJob.useHelmHooks` to `false`. The Job
  # renders as a regular resource that helm applies in the first pass,
  # so the migrations Job runs in parallel with the Deployments and
  # each Deployment's init container exits as soon as alembic finishes.
  # `createUserJob.useHelmHooks` is LEFT at chart default `true`:
  # post-install hooks run after `helm install --wait` has confirmed
  # Deployments are ready (which already implies migrations finished),
  # so create-user doesn't race the DB and the no-restart-during-settle
  # gate stays clean.
  #
  # Supporting knobs:
  # - `postgresql.image.registry: ""` prevents the parent-level
  #   registry scalar from being prepended to the generated FQDN
  #   repository override. Do NOT set it to `ghcr.io`: during chart
  #   generation, chartgen overwrites
  #   `airflow.postgresql.image.repository` with an FQDN repository for
  #   this parent path, and a non-empty registry renders the broken
  #   `ghcr.io/ghcr.io/verity-org/bitnamilegacy/postgresql`.
  # - `postgresql.image.repository: bitnamilegacy/postgresql` keeps
  #   image discovery on the upstream source path. Do NOT pre-prefix
  #   it with `verity-org/`: chartgen derives patched targets from
  #   discovered images, so pre-prefixing makes the source name
  #   `verity-org/bitnamilegacy/postgresql` and renders the broken
  #   `ghcr.io/verity-org/verity-org/bitnamilegacy/postgresql`.
  # - `images.migrationsWaitTimeout: 300` (default 60s) — wait budget
  #   for `wait-for-airflow-migrations`. Kept generous so the init
  #   container still has headroom while the migrations Job runs.
  # - `apiServer.startupProbe.failureThreshold: 12` (default 6) —
  #   Airflow 3.x chart renamed `webserver` → `apiServer`; 12 × 10s =
  #   120s grace from container start so a freshly-migrated API server
  #   isn't killed before it binds.
  # - `statsd.enabled: false` — the chart bundles
  #   `quay.io/prometheus/statsd-exporter:v0.29.0`, which has no
  #   verity rebuild today. Disabling the optional StatsD sidecar
  #   removes a non-verity image from the smoke namespace so the
  #   image-origin gate stays clean WITHOUT an allowlist exception.
  #   StatsD metrics are not required for the smoke test (which only
  #   verifies install + pod readiness, not metric scraping).
  airflow:
    defaultAirflowRepository: ghcr.io/verity-org/airflow
    defaultAirflowTag: "3"
    postgresql.image.registry: ""
    postgresql.image.repository: bitnamilegacy/postgresql
    images.migrationsWaitTimeout: 300
    apiServer.startupProbe.failureThreshold: 12
    migrateDatabaseJob.useHelmHooks: false
    statsd.enabled: false

  # jenkins 5.9.18 otherwise renders an unpatched bats helm-test pod and a
  # default inbound agent image. Keep the wrapper focused on the controller and
  # the existing kiwigrid sidecar image.
  #
  # `controller.installPlugins: []` skips the chart's plugin-installation
  # init step, which calls `/usr/local/bin/install-plugins.sh`. Verity's
  # wolfi rebuild ships only the JVM + jenkins.war (no helper scripts) —
  # without this override, the `init` container crashes with
  # `/var/jenkins_config/apply_config.sh: line 14: /usr/local/bin/install-plugins.sh: not found`.
  # Skipping plugin install at smoke-test time is fine; real users can
  # install plugins post-deploy via the UI / configuration-as-code.
  #
  # The empty-list override only works because of the helmSetPair
  # --set-json support added in this same PR (was previously rejected
  # with ErrChartValueUnsupportedType — see #336 review history).
  # Verified end-to-end: `helm template jenkins/jenkins --set-json
  # 'controller.installPlugins=[]'` drops install-plugins.sh references
  # from the rendered chart (1 → 0).
  jenkins:
    controller.testEnabled: false
    controller.installPlugins: []
    agent.enabled: false

  # atlantis chart's CI-default values include no VCS credentials, so the
  # binary aborts at startup with `--gh-user/--gh-token ... must be set`.
  # Set dummy github creds so the smoke test can confirm the chart deploys
  # and the binary renders the help/usage path correctly. Real users would
  # override these with valid GitHub App creds. See verity-org/verity#323.
  #
  # github.secret is the webhook-validation HMAC secret. The chart's
  # secret-webhook.yaml template requires it whenever any github.*
  # config is set (or chart-gen / helm template aborts with
  # "github.secret is required if github configuration is specified" —
  # caught by Chart Generation failure on the original #331 merge).
  # Verified via `helm template atlantis ... -f values.yaml` locally
  # with all three fields present.
  #
  # `test.enabled: false` disables the chart's optional `atlantis-ui-test`
  # bats helm-test pod (default `image: bats/bats` which verity doesn't
  # rebuild). The diagnostic dump shows main `atlantis-0` pod Running
  # successfully but the UI-test pod terminates with `Error`, which
  # chart-integration interprets as overall failure. Disabling the test
  # pod lets the smoke test verify just the controller — the UI test
  # itself is a non-essential auxiliary check.
  atlantis:
    github.user: verity-ci-placeholder
    github.token: verity-ci-placeholder-token-not-real
    github.secret: verity-ci-placeholder-webhook-secret
    test.enabled: false

  # openbao chart starts the server in standalone mode by default — the
  # server runs but stays sealed (`Initialized: false`, `Sealed: true`)
  # forever because nothing auto-initializes it. Enable dev mode for CI
  # smoke so the server boots fully unsealed and the smoke check can
  # complete. dev mode is in-memory only — never use in production.
  # See verity-org/verity#323.
  #
  # Bucket E probe-tune: bucket-confirmation.md openbao row shows the
  # chart **functionally succeeded** (server-test pod exit=0, sealed=false)
  # but the integration job's `helm install --wait` exceeded its 10-min
  # budget before all pods crossed Ready. Chart's `server.readinessProbe`
  # defaults to initialDelaySeconds=5, failureThreshold=2 (≈10s tolerance
  # before the probe declares the pod NotReady). Stateful unseal warm-up
  # is slower than that under kind. Raise initialDelaySeconds to 30s and
  # failureThreshold to 6 (≈30s tolerance once started) so probes don't
  # flap during the unseal warm-up window.
  openbao:
    server.dev.enabled: true
    server.readinessProbe.initialDelaySeconds: 30
    server.readinessProbe.failureThreshold: 6

  # vault — same pattern as openbao (vault is the upstream openbao forked
  # from). Standalone mode boots the server but leaves it sealed forever
  # in CI; dev mode auto-init+auto-unseal so smoke test can verify the
  # API responds. dev mode is in-memory only — never use in production.
  # Diagnostic showed `Initialized: false / Sealed: true` post-deploy,
  # identical to the pre-#331 openbao failure shape.
  vault:
    server.dev.enabled: true

  # gitea chart defaults `image.rootless: true`, which pulls
  # `ghcr.io/verity-org/gitea:1-rootless` — a tag verity does not publish
  # (only `gitea:1` is rebuilt). Switch to the non-rootless image so the
  # chart pulls a tag that actually resolves. Trade-off: chart drops the
  # rootless-only security context default; acceptable for CI smoke.
  # See verity-org/verity#326.
  #
  # Bucket B (SCR-2026-05-14-001 subtask 7) — PO decision Option A:
  # bucket-confirmation.md gitea row: `init-directories` initContainer
  # crashes with `exec /usr/sbinx/init_directory_structure.sh: no such
  # file or directory`. `/usr/sbinx/` (with the 'x') is Bitnami's
  # deliberate init-script path; the verity wolfi rebuild ships upstream
  # gitea, which has no such script. Per subtask-7-handoff §3 Option A,
  # swap to Bitnami's gitea image so the chart's init scripts find their
  # expected paths. **PO accepted the CVE-posture trade-off** (Bitnami
  # image is unpatched; verity-rebuilt CVE posture lost for this chart).
  #
  # chartgen image-override interaction: chartgen's image-override
  # pass writes `image.repository` and `image.tag` AFTER these
  # chartValues are merged, and override keys win over same-key
  # collisions (per commit 0f12b6352541 #361). To keep these values
  # alive in the published wrapper, option (a) of the original design
  # note was taken: the `"gitea"` replacement entry is removed from
  # the `replacements:` block below, and `images/gitea.yaml` is
  # deleted so Integer Orchestrator no longer rebuilds an unused
  # `ghcr.io/verity-org/gitea` image. The chart now resolves to
  # crane-mirrored `docker.io/bitnamilegacy/gitea` (Bitnami migrated
  # the image to the bitnamilegacy namespace in late 2024) whose
  # init scripts at `/usr/sbinx/init_directory_structure.sh` match
  # the chart's expectations.
  #
  # `image.rootless: false` is the survives-as-sibling value that
  # PR #361 made stable; the explicit registry/repository/tag entries
  # are kept here as defense-in-depth so a future reintroduction of a
  # `"gitea"` replacement does NOT silently undo the Bitnami switch.
  gitea:
    image.rootless: false
    image.registry: docker.io
    # Bitnami migrated their gitea image (along with the postgresql
    # and valkey subcharts) to the `bitnamilegacy` namespace as part
    # of their late-2024 image reorganization. The old repo
    # `docker.io/bitnami/gitea` now returns an empty manifest; the
    # new repo `docker.io/bitnamilegacy/gitea:1` is the only published
    # location. Without this switch, the gitea init container fails
    # with `ErrImagePull` resolving the old `docker.io/bitnami/gitea:1`
    # reference. See chart-integration run 25972171694 (gitea shard)
    # diagnostic dump confirming the upstream 404.
    image.repository: bitnamilegacy/gitea
    image.tag: "1"
    # The Bitnami gitea chart 12.5.3 defaults
    # `postgresql-ha.enabled: true` (3-replica HA postgres + repmgr) and
    # `valkey-cluster.enabled: true` (3-replica valkey cluster). On the
    # kind-based chart-integration runners these subcharts pull in 6
    # stateful pods (postgresql-ha-0/1/2, valkey-cluster-0/1/2) whose
    # peer-discovery DNS resolves on a slow schedule — the helm
    # `--wait --timeout 10m0s` blocks waiting for the postgresql-ha
    # statefulset to converge, repeating "unable to resolve domain
    # gitea-postgresql-ha-postgresql-N.gitea-postgresql-ha-postgresql-
    # headless.gitea.svc.cluster.local" until the smoke harness's
    # 10-minute install budget is exhausted three times in a row.
    # Switch to the chart's single-node subchart variants for CI: the
    # single `postgresql` subchart deploys one postgres pod and the
    # single `valkey` subchart (architecture: standalone) deploys one
    # valkey pod. The gitea workload pod can reach both via the simple
    # ClusterIP service and helm install converges well within 10m.
    postgresql-ha.enabled: false
    valkey-cluster.enabled: false
    postgresql.enabled: true
    valkey.enabled: true
    # NOTE: the kind-CI workaround for the `init-directories`
    # initContainer's "Operation not permitted" chown failure
    # (`chown 1000:1000 /data` cannot run when the chart's per-
    # container default `runAsUser: 1000` is inherited and the kind
    # local-path-provisioner mounts /data as root:root) is applied
    # in `test/chart-integration/values/gitea.yaml`, NOT here, to
    # avoid changing the production security posture (running the
    # main gitea container as root). The chart-integration override
    # only affects the smoke-test cluster.

  # cert-manager startupapicheck Job runs `cert-manager check api --wait=1m`
  # to verify webhook readiness post-install. The default 1-minute timeout
  # is too aggressive for kind-based CI where webhook readiness can take
  # 90+ seconds, causing the Job to hit BackoffLimitExceeded even though
  # the main cert-manager controller, cainjector, and webhook pods are all
  # Running and Ready. Disabling the optional check for CI smoke lets the
  # smoke test verify just the controller pods. Real users should keep
  # `startupapicheck.enabled: true` to catch genuine webhook misconfigs
  # at install time. Diagnostic: dump shows main pods Running, only the
  # `cert-manager-startupapicheck` Job pod hits backoff. See
  # verity-org/verity#324 (probe-race carve-out).
  cert-manager:
    startupapicheck.enabled: false

  # meilisearch defaults its DB path to `./data.ms` (relative to the
  # current working directory, which is `/`). Combined with the chart's
  # `securityContext.readOnlyRootFilesystem: true`, this fails at startup
  # with `Read-only file system (os error 30)` even though the chart
  # mounts an emptyDir at `/meili_data`. Setting `MEILI_DB_PATH` via the
  # chart's `environment:` ConfigMap routes meilisearch's writes to the
  # writable mount. See verity-org/verity#324 (carve-out, was probe-race
  # but actual root cause turned out to be db-path / read-only-rootfs).
  #
  # Bucket E (probe-race) — bucket-confirmation.md (meilisearch row): pod
  # terminated exit=137 (SIGKILL) because k8s killed it while the
  # `/health` HTTP endpoint was still binding. Default startupProbe is
  # periodSeconds=1 × failureThreshold=60 → 60s grace. Process logged the
  # Meili ASCII banner before SIGKILL, so the binary did start; it just
  # needed more time to bind /health.
  #
  # Raise startupProbe.failureThreshold 60 → 180 (3×, period stays 1s so
  # early-ready pods still flip Ready quickly). Total budget 180s.
  meilisearch:
    environment.MEILI_DB_PATH: /meili_data
    startupProbe.failureThreshold: 180

  # metrics-server scrapes the kubelet's `/metrics/resource` endpoint over
  # TLS. In kind clusters the kubelet uses a self-signed cert without IP
  # SANs, which fails Go's TLS validation:
  #   "tls: failed to verify certificate: x509: cannot validate certificate
  #    for 172.18.0.2 because it doesn't contain any IP SANs"
  # Standard kind workaround is `--kubelet-insecure-tls`, which the chart
  # supports via `args:` (defaults: cert-dir + preferred-address-types +
  # node-status-port + metric-resolution). Adding this CI-only flag lets
  # the scraper succeed without skipping cert validation in production
  # users (their `args:` defaults are unchanged). Uses the list-typed
  # chartValues capability landed in verity-org/verity#342.
  metrics-server:
    args: ["--kubelet-insecure-tls"]

  # consul's connect-inject sidecar injector deployment depends on a
  # webhook TLS cert that's created at install time by a separate
  # `consul-consul-webhook-cert-manager` Job. The chart has no init-
  # container ordering between them, so the connect-inject Pod often
  # starts before the cert Job finishes and fails:
  #   FailedMount: secret "consul-consul-connect-inject-webhook-cert"
  #   not found
  # CI smoke just needs the consul server pod healthy — the connect
  # injector is an optional sidecar feature for service mesh use cases.
  # Disabling it removes the cert race entirely. Real users running with
  # connect-inject enabled need real cert-manager integration anyway.
  consul:
    connectInject.enabled: false

  # weaviate 17.8.0 — Bucket E (raft bootstrap is slower than the chart's
  # default readinessProbe tolerance).
  # bucket-confirmation.md weaviate row shows the pod's log converging to
  # healthy ('node reporting ready, exiting bootstrap process' →
  # 'leader_found') but `helm install --wait` timing out first. Chart
  # default readinessProbe.initialDelaySeconds is 3 (lines 235-237 of the
  # chart's values.yaml). Raise 3s → 60s (20×) so raft bootstrap has
  # runway before the probe starts polling; bump
  # readinessProbe.failureThreshold 3 → 12 (4×, ~120s additional
  # tolerance once started).
  weaviate:
    readinessProbe.initialDelaySeconds: 60
    readinessProbe.failureThreshold: 12

  # dex 0.24.0 — chart has empty `config: {}` default, but the dex
  # binary refuses to start without `issuer` and `storage` set:
  #   invalid Config:
  #     - no issuer specified in config file
  #     - no storage supplied in config file
  # (verified against chart-integration run 25961993442 dex pod log).
  # Provide a minimal CI-only config: a localhost issuer URL and an
  # in-memory storage driver. Production deployments are expected to
  # override both via their own values.yaml.
  dex:
    config.issuer: "http://dex.dex.svc.cluster.local:5556/dex"
    config.storage.type: "memory"
    # dex aborts at startup with `failed to initialize server: no
    # connectors specified` when its `connectors` array is empty.
    # Provide a minimal mock connector for CI — it doesn't actually
    # do authentication, just satisfies the chart's startup
    # validation. Real users override this with their actual OIDC /
    # SAML / OAuth2 provider config. Verified against chart-
    # integration run 25964060759 dex pod log.
    config.connectors:
      - type: mockCallback
        id: mock
        name: Mock

  # velero 12.0.1 — chart's default `configuration.backupStorageLocation`
  # is a one-element list with `provider: ""`. helm install then issues
  # a server-side apply on a `BackupStorageLocation` CR which fails
  # validation:
  #   BackupStorageLocation.velero.io "default" is invalid:
  #     spec.provider in body must be of type string: "null"
  #     spec.credential in body must be of type object: "null"
  # (chart-integration run 25961993442 velero install log). Empty the
  # BSL list so the chart skips the resource entirely. The smoke test
  # only validates that the controller pod becomes Ready; real users
  # provide their own provider/bucket via values.yaml.
  velero:
    configuration.backupStorageLocation: []
    # velero's `configuration.volumeSnapshotLocation` has the same
    # `provider: ""` / `credential: null` default as the BSL above
    # and trips the same Kubernetes server-side-apply validation:
    #   VolumeSnapshotLocation.velero.io "default" is invalid:
    #     spec.provider in body must be of type string: "null"
    # (chart-integration run 25964060759 velero install log).
    # Empty the VSL list so the chart skips that resource too.
    configuration.volumeSnapshotLocation: []

  # falco: NO chartValue tuning here — `driver.enabled: false`
  # was attempted in #378 to bypass the BPF-capability denial on
  # Azure GHA runners (verity-org/verity#325), but the May 16
  # nightly (run 25954862160, falco pod log) revealed the chart's
  # auto-injection of the `container` plugin into `falco.plugins`
  # and `falco.load_plugins` is gated by `driver.enabled` in
  # `_helpers.tpl:477` (`{{ if and .Values.driver.enabled
  # .Values.collectors.enabled }}`). With the driver disabled
  # AND no plugin auto-added, falco starts with no event source
  # and exits with `Error: Must enable at least one event source`.
  #
  # Properly fixing this requires explicitly wiring the container
  # plugin via chartValues — both `falco.plugins[<dict>]` AND
  # `falco.load_plugins: [container]` — and also overriding
  # `falcoctl.config.artifact.install.refs` so the plugin artifact
  # is pulled at install time. That's a much larger chart-config
  # surface; deferred. falco re-skipped in test/chart-integration/
  # SKIPS.yaml under #325 until the deeper wiring lands.

  # fluent-bit 0.57.3 starts its Kubernetes filter by waiting 30s for
  # cluster DNS before opening the HTTP server used by the chart's
  # livenessProbe. The chart default has no liveness initial delay, so
  # kubelet can hit the default 3 failures and SIGTERM fluent-bit just
  # as it becomes healthy, producing a clean restart that fails the
  # chart-integration no-restart gate (run 25987025840). Delay only
  # liveness; readiness can still report startup progress normally.
  fluent-bit:
    livenessProbe.initialDelaySeconds: 45

  # opensearch 3.6.0 — Bucket G (JVM gc log path is unwritable in the
  # rebuilt image).
  #
  # Root cause: the image ships `/usr/share/opensearch/config/jvm.options`
  # (from the upstream `opensearch-3` wolfi package) which contains
  #   9-:-Xlog:gc*,gc+age=trace,safepoint:file=${loggc}:utctime,pid,tags:filecount=32,filesize=64m
  # `${loggc}` resolves to `logs/gc.log` (relative to OPENSEARCH_HOME).
  # That directory is owned by the wolfi `nonroot` uid 65532 (see
  # `images/opensearch.yaml`), but the chart's StatefulSet runs as uid
  # 1000 (chart-default `securityContext.runAsUser`). JVM tries to
  # create the gc log file on startup, gets EACCES, aborts with
  #   [error][logging] Error opening log file 'logs/gc.log': Permission denied
  #   Invalid -Xlog option ... Could not create the Java Virtual Machine
  # and the pod crash-loops (chart-integration run 25974769298).
  #
  # Earlier attempts to disable GC logging via `OPENSEARCH_JAVA_OPTS=
  # -Xlog:disable` failed because `jvm.options` is parsed **before**
  # env vars by `org.opensearch.tools.launchers.JvmOptionsParser`, so
  # the `-Xlog:gc*:file=...` directive aborts the JVM startup before
  # env-var overrides can take effect.
  #
  # Fix: replace the image's `jvm.options` outright via the chart's
  # `config.jvm.options` key (rendered into the `opensearch-cluster-
  # master-config` ConfigMap and mounted at
  # `/usr/share/opensearch/config/jvm.options`, shadowing the image's
  # file). Content mirrors the upstream OpenSearch 3.x defaults
  # (G1GC, heap-dump-on-OOM, etc.) MINUS the gc-file logging directive.
  # GC logging still goes to stdout via OpenSearch's normal log4j
  # console appender — no observability lost for the smoke test.
  #
  # The `opensearchJavaOpts` env var sets heap via `OPENSEARCH_JAVA_OPTS`
  # at runtime and is also necessary because `jvm.options` here omits
  # the upstream `-Xms${heap.min}/-Xmx${heap.max}` placeholder lines
  # (the upstream `opensearch-env` shell script substitutes those at
  # entrypoint time, and we want explicit CI-sized heap regardless).
  opensearch:
    opensearchJavaOpts: "-Xmx512M -Xms512M"
    # The chart defaults to uid/gid 1000, but the verity wolfi image owns
    # /usr/share/opensearch/config as uid/gid 65532. OpenSearch creates a
    # temporary keystore file in that directory during bootstrap, so the chart
    # must run as the image's nonroot user.
    persistence.enableInitChown: false
    podSecurityContext.fsGroup: 65532
    podSecurityContext.runAsUser: 65532
    securityContext.runAsUser: 65532
    # jvm.options is the upstream 3.x baseline with the `9-:-Xlog:gc*`
    # gc-file logging directive removed. Keep this in sync with
    # https://github.com/opensearch-project/OpenSearch/blob/<version>/
    #   distribution/src/config/jvm.options when bumping the chart.
    config:
      jvm.options: |
        ## JVM heap is set via OPENSEARCH_JAVA_OPTS (opensearchJavaOpts
        ## above) so this file omits the upstream `-Xms${heap.min}` /
        ## `-Xmx${heap.max}` placeholder lines.

        ## G1GC Configuration (JDK 11+; bundled JDK is 25)
        11-:-XX:+UseG1GC
        11-:-XX:G1ReservePercent=25
        11-:-XX:InitiatingHeapOccupancyPercent=30

        ## JVM temporary directory
        -Djava.io.tmpdir=${OPENSEARCH_TMPDIR}

        ## heap dumps
        ## Note: the upstream file ships `${heap.dump.path}` and
        ## `${error.file}` placeholders here that the `opensearch-env`
        ## shell wrapper substitutes at entrypoint time. Because we
        ## replace the entire jvm.options via ConfigMap, those
        ## placeholders are NOT expanded by the launcher (JvmOptions-
        ## Parser only resolves `${ENVVAR}` references, not these
        ## opensearch-env-specific tokens) and would cause
        ##   improperly formatted JVM option in [.../jvm.options] ...
        ## startup errors. The JVM falls back to its built-in defaults
        ## (heap dump in CWD, no separate fatal-error log file), which
        ## is acceptable for the CI smoke test.
        -XX:+HeapDumpOnOutOfMemoryError

        ## JDK 20+ Incubating Vector Module for SIMD optimizations
        20-:--add-modules=jdk.incubator.vector

        ## JDK 23 inlining workaround for MethodHandle.setAsTypeCache
        ## (https://bugs.openjdk.org/browse/JDK-8341127)
        23:-XX:CompileCommand=dontinline,java/lang/invoke/MethodHandle.setAsTypeCache
        23:-XX:CompileCommand=dontinline,java/lang/invoke/MethodHandle.asTypeUncached

        ## JDK 21+ agent + module opens for Arrow memory
        21-:-javaagent:agent/opensearch-agent.jar
        21-:--add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED

        ## Lucene MMapDirectory shared-arena pool size (default 1 for
        ## stability under high mmap counts)
        -Dorg.apache.lucene.store.MMapDirectory.sharedArenaMaxPermits=1

        ## JDK 25+ compact object headers
        25-:-XX:+UseCompactObjectHeaders

        ## NOTE: the upstream `9-:-Xlog:gc*,gc+age=trace,safepoint:
        ## file=${loggc}:utctime,pid,tags:filecount=32,filesize=64m`
        ## directive is INTENTIONALLY OMITTED — see verity.yaml
        ## comment block above for the EACCES / crash-loop rationale.

  # opensearch-dashboards 3.6.0 — chart defaults `securityContext.
  # runAsUser: 1000` (matching the upstream `opensearchproject/
  # opensearch-dashboards` image's `dashboards` user uid). Verity's
  # wolfi rebuild creates `/usr/share/opensearch-dashboards/{data,
  # config}` owned by uid 65532 (the wolfi `nonroot` user). With
  # chart's uid 1000 running, the dashboards binary cannot write its
  # `data/uuid` file:
  #   FATAL Error: Unable to write OpenSearch Dashboards UUID file ...
  #         Error was: EACCES
  # (chart-integration run 25964060759 dashboards pod log). Override
  # the chart's runAsUser to verity's `nonroot` uid so the writable
  # paths match.
  opensearch-dashboards:
    securityContext.runAsUser: 65532

  # kyverno 3.7.2: disable the post-upgrade `crds.migration` hook. It runs
  # `kubectl` from `registry.k8s.io/kubectl:v1.34.3`. Verity rebuilds kubectl
  # on the floating `1.34` minor track (`images/kubectl.yaml`) but does not
  # publish this exact `v1.34.3` patch tag; the hook is also a no-op on a
  # fresh `helm install` and would otherwise be the only non-`ghcr.io/verity-org/*`
  # reference rendered into the wrapper — disabling it avoids both the
  # unpatched-tag pull and an `AssertImageOrigin` allowlist exception. The
  # `defaultRegistry: reg.kyverno.io` registry-prefix neutralisation that
  # admission-controller / background / cleanup / reports / kyvernopre all
  # need is now handled automatically by chart-gen's `ClearDefaultRegistry`
  # plumbing (`internal/chartgen/values.go` walks `defaultRegistry` siblings
  # alongside `registry`); see issue #254 for the original symptom.
  kyverno:
    crds.migration.enabled: false

# Image replacements for chart-gen.
# Maps upstream image path patterns to Verity Integer (Wolfi) images.
# When chart-gen discovers a chart image matching the key, it generates
# an override pointing to the replacement image instead of looking for
# a Copa-patched version.
replacements:
  "kube-state-metrics/kube-state-metrics":
    registry: "ghcr.io/verity-org"
    image: "kube-state-metrics"
    tag: "2.18.0"
  # prometheus chart pulls pushgateway:v1.11.2 (with v prefix); verity-org
  # publishes only non-v tags (`latest`, `1.11`, `1.11.2`). Pin floating-minor
  # `1.11` per the Wave 1 methodology in #310 so chart-gen writes a tag that
  # actually resolves. Closes the prometheus shard's only red pod (the rest
  # of the chart is green per nightly diagnostics).
  "prometheus/pushgateway":
    registry: "ghcr.io/verity-org"
    image: "pushgateway"
    tag: "1.11"

  # Observability wave 2. The prometheus chart was dropped from this PR
  # (kube-prometheus-stack rendered images for jkroepke/kube-webhook-certgen
  # and prometheus-operator/prometheus-operator without Verity coverage), so
  # we add no replacements for prometheus/prometheus or prometheus/alertmanager
  # here — the existing prometheus chart's wrapper falls through to crane.
  "grafana/grafana":
    registry: "ghcr.io/verity-org"
    image: "grafana"
    tag: "12.3"
  "grafana/loki":
    registry: "ghcr.io/verity-org"
    image: "loki"
    tag: "3.6"
  "grafana/mimir":
    registry: "ghcr.io/verity-org"
    image: "mimir"
    tag: "3.0"
  # tempo-distributed 1.61.3 renders a Tempo 2.9.0 config schema; pin the
  # wrapper to the matching Integer rebuild instead of floating major 2.
  "grafana/tempo":
    registry: "ghcr.io/verity-org"
    image: "tempo"
    tag: "2.9.0"

  # rabbitmq-cluster-operator 0.3.0 renders the cluster operator image as
  # `ghcr.io/rabbitmq/cluster-operator:2.21.0`. Verity's rebuild is named
  # `rabbitmq-cluster-operator` (images/rabbitmq-cluster-operator.yaml)
  # and publishes floating-major tag `2`; without this explicit mapping the
  # wrapper leaves the upstream ghcr.io/rabbitmq image in place and the
  # chart-integration image-origin gate fails.
  "rabbitmq/cluster-operator":
    registry: "ghcr.io/verity-org"
    image: "rabbitmq-cluster-operator"
    tag: "2"

  # kyverno chart (3.7.2). Chart renders images under
  # `reg.kyverno.io/kyverno/*` (Kyverno's pull-through mirror); repoPath
  # strips the host so keys match `kyverno/<name>`. The cleanup-controller,
  # readiness-checker, and kyvernopre binaries each ship as their own
  # subpackage of the upstream Wolfi `kyverno-1.17` recipe (kyvernopre's
  # subpackage is named `kyverno-init-container-1.17`).
  #
  # Tag `1.17` pins the floating-minor track published by images/kyverno*.yaml
  # (`versions: "1.17": {}`). Without an explicit tag, chart-gen would carry
  # the chart's appVersion `v1.17.2` through unchanged — but Verity does not
  # publish `v1.17.2` (or any per-patch tag), only the floating `1.17` plus
  # `vX.Y.Z-patched` historicals. That tag mismatch was one of two root
  # causes of issue #254 (admission-controller stuck in ImagePullBackOff
  # inside the 10-minute helm-install budget); the second was the chart's
  # per-component `defaultRegistry: reg.kyverno.io` being concatenated with
  # our already-FQDN repository overrides, now neutralised by chart-gen's
  # `ClearDefaultRegistry` plumbing in `internal/chartgen/values.go`.
  "kyverno/kyverno":
    registry: "ghcr.io/verity-org"
    image: "kyverno"
    tag: "1.17"
  "kyverno/background-controller":
    registry: "ghcr.io/verity-org"
    image: "kyverno-background-controller"
    tag: "1.17"
  "kyverno/reports-controller":
    registry: "ghcr.io/verity-org"
    image: "kyverno-reports-controller"
    tag: "1.17"
  "kyverno/cleanup-controller":
    registry: "ghcr.io/verity-org"
    image: "kyverno-cleanup-controller"
    tag: "1.17"
  "kyverno/readiness-checker":
    registry: "ghcr.io/verity-org"
    image: "kyverno-readiness-checker"
    tag: "1.17"
  "kyverno/kyvernopre":
    registry: "ghcr.io/verity-org"
    image: "kyverno-kyvernopre"
    tag: "1.17"
  "kyverno/kyverno-cli":
    registry: "ghcr.io/verity-org"
    image: "kyverno-cli"
    tag: "1.17"

  # argo-cd chart (9.5.4) → argocd controller; dex shared with dex chart.
  # Tag `3.3` pins the floating-minor track published by images/argocd.yaml
  # (`versions: "3.3": {}`). Without an explicit tag, chart-gen carries
  # the chart's appVersion through verbatim — `v3.3.8`, with the `v`
  # prefix. Verity publishes `3.3`, `3.3.8`, `3` (no `v`-prefix variants),
  # so the chart's literal `v3.3.8` 404s on pull. Pinning `tag: "3.3"`
  # strips the `v` and floats on minor patches. Same root cause as
  # kyverno (#254 / PR #298); same fix shape. See #308 Wave 1.
  "argoproj/argocd":
    registry: "ghcr.io/verity-org"
    image: "argocd"
    tag: "3.3"
  "argoproj/argo-rollouts":
    registry: "ghcr.io/verity-org"
    image: "argo-rollouts"
    tag: "1"
  # Tag `2` pins the floating-major track published by images/dex.yaml
  # (`versions: "2": {}`); chart's appVersion `v2.44.0` is not published.
  "dexidp/dex":
    registry: "ghcr.io/verity-org"
    image: "dex"
    tag: "2"

  # metrics-server chart (3.13.0). Tag `0.8` pins the floating-minor
  # track declared by images/metrics-server.yaml (`versions: "0.8": {}`
  # alongside the catch-all `"0": {}`). The chart renders `v0.8.0` —
  # same `v`-prefix mismatch as argocd above; pinning to `0.8` strips
  # the `v` and floats on patches. The dedicated `0.8` stream survives
  # Wolfi minor bumps; if/when 0.9.x ships, declare `"0.9": {}` too and
  # bump this pin.
  "metrics-server/metrics-server":
    registry: "ghcr.io/verity-org"
    image: "metrics-server"
    tag: "0.8"

  # opensearch + opensearch-dashboards charts (3.6.0). Tag `3` pins the
  # floating-major track published by images/opensearch{,-dashboards}.yaml
  # (`versions: "3": {}`); chart's `:3.6.0` is not published.
  "opensearchproject/opensearch":
    registry: "ghcr.io/verity-org"
    image: "opensearch"
    tag: "3"
  "opensearchproject/opensearch-dashboards":
    registry: "ghcr.io/verity-org"
    image: "opensearch-dashboards"
    tag: "3"

