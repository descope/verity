# verity.yaml — verity-specific configuration
#
# This file holds settings that belong neither in Copa's copa-config.yaml
# nor in the standard Helm Chart.yaml.

# Tag variant overrides for chart-sourced images.
# Key: partial image path to match. If an image ref contains this string
# and its tag ends with "-<from>", the tag suffix is replaced with "-<to>".
overrides:
  "timberio/vector":
    from: "distroless-libc"
    to: "debian"
    valuePath: "image"  # explicit hint for chart-gen value path resolution

# Per-chart values injected both during helm template image discovery and into
# generated wrapper-chart values.yaml defaults.
chartValues:
  # grafana chart 10.5.15 otherwise renders a bats test pod. Disable it so the
  # wrapper only needs to route the primary Grafana workload image.
  grafana:
    testFramework.enabled: false

  # loki 7.0.0 requires explicit test schema + bucket names to render, and its
  # default gateway/caches add unpatchable auxiliary images. Keep a minimal
  # runtime: Loki + already-Copa-backed kiwigrid sidecar.
  loki:
    loki.storage.bucketNames.admin: admin
    loki.storage.bucketNames.chunks: chunks
    loki.storage.bucketNames.ruler: ruler
    loki.useTestSchema: true
    test.enabled: false
    lokiCanary.enabled: false
    gateway.enabled: false
    chunksCache.enabled: false
    resultsCache.enabled: false

  # mimir-distributed 6.0.6 can render as a single-image runtime if we turn off
  # optional bundled infra components (MinIO, Kafka, nginx gateway, rollout-operator).
  mimir-distributed:
    gateway.enabled: false
    kafka.enabled: false
    minio.enabled: false
    rollout_operator.enabled: false

  # tempo-distributed 1.61.3 defaults to a separate Memcached statefulset; the
  # minimal CI-friendly wrapper just runs the Tempo microservices themselves.
  tempo-distributed:
    memcached.enabled: false

  # jenkins 5.9.18 otherwise renders an unpatched bats helm-test pod and a
  # default inbound agent image. Keep the wrapper focused on the controller and
  # the existing kiwigrid sidecar image.
  jenkins:
    controller.testEnabled: false
    agent.enabled: false

# Image replacements for chart-gen.
# Maps upstream image path patterns to Verity Integer (Wolfi) images.
# When chart-gen discovers a chart image matching the key, it generates
# an override pointing to the replacement image instead of looking for
# a Copa-patched version.
replacements:
  "kube-state-metrics/kube-state-metrics":
    registry: "ghcr.io/verity-org"
    image: "kube-state-metrics"
    tag: "2.18.0"
  "prometheus/pushgateway":
    registry: "ghcr.io/verity-org"
    image: "pushgateway"

  # Observability wave 2. The prometheus chart was dropped from this PR
  # (kube-prometheus-stack rendered images for jkroepke/kube-webhook-certgen
  # and prometheus-operator/prometheus-operator without Verity coverage), so
  # we add no replacements for prometheus/prometheus or prometheus/alertmanager
  # here — the existing prometheus chart's wrapper falls through to crane.
  "grafana/grafana":
    registry: "ghcr.io/verity-org"
    image: "grafana"
    tag: "12.3"
  "grafana/loki":
    registry: "ghcr.io/verity-org"
    image: "loki"
    tag: "3.6"
  "grafana/mimir":
    registry: "ghcr.io/verity-org"
    image: "mimir"
    tag: "3.0"
  "grafana/tempo":
    registry: "ghcr.io/verity-org"
    image: "tempo"
    tag: "2"

  # kyverno chart (3.7.2). Chart renders images under
  # `reg.kyverno.io/kyverno/*` (Kyverno's pull-through mirror); repoPath
  # strips the host so keys match `kyverno/<name>`. The cleanup-controller,
  # readiness-checker, and kyvernopre binaries each ship as their own
  # subpackage of the upstream Wolfi `kyverno-1.17` recipe (kyvernopre's
  # subpackage is named `kyverno-init-container-1.17`).
  "kyverno/kyverno":
    registry: "ghcr.io/verity-org"
    image: "kyverno"
  "kyverno/background-controller":
    registry: "ghcr.io/verity-org"
    image: "kyverno-background-controller"
  "kyverno/reports-controller":
    registry: "ghcr.io/verity-org"
    image: "kyverno-reports-controller"
  "kyverno/cleanup-controller":
    registry: "ghcr.io/verity-org"
    image: "kyverno-cleanup-controller"
  "kyverno/readiness-checker":
    registry: "ghcr.io/verity-org"
    image: "kyverno-readiness-checker"
  "kyverno/kyvernopre":
    registry: "ghcr.io/verity-org"
    image: "kyverno-kyvernopre"
  "kyverno/kyverno-cli":
    registry: "ghcr.io/verity-org"
    image: "kyverno-cli"

  # argo-cd chart (9.5.4) → argocd controller; dex shared with dex chart.
  "argoproj/argocd":
    registry: "ghcr.io/verity-org"
    image: "argocd"
  "argoproj/argo-rollouts":
    registry: "ghcr.io/verity-org"
    image: "argo-rollouts"
    tag: "1"
  "dexidp/dex":
    registry: "ghcr.io/verity-org"
    image: "dex"

  # metrics-server chart (3.13.0).
  "metrics-server/metrics-server":
    registry: "ghcr.io/verity-org"
    image: "metrics-server"

  # opensearch + opensearch-dashboards charts (3.6.0).
  "opensearchproject/opensearch":
    registry: "ghcr.io/verity-org"
    image: "opensearch"
  "opensearchproject/opensearch-dashboards":
    registry: "ghcr.io/verity-org"
    image: "opensearch-dashboards"

  # postgres-operator chart (1.15.1). Migrated Copa→Integer; this entry
  # routes the chart's image to the existing images/postgres-operator.yaml
  # rebuild.
  "zalando/postgres-operator":
    registry: "ghcr.io/verity-org"
    image: "postgres-operator"

  # cert-manager chart (1.20.2). Jetstack chart image refs keep the upstream
  # quay.io/jetstack path and v-prefixed tag; Verity publishes the rebuilds at
  # flattened ghcr.io/verity-org/<name> repos with non-v tags.
  "jetstack/cert-manager-controller":
    registry: "ghcr.io/verity-org"
    image: "cert-manager-controller"
    tag: "1.20.2"
  "jetstack/cert-manager-cainjector":
    registry: "ghcr.io/verity-org"
    image: "cert-manager-cainjector"
    tag: "1.20.2"
  "jetstack/cert-manager-webhook":
    registry: "ghcr.io/verity-org"
    image: "cert-manager-webhook"
    tag: "1.20.2"

  # ingress-nginx chart (4.15.1) + external-dns chart (1.20.0). Existing
  # Copa-patched repos preserve the standalone source naming used in
  # copa-config.yaml rather than the charts' rendered repo paths.
  "ingress-nginx/controller":
    registry: "ghcr.io/verity-org"
    image: "kubernetes/ingress-nginx/controller"
  "ingress-nginx/kube-webhook-certgen":
    registry: "ghcr.io/verity-org"
    image: "kubernetes/ingress-nginx/kube-webhook-certgen"
  "external-dns/external-dns":
    registry: "ghcr.io/verity-org"
    image: "kubernetes-sigs/external-dns"

  # Integer-backed free wins.
  "valkey/valkey":
    registry: "ghcr.io/verity-org"
    image: "valkey"
    tag: "9.0"
  "etcd-development/etcd":
    registry: "ghcr.io/verity-org"
    image: "etcd"
    tag: "3.6.10"
  "velero/velero":
    registry: "ghcr.io/verity-org"
    image: "velero"
    tag: "1.18.0"

  # MinIO operator chart (package name: operator, version 7.1.1). The chart
  # renders only the operator deployment; route it to the existing Wolfi
  # rebuild whose published tags omit the upstream v-prefix.
  "minio/operator":
    registry: "ghcr.io/verity-org"
    image: "minio-operator"
    tag: "7.1.1"

  # jenkins 5.9.18.
  "jenkins/jenkins":
    registry: "ghcr.io/verity-org"
    image: "jenkins"
    tag: "2.555.1"

  # Wave 4 charts (mesh + observability).
  # traefik 39.0.8 → traefik 3.6.x; rebuild publishes major.minor tag.
  # Image is `docker.io/traefik` (root-level, no namespace).
  "traefik":
    registry: "ghcr.io/verity-org"
    image: "traefik"
    tag: "3.6"
  # grafana/alloy 1.8.0 → alloy v1.16.x; prometheus-config-reloader falls through.
  "grafana/alloy":
    registry: "ghcr.io/verity-org"
    image: "grafana-alloy"
    tag: "1"

  # Wave 5 charts (secrets, AI/ML).
  # openbao 0.27.2 → openbao v2.5.x; chart's hashicorp/vault-k8s injector
  # falls through to crane (no rebuild for vault-k8s).
  "openbao/openbao":
    registry: "ghcr.io/verity-org"
    image: "openbao"
    tag: "2"
  # apache-airflow 1.21.0 → airflow v3.2.x; bitnamilegacy/postgresql,
  # statsd-exporter, and root-level redis fall through to crane.
  "apache/airflow":
    registry: "ghcr.io/verity-org"
    image: "airflow"
    tag: "3"

  # Wave 6 charts (developer tooling).
  # gitea 12.5.3 → gitea v1.25.x; chart's busybox helper falls through (excluded).
  # Image is `docker.gitea.com/gitea` (root-level path under custom registry).
  "gitea":
    registry: "ghcr.io/verity-org"
    image: "gitea"
    tag: "1"
  # crossplane 2.2.1 → crossplane v2.2.x; single image.
  "crossplane/crossplane":
    registry: "ghcr.io/verity-org"
    image: "crossplane"
    tag: "2"

  # Wave 7 charts (object storage, registries, security, metrics).
  # minio 5.4.0 → minio server; rebuild publishes "RELEASE" floating tag.
  # The chart's `minio/mc` (CLI) image has a different path and falls through.
  "minio/minio":
    registry: "ghcr.io/verity-org"
    image: "minio"
    tag: "RELEASE"
  # chartmuseum 3.10.4 → chartmuseum v0.16.x; single image.
  "helm/chartmuseum":
    registry: "ghcr.io/verity-org"
    image: "chartmuseum"
    tag: "0"
  # trivy-operator 0.32.1 → trivy-operator v0.30.x; single image.
  "aquasec/trivy-operator":
    registry: "ghcr.io/verity-org"
    image: "trivy-operator"
    tag: "0"
  # victoria-metrics-single 0.35.0 → victoria-metrics v1.140.x; single image.
  "victoriametrics/victoria-metrics":
    registry: "ghcr.io/verity-org"
    image: "victoriametrics"
    tag: "1"

  # Wave 8 charts (search, AI, automation).
  # meilisearch 0.32.0 → meilisearch v1.42.x; chart's busybox helper falls through.
  "getmeili/meilisearch":
    registry: "ghcr.io/verity-org"
    image: "meilisearch"
    tag: "1"
  # weaviate 17.8.0 → weaviate v1.37.x; chart's alpine test image falls through.
  "semitechnologies/weaviate":
    registry: "ghcr.io/verity-org"
    image: "weaviate"
    tag: "1"
  # atlantis 6.3.0 → atlantis v0.42.x; chart's bats helm-test image falls through.
  "runatlantis/atlantis":
    registry: "ghcr.io/verity-org"
    image: "atlantis"
    tag: "0"

  # Wave 9 charts (auxiliary-binary self-maps for prefix-collision safety).
  # These charts emit a primary image plus auxiliary images that share a
  # prefix with the primary key. Without the self-map entries, chart-gen's
  # strings.Contains matcher would route auxiliary images to the primary
  # rebuild (which lacks the auxiliary binary). Longest-pattern-first sort
  # guarantees the more-specific self-map wins.

  # vault 0.32.0 → hashicorp/vault server binary on Wolfi rebuild.
  # The vault-k8s auth injector is a separate binary; self-map keeps the
  # chart's docker.io/hashicorp/vault-k8s reference unchanged.
  "hashicorp/vault-k8s":
    registry: "docker.io"
    image: "hashicorp/vault-k8s"
  "hashicorp/vault":
    registry: "ghcr.io/verity-org"
    image: "vault"
    tag: "1"

  # falco 8.0.2 → falco daemon (/usr/bin/falco) on Wolfi rebuild.
  # falcoctl and falco-driver-loader are separate binaries; self-map them.
  "falcosecurity/falcoctl":
    registry: "docker.io"
    image: "falcosecurity/falcoctl"
  "falcosecurity/falco-driver-loader":
    registry: "docker.io"
    image: "falcosecurity/falco-driver-loader"
  "falcosecurity/falco":
    registry: "ghcr.io/verity-org"
    image: "falco"
    tag: "0"

  # nats 2.12.6 → nats-server (root-level docker.io/nats path) on Wolfi
  # rebuild. nats-box (CLI) and nats-server-config-reloader are separate
  # binaries under the natsio/ namespace; self-map them.
  "natsio/nats-server-config-reloader":
    registry: "docker.io"
    image: "natsio/nats-server-config-reloader"
  "natsio/nats-box":
    registry: "docker.io"
    image: "natsio/nats-box"
  "nats":
    registry: "ghcr.io/verity-org"
    image: "nats"
    tag: "2"

# Images the orchestrator should skip entirely, regardless of source
# (standalone copa-config.yaml entry OR chart-discovered). Reserve this
# list for images that have NO Wolfi/Integer rebuild AND no replacement
# we control. Distroless images for which a rebuild exists are handled
# automatically via the images/*.yaml exclude path.
# Format: post-repoPath name (registry stripped, no tag).
unpatchableImages:
  # argo-cd values.yaml hard-codes
  # repository: ecr-public.aws.com/docker/library/redis (a non-standard
  # ECR Public alias). We migrated the rest of the pipeline to valkey in
  # #227 but argo-cd still references redis upstream. Skipping the patch
  # is correct — chart-gen handles wrapper-chart routing separately.
  - "docker/library/redis"
