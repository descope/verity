apiVersion: v2
name: verity
description: Helm charts whose images Verity patches and re-publishes
type: application
version: 0.1.0

# Verity extracts all container image references from these charts via
# `helm template` and patches them alongside the standalone images in
# copa-config.yaml. This is standard Helm Chart.yaml dependency format.
dependencies:
  - name: prometheus
    version: "29.2.1"
    repository: "oci://ghcr.io/prometheus-community/charts"

  - name: victoria-logs-single
    version: "0.12.2"
    repository: "https://victoriametrics.github.io/helm-charts"

  - name: postgres-operator
    version: "1.15.1"
    repository: "https://opensource.zalando.com/postgres-operator/charts/postgres-operator"

  - name: kyverno
    version: "3.7.2"
    repository: "oci://ghcr.io/kyverno/charts"

  - name: argo-cd
    version: "9.5.4"
    repository: "https://argoproj.github.io/argo-helm"

  - name: dex
    version: "0.24.0"
    repository: "https://charts.dexidp.io"

  - name: metrics-server
    version: "3.13.0"
    repository: "https://kubernetes-sigs.github.io/metrics-server/"

  - name: opensearch
    version: "3.6.0"
    repository: "https://opensearch-project.github.io/helm-charts"

  - name: opensearch-dashboards
    version: "3.6.0"
    repository: "https://opensearch-project.github.io/helm-charts"

  - name: rabbitmq-cluster-operator
    version: "0.2.3"
    repository: "oci://ghcr.io/cloudpirates-io/helm-charts"

  - name: cert-manager
    version: "1.20.2"
    repository: "https://charts.jetstack.io"

  - name: ingress-nginx
    version: "4.15.1"
    repository: "https://kubernetes.github.io/ingress-nginx"

  - name: external-dns
    version: "1.20.0"
    repository: "https://kubernetes-sigs.github.io/external-dns/"

  - name: consul
    version: "1.9.6"
    repository: "https://helm.releases.hashicorp.com"

  - name: valkey
    version: "0.20.0"
    repository: "oci://ghcr.io/cloudpirates-io/helm-charts"

  - name: etcd
    version: "0.7.0"
    repository: "oci://ghcr.io/cloudpirates-io/helm-charts"

  - name: velero
    version: "12.0.0"
    repository: "https://vmware-tanzu.github.io/helm-charts"

  # MinIO's current operator chart package is named `operator` in the
  # https://operator.min.io repo. It templates only the operator deployment;
  # tenant data-plane images live in the separate tenant chart / CRD specs.
  - name: operator
    version: "7.1.1"
    repository: "https://operator.min.io"

  - name: loki
    version: "7.0.0"
    repository: "https://grafana.github.io/helm-charts"

  - name: grafana
    version: "10.5.15"
    repository: "https://grafana.github.io/helm-charts"

  - name: mimir-distributed
    version: "6.0.6"
    repository: "https://grafana.github.io/helm-charts"

  - name: tempo-distributed
    version: "1.61.3"
    repository: "https://grafana.github.io/helm-charts"

  - name: argo-rollouts
    version: "2.40.9"
    repository: "https://argoproj.github.io/argo-helm"

  - name: jenkins
    version: "5.9.18"
    repository: "https://charts.jenkins.io"
