apiVersion: v2
name: verity
description: Helm charts whose images Verity patches and re-publishes
type: application
version: 0.1.0

# Verity extracts all container image references from these charts via
# `helm template` and patches them alongside the standalone images in
# copa-config.yaml. This is standard Helm Chart.yaml dependency format.
dependencies:
  - name: prometheus
    version: "29.2.1"
    repository: "oci://ghcr.io/prometheus-community/charts"

  - name: victoria-logs-single
    version: "0.12.0"
    repository: "https://victoriametrics.github.io/helm-charts"

  - name: postgres-operator
    version: "1.15.1"
    repository: "https://opensource.zalando.com/postgres-operator/charts/postgres-operator"

  - name: kyverno
    version: "3.7.2"
    repository: "oci://ghcr.io/kyverno/charts"

  - name: argo-cd
    version: "9.5.4"
    repository: "https://argoproj.github.io/argo-helm"

  - name: dex
    version: "0.24.0"
    repository: "https://charts.dexidp.io"

  - name: metrics-server
    version: "3.13.0"
    repository: "https://kubernetes-sigs.github.io/metrics-server/"

  - name: opensearch
    version: "3.6.0"
    repository: "https://opensearch-project.github.io/helm-charts"

  - name: opensearch-dashboards
    version: "3.6.0"
    repository: "https://opensearch-project.github.io/helm-charts"
