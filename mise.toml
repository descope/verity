[tools]
# Core tools
go = "latest"
node = { version = "24.14.1", postinstall = "corepack enable" }
crane = "0.21.0"
helm = "4.1.4"
kind = "0.31.0"
kubectl = "1.35.0"
claude-code = {version = "2.1.59", os = ["darwin"]}

# Container image build tools
apko = "1.1.11"
melange = "0.43.4"

# Security & signing tools
trivy = "0.69.3"
cosign = "3.0.6"
syft = "1.42.1"

# Go tools (pinned for reproducibility)
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.11.4"
"go:mvdan.cc/gofumpt" = "0.9.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"

# Linting tools (pinned for reproducibility)
yq = "4.52.5"
actionlint = "1.7.12"
shellcheck = "0.11.0"
yamllint = "1.38.0"
"npm:markdownlint-cli" = "0.48.0"

[env]
# Explicit GOPATH keeps module cache, installed binaries, and source under one place.
# GOTOOLCHAIN=local prevents Go from auto-downloading a different toolchain version.
GOPATH = "{{ env.HOME }}/dev/go"
GOTOOLCHAIN = "local"
_.path = ["{{ env.HOME }}/dev/go/bin"]
