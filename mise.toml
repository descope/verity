[tools]
# Core tools
go = "1.26.5"
node = { version = "24.18.1", postinstall = "corepack enable" }
crane = "0.21.8"
helm = "4.2.3"
kind = "0.32.0"
kubectl = "1.36.3"
claude-code = {version = "2.1.220", os = ["darwin"]}

# Container image build tools
apko = "1.2.31"
# Release source: https://github.com/chainguard-dev/melange/releases/tag/v0.56.1
# Platform release URLs and SHA-256 checksums are recorded in mise.lock.
melange = "0.56.5"

# Security & signing tools
trivy = "0.72.0"
cosign = "3.1.2"
syft = "1.50.0"

# Go tools (pinned for reproducibility)
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.12.2"
"go:mvdan.cc/gofumpt" = "v0.11.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"

# Linting tools (pinned for reproducibility)
yq = "4.53.3"
actionlint = "1.7.12"
shellcheck = "0.11.0"
yamllint = "1.38.0"
"npm:markdownlint-cli" = "0.49.1"

[env]
# Explicit GOPATH keeps module cache, installed binaries, and source under one place.
# GOTOOLCHAIN=local prevents Go from auto-downloading a different toolchain version.
GOPATH = "{{ env.HOME }}/dev/go"
GOTOOLCHAIN = "local"
_.path = ["{{ env.HOME }}/dev/go/bin"]
