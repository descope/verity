# gitea chart-integration smoke-test value overrides.
#
# The Bitnami gitea chart's `init-directories` initContainer runs
# `/usr/sbinx/init_directory_structure.sh` which does
# `chown 1000:1000 /data` on the mounted PVC. The chart's default
# `containerSecurityContext` is empty, so the init container inherits
# the chart's per-container default `securityContext.runAsUser: 1000`
# — which means it cannot chown the PVC. The kind local-path-
# provisioner creates the host-path mount as root:root, and the
# chart's `podSecurityContext.fsGroup: 1000` is not reliably applied
# before the init runs. Result (chart-integration run 25974769298
# gitea shard diagnostic dump):
#
#   chown: changing ownership of '/data': Operation not permitted
#   failed to change ownership of '/data' from root:root to 1000:1000
#
# → init-directories enters CrashLoopBackOff and helm install times
# out at 10 minutes.
#
# The chart's rootless mode skips the `chown` while keeping the Gitea
# command/runtime containers non-root. Keep `image.fullOverride` pointed
# at the only published legacy image tag (`bitnamilegacy/gitea:1`) so
# `image.rootless: true` does not append an unavailable `-rootless` tag.
#
# Production users who hit the same PVC-chown issue on their cluster
# should either (a) switch to `image.rootless: true` (the upstream
# chart's supported path for non-root containers) or (b) configure
# their CSI driver / storage class to honor `fsGroup` recursively
# before the init container runs.
#
# The only published `bitnamilegacy/gitea` tag that matches the chart's
# major-version reference is `:1`, but that legacy image does not ship
# Gitea's newer `environment-to-ini` helper. The chart requires that
# helper in `init-app-ini`; without it the init container exits 127.
# Mount a smoke-only helper that implements the chart's env var encoding
# for the generated app.ini.
gitea:
  image:
    rootless: true
    fullOverride: docker.io/bitnamilegacy/gitea:1
  extraDeploy:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gitea-env-to-ini
      data:
        environment-to-ini: |-
          #!/usr/bin/env sh
          set -eu

          out=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o)
                out="$2"
                shift 2
                ;;
              *)
                echo "unsupported argument: $1" >&2
                exit 2
                ;;
            esac
          done

          if [ -z "$out" ]; then
            echo "missing -o output path" >&2
            exit 2
          fi

          tmp="$(mktemp)"
          env | sort | awk -F= '
            function decode(s) {
              gsub(/_0X2E_/, ".", s)
              gsub(/_0X2D_/, "-", s)
              return tolower(s)
            }
            /^GITEA____/ {
              key = substr($1, 10)
              root[decode(key)] = substr($0, length($1) + 2)
              next
            }
            /^GITEA__/ {
              rest = substr($1, 8)
              sep = index(rest, "__")
              if (sep == 0) next
              section = decode(substr(rest, 1, sep - 1))
              key = decode(substr(rest, sep + 2))
              value = substr($0, length($1) + 2)
              sections[section] = 1
              values[section SUBSEP key] = value
              keys[section] = keys[section] key "\n"
              next
            }
            END {
              for (key in root) print key " = " root[key]
              for (section in sections) {
                print ""
                print "[" section "]"
                split(keys[section], sectionKeys, "\n")
                for (i in sectionKeys) {
                  key = sectionKeys[i]
                  if (key != "") print key " = " values[section SUBSEP key]
                }
              }
            }
          ' > "$tmp"
          chmod 0644 "$tmp"
          mkdir -p "$(dirname "$out")"
          mv "$tmp" "$out"
  extraVolumes:
    - name: env-to-ini
      configMap:
        name: gitea-env-to-ini
        defaultMode: 365
  extraInitVolumeMounts:
    - name: env-to-ini
      mountPath: /usr/local/bin/environment-to-ini
      subPath: environment-to-ini
      readOnly: true
