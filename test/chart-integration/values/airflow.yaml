# airflow chart-integration smoke-test value overrides.

airflow:
  # The published chart-under-test can lag this PR's generated wrapper until
  # Chart Generation republishes it on main. Mirror verity.yaml's strategic
  # routing here so the PR smoke test exercises the Verity Wolfi rebuild and
  # does not require the removed apache/airflow allowlist.
  defaultAirflowRepository: ghcr.io/verity-org/airflow
  defaultAirflowTag: "3"
  postgresql:
    image:
      # The generated wrapper currently concentrates the GHCR host in the
      # repository field for this parent/subchart duplicate image path. Keep the
      # smoke-test render composable while chart-gen's broader path handling
      # continues to evolve.
      registry: ghcr.io
      repository: verity-org/bitnamilegacy/postgresql
