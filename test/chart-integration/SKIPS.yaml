# SKIPS.yaml — institutional debt register for chart-integration smoke tests.
#
# Contract (SCR-2026-05-14-001, AC-1 + AC-3):
#   - Hard cap: ≤5 entries. Loader fails closed if exceeded.
#   - Fail-closed: any malformed YAML, missing required field, unknown structure,
#     or duplicate chart name MUST cause the harness to exit non-zero.
#   - Each entry requires a tracking_issue (github.com URL) OR the literal string
#     "needs new issue" (audit script detects and reports these).
#   - exit_criteria must be a concrete, testable condition for un-skipping.
#
# Adding a skip is NOT a convenience — it is technical debt with a tracking
# issue, an exit criterion, and a peer review. Prefer chartValues tuning,
# image fixes, or harness retries (subtask 5) before adding here.
#
# Slot accounting: 3 of 5 slots used. Loader's MaxSkippedCharts=5
# invariant will reject any 6th entry. Adding another skip requires either
# (a) removing an existing entry whose exit_criteria has been met, or
# (b) a new SCR raising the cap.
#
# Recent slot reclaims:
#   - falco (#325): closed via `chartValues.falco.driver.enabled: false`
#     in verity.yaml — option (b) of the falco exit_criteria. The chart
#     still installs cleanly without a kernel driver; container-engine
#     plugin remains the event source. Verified in the same PR that
#     removed this row.
#   - workload-identity-webhook (#375): closed via
#     `chartValues.workload-identity-webhook.replicaCount: 1` in
#     verity.yaml. The chart's cert-rotator races between replicas on
#     single-node kind; single replica converges fast enough to fit
#     the helm `--wait` 10-minute budget.

skips:
  - chart: nfs-subdir-external-provisioner
    reason: needs-external-infra
    tracking_issue: https://github.com/verity-org/verity/issues/373
    exit_criteria: "harness gains a sidecar NFS server, OR chart bumps to use a CI-friendly NFS mock"
    added: 2026-05-14
    added_by: SCR-2026-05-14-001

  - chart: cilium
    reason: kind-cluster-capability
    tracking_issue: https://github.com/verity-org/verity/issues/372
    exit_criteria: "agent init container hits \"dial tcp 10.96.0.1:443: operation not permitted\" — kind cluster lacks capabilities for cilium's CNI. Revisit when smoke harness gains capability grants OR when cilium chart exposes a CI-friendly probe-disable knob."
    added: 2026-05-14
    added_by: SCR-2026-05-14-001

  - chart: cert-manager-csi-driver
    reason: chart-template-blocked
    tracking_issue: https://github.com/verity-org/verity/issues/374
    exit_criteria: "chart hardcodes livenessProbe initialDelaySeconds with no values knob; smoke harness \"helm install --wait\" hits the probe before driver registers with cert-manager (which the harness also doesn't pre-install). Revisit when chart exposes app.livenessProbe knobs OR when harness pre-installs cert-manager CRDs."
    added: 2026-05-14
    added_by: SCR-2026-05-14-001
