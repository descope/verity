  # ============================================================================
  #  MESSAGING & STREAMING
  # ============================================================================

  - name: "rabbitmqoperator/cluster-operator"
    image: "mirror.gcr.io/rabbitmqoperator/cluster-operator"
    platforms: ["linux/amd64", "linux/arm64"]
