apiVersion: copa.sh/v1alpha1
kind: PatchConfig

# Standalone images to patch. Chart-sourced images are declared in Chart.yaml
# (dependencies:) and picked up automatically by `verity discover`.
#
# REMEDIATION POLICY: Copa-first (see docs/product/remediation-policy.md).
# Copa-patching the upstream image is the DEFAULT path — max compatibility, and
# Copa can apply distro-patched packages a Wolfi rebuild can't. A Wolfi/bespoke
# Integer rebuild is the LAST RESORT (only when Copa can't reach zero
# HIGH/CRITICAL, or a minimal-attack-surface / FIPS variant is required).
# The publish gate withholds any image that isn't clean on both arches.
target:
  registry: "ghcr.io/verity-org"

images:

  # ============================================================================
  #  BASE / STATIC IMAGES
  # ============================================================================

  # Upstream stopped publishing dated tags (the previous pattern
  # '^\d{4}-\d{2}-\d{2}.*$' matches nothing), so pin the named variant
  # tags gcr.io actually publishes.
  - name: "distroless/static"
    image: "gcr.io/distroless/static"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "list"
      list: ["latest", "nonroot", "debug", "debug-nonroot"]

  # ============================================================================
  #  LANGUAGE RUNTIMES & SDKs
  # ============================================================================

  # ============================================================================
  #  WEB SERVERS & PROXIES
  # ============================================================================

  - name: "nginxinc/nginx-s3-gateway"
    image: "docker.io/nginxinc/nginx-s3-gateway"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^unprivileged-oss-\d{8}$'
      maxTags: 3

  - name: "kubernetes/ingress-nginx/controller"
    image: "registry.k8s.io/ingress-nginx/controller"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes/ingress-nginx/kube-webhook-certgen"
    image: "registry.k8s.io/ingress-nginx/kube-webhook-certgen"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes/ingress-nginx/defaultbackend"
    image: "registry.k8s.io/defaultbackend"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+$'
      maxTags: 3
      exclude: ["1.0", "1.1", "1.2"]

  # ============================================================================
  #  DATABASES
  # ============================================================================

  # MongoDB Community Server is only published with UBI-suffixed tags
  # (no plain semver variants exist). Use -ubi9 for current RHEL UBI 9 base.
  #
  # Note on goVcsUrl: deliberately NOT set. The bundled Go CLI tools
  # (mongostat, mongodump, ...) live in github.com/mongodb/mongo-tools, a
  # separate repo whose tags are 100.x.x — independent of the server image
  # tag (8.x.x-ubi9). discoverStandaloneImage always appends "@<imageTag>"
  # to a non-empty goVcsUrl, so any value here would produce an invalid VCS
  # ref like "mongo-tools@8.2.5-ubi9" and break copa's first patch attempt.
  # Without goVcsUrl, the first attempt fails with copa's "no binaries were
  # successfully rebuilt" message; patch-image.sh's broadened retry trigger
  # then re-runs with --pkg-types os, which still patches OS-level CVEs in
  # the UBI 9 base. Adding fixed-VCS-ref support is tracked separately.
  - name: "mongodb/mongodb-community-server"
    image: "quay.io/mongodb/mongodb-community-server"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+-ubi9$'
      maxTags: 3

  # cockroach binary lives at /cockroach/cockroach (non-standard path).
  # Stripped with -trimpath, so buildinfo doesn't carry a VCS URL.
  - name: "cockroachdb/cockroach"
    image: "mirror.gcr.io/cockroachdb/cockroach"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3
    goVcsUrl: "https://github.com/cockroachdb/cockroach"
    goVcsTagPrefix: ""

