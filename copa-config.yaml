apiVersion: copa.sh/v1alpha1
kind: PatchConfig

# Standalone images to patch. Chart-sourced images are declared in Chart.yaml
# (dependencies:) and picked up automatically by `verity discover`.
#
# NOTE: Basic core images (node, python, golang, nginx, postgres, etc.) are
# maintained as Wolfi-based rebuilds (previously in github.com/verity-org/integer, now consolidated).
# Only complex upstream images that cannot be trivially rebuilt from Wolfi
# packages belong here.
target:
  registry: "ghcr.io/verity-org"

images:

  # ============================================================================
  #  BASE / STATIC IMAGES
  # ============================================================================

  - name: "distroless/static"
    image: "gcr.io/distroless/static"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d{4}-\d{2}-\d{2}.*$'
      maxTags: 3

  # ============================================================================
  #  LANGUAGE RUNTIMES & SDKs
  # ============================================================================

  # ============================================================================
  #  WEB SERVERS & PROXIES
  # ============================================================================

  - name: "nginxinc/nginx-s3-gateway"
    image: "ghcr.io/nginxinc/nginx-s3-gateway"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes/ingress-nginx/controller"
    image: "ghcr.io/kubernetes/ingress-nginx/controller"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes/ingress-nginx/kube-webhook-certgen"
    image: "ghcr.io/kubernetes/ingress-nginx/kube-webhook-certgen"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes/ingress-nginx/defaultbackend"
    image: "ghcr.io/kubernetes/ingress-nginx/defaultbackend"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+$'
      maxTags: 3

  # ============================================================================
  #  DATABASES
  # ============================================================================

  # MongoDB Community Server is only published with UBI-suffixed tags
  # (no plain semver variants exist). Use -ubi9 for current RHEL UBI 9 base.
  #
  # Note on goVcsUrl: deliberately NOT set. The bundled Go CLI tools
  # (mongostat, mongodump, ...) live in github.com/mongodb/mongo-tools, a
  # separate repo whose tags are 100.x.x — independent of the server image
  # tag (8.x.x-ubi9). discoverStandaloneImage always appends "@<imageTag>"
  # to a non-empty goVcsUrl, so any value here would produce an invalid VCS
  # ref like "mongo-tools@8.2.5-ubi9" and break copa's first patch attempt.
  # Without goVcsUrl, the first attempt fails with copa's "no binaries were
  # successfully rebuilt" message; patch-image.sh's broadened retry trigger
  # then re-runs with --pkg-types os, which still patches OS-level CVEs in
  # the UBI 9 base. Adding fixed-VCS-ref support is tracked separately.
  - name: "mongodb/mongodb-community-server"
    image: "quay.io/mongodb/mongodb-community-server"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+-ubi9$'
      maxTags: 3

  # cockroach binary lives at /cockroach/cockroach (non-standard path).
  # Stripped with -trimpath, so buildinfo doesn't carry a VCS URL.
  - name: "cockroachdb/cockroach"
    image: "mirror.gcr.io/cockroachdb/cockroach"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3
    goVcsUrl: "https://github.com/cockroachdb/cockroach"
    goVcsTagPrefix: ""

  - name: "library/elasticsearch"
    image: "mirror.gcr.io/library/elasticsearch"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "elastic/eck-operator"
    image: "mirror.gcr.io/elastic/eck-operator"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3
    goVcsUrl: "https://github.com/elastic/cloud-on-k8s"
    goVcsTagPrefix: "v"

  # ============================================================================
  #  MESSAGING & STREAMING
  # ============================================================================

  - name: "library/rabbitmq"
    image: "mirror.gcr.io/library/rabbitmq"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "rabbitmqoperator/cluster-operator"
    image: "ghcr.io/rabbitmq/cluster-operator"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3
    # Go binary built with -trimpath (no VCS info). Image tags lack 'v' prefix
    # but upstream git tags are v-prefixed (e.g., image 2.19.0 → git v2.19.0).
    goVcsUrl: "https://github.com/rabbitmq/cluster-operator"
    goVcsTagPrefix: "v"

  - name: "rabbitmqoperator/messaging-topology-operator"
    image: "mirror.gcr.io/rabbitmqoperator/messaging-topology-operator"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3
    # Same -trimpath + tag-prefix issue as cluster-operator above.
    goVcsUrl: "https://github.com/rabbitmq/messaging-topology-operator"
    goVcsTagPrefix: "v"

  # ============================================================================
  #  KUBERNETES TOOLS
  # ============================================================================

  - name: "kubernetes-sigs/external-dns"
    image: "ghcr.io/kubernetes-sigs/external-dns"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "emberstack/kubernetes-reflector"
    image: "ghcr.io/emberstack/kubernetes-reflector"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes-sigs/secrets-store-csi-driver"
    image: "ghcr.io/kubernetes-sigs/secrets-store-csi-driver"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "googlecloudplatform/secrets-store-csi-driver-provider-gcp"
    image: "ghcr.io/googlecloudplatform/secrets-store-csi-driver-provider-gcp"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kiwigrid/k8s-sidecar"
    image: "ghcr.io/kiwigrid/k8s-sidecar"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "kubernetes-sigs/node-feature-discovery"
    image: "ghcr.io/kubernetes-sigs/node-feature-discovery"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  - name: "rancher/k3s"
    image: "mirror.gcr.io/rancher/k3s"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+\+k3s\d+$'
      maxTags: 3

  # ============================================================================
  #  EKS DISTRO
  # ============================================================================

  - name: "aws/eks-distro/coredns/coredns"
    image: "ghcr.io/aws/eks-distro/coredns/coredns"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-eks-.*$'
      maxTags: 3

  - name: "aws/eks-distro/kubernetes/kube-apiserver"
    image: "ghcr.io/aws/eks-distro/kubernetes/kube-apiserver"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-eks-.*$'
      maxTags: 3

  - name: "aws/eks-distro/kubernetes/kube-scheduler"
    image: "ghcr.io/aws/eks-distro/kubernetes/kube-scheduler"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-eks-.*$'
      maxTags: 3

  - name: "aws/eks-distro/kubernetes/kube-proxy"
    image: "ghcr.io/aws/eks-distro/kubernetes/kube-proxy"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-eks-.*$'
      maxTags: 3

  - name: "aws/eks-distro/kubernetes-csi/node-driver-registrar"
    image: "ghcr.io/aws/eks-distro/kubernetes-csi/node-driver-registrar"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-eks-.*$'
      maxTags: 3

  # ============================================================================
  #  SERVICE MESH & NETWORKING
  # ============================================================================

  # -- Istio --
  # -- Cilium --
  - name: "cilium/hubble-ui"
    image: "quay.io/cilium/hubble-ui"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  # -- Calico --
  # ============================================================================
  #  MONITORING & OBSERVABILITY
  # ============================================================================

  # -- VictoriaMetrics --
  - name: "victoriametrics/victoria-logs"
    image: "quay.io/victoriametrics/victoria-logs"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 1
    # Go binary built with -trimpath (no VCS info in binary).
    # OCI label points to monorepo (wrong directory at older tags).
    # goVcsUrl overrides to the correct standalone source repo.
    goVcsUrl: "https://github.com/VictoriaMetrics/VictoriaLogs"

  # -- Prometheus ecosystem --

  - name: "prometheus/prometheus"
    image: "quay.io/prometheus/prometheus"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+$'
      maxTags: 3

  # NOTE: Default exporter tags are busybox-based → NOT patchable.
  # Use -distroless suffixed tags (Copa patches dpkg-distroless via tooling container).
  - name: "prometheus/node-exporter"
    image: "quay.io/prometheus/node-exporter"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-distroless$'
      maxTags: 3

  - name: "prometheus/mysqld-exporter"
    image: "quay.io/prometheus/mysqld-exporter"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
      strategy: "pattern"
      pattern: '^v\d+\.\d+\.\d+-distroless$'
      maxTags: 3

  # prometheus-config-reloader is built from the prometheus-operator monorepo
  # under cmd/prometheus-config-reloader. The image tag tracks the operator
  # release tag (v0.x.y), so the v-prefix maps directly to the upstream git tag.
  - name: "prometheus-operator/prometheus-config-reloader"
    image: "quay.io/prometheus-operator/prometheus-config-reloader"
    platforms: ["linux/amd64", "linux/arm64"]
    tags:
