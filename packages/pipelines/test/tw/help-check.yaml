name: Binary Help Output Validator

description: |
  Verifies binaries respond to help flags and optionally validates help content contains expected strings.
  This test ensures command-line tools properly implement help functionality by testing common help flags
  (--help, -h, etc.) and can verify the output contains usage information, options documentation, or other
  expected content. Essential for validating user-facing CLI tools.

needs:
  packages:
    - help-check

inputs:
  bins:
    description: |
      Binary names to check for help output, one per line.
      Can be a single binary or multiple binaries.
      Examples:
        Single: "nginx"
        Multiple:
          bins: |
            gcc
            g++
            cpp
    required: true
  help-flag:
    description: |
      Command line flag used to get help information.
      Use 'auto' to try common flags automatically: --help, -h, -help, help
      Or specify exact flag like: --help, -h, etc.
    required: false
    default: "auto"
  expect-contains:
    description: |
      Optional string(s) to verify are present in the help output.
      Can be used to ensure help text contains usage information, options documentation, or other
      expected content. Multiple strings can be space-separated and all must be found.
    required: false
    default: ""
  verbose:
    description: |
      Whether or not the output should be verbose
    required: false
    default: false

pipeline:
  - name: "check help information for binaries"
    runs: |
      help-check \
          --bins="${{inputs.bins}}" \
          --help-flag="${{inputs.help-flag}}" \
          --expect-contains="${{inputs.expect-contains}}" \
          --verbose="${{inputs.verbose}}"
