# Adapted from wolfi-dev/os argo-rollouts.yaml at
# 303f4b1dc19a8da93d34240de93a537eead4c2e0 (1.9.0-r15).
package:
  name: argo-rollouts
  version: "1.9.0"
  # r17 fixes CVE-2026-39883, r18 fixes CVE-2026-41178, and r19 rebuilds
  # with Go 1.26.5 for CVE-2026-42505.
  epoch: 19
  description: Progressive Delivery for Kubernetes
  copyright:
    # Upstream LICENSE at the pinned source commit is Apache License 2.0.
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - ${{package.name}}-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout
  resources:
    cpu: "6"
    memory: 12Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - go-1.26=1.26.5-r1
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/argoproj/argo-rollouts
      tag: v${{package.version}}
      expected-commit: 838d4e792be666ec11bd0c80331e0c5511b5010e

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel@v1.44.0
        go.opentelemetry.io/otel/metric@v1.44.0
        go.opentelemetry.io/otel/trace@v1.44.0

  - uses: go/build
    with:
      packages: ./cmd/rollouts-controller
      output: rollouts-controller
      go-package: go-1.26
      ldflags: |
        -X github.com/argoproj/argo-rollouts/utils/version.version=${{package.version}}
        -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
        -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=838d4e792be666ec11bd0c80331e0c5511b5010e
        -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean

test:
  pipeline:
    - runs: |
        rollouts-controller --version | grep -F "${{package.version}}"
        rollouts-controller --help
