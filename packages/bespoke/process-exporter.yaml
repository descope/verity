package:
  name: process-exporter
  version: "0.8.7"
  epoch: 0
  description: "Prometheus exporter that mines /proc to report on selected processes"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"
    GO111MODULE: "on"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ncabatoff/process-exporter
      tag: v${{package.version}}
      expected-commit: e52ab0a1c03d6baf8ed60154c254ecc0008549f3

  - uses: go/build
    with:
      packages: ./cmd/process-exporter
      output: process-exporter
      ldflags: |
        -X main.version=${{package.version}}
        -X main.gitcommit=$(git rev-parse HEAD)

  - uses: strip

update:
  enabled: true
  github:
    identifier: ncabatoff/process-exporter
    strip-prefix: v

test:
  pipeline:
    - runs: |
        process-exporter -version
        process-exporter -h 2>&1 | head -5
