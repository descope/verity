# Bespoke build of dive (container layer explorer).
# Wolfi reference: https://github.com/wolfi-dev/os/blob/main/dive.yaml
# Why bespoke: ships ahead of Wolfi's apk advisory cadence with bumped
# transitive deps (golang.org/x/net, mapstructure, docker/cli) for CVE coverage.

package:
  name: dive
  version: "0.13.1"
  epoch: 0
  description: A tool for exploring each layer in a docker image
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"
    GO111MODULE: "on"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wagoodman/dive
      tag: v${{package.version}}
      expected-commit: fe98c8a2eb08c443a36e3cc7568078909e298433

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
        github.com/go-viper/mapstructure/v2@v2.4.0
        github.com/docker/cli@v29.2.0

  - uses: go/build
    with:
      packages: .
      output: dive
      ldflags: |
        -X main.version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: wagoodman/dive
    strip-prefix: v

test:
  pipeline:
    - runs: |
        dive --version
        dive --help
