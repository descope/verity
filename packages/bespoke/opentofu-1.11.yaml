package:
  name: verity-opentofu-1.11
  version: "1.11.8"
  epoch: 2 # CVE-2026-39827 CVE-2026-39829 CVE-2026-39830 CVE-2026-39832 CVE-2026-39835 CVE-2026-46597
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu=${{package.full-version}}
      - opentofu-1.11=${{package.full-version}}
  resources:
    cpu: "8"
    memory: 8Gi

environment:
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4bd8c80bbd5ca649869bd0f3443b88ae876bc89c
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for opentofu
    dependencies:
      provides:
        - opentofu-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/tofu "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
            - verity-opentofu-1.11-compat
      pipeline:
        - runs: |
            /usr/local/bin/tofu --version | grep -q "${{package.version}}"
            /usr/local/bin/tofu --help

  - name: ${{package.name}}-local-provider-config
    description: Configure opentofu to use local providers
    dependencies:
      provides:
        - opentofu-local-provider-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/opentofu/provider-mirror
          cat > "${{targets.subpkgdir}}"/opentofu/.opentofurc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/opentofu/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - apk-tools
            - verity-opentofu-1.11-local-provider-config
      pipeline:
        - runs: |
            get_installed_version() {
              pkg="$1"
              apk list installed "${pkg}" 2>/dev/null | awk '{print $1}'
            }

            virtual_pkg_name_and_version="opentofu-local-provider-config-${{package.full-version}}"
            maybe_installed_pkg_name_and_version="$(get_installed_version opentofu-local-provider-config)"

            if [ "${virtual_pkg_name_and_version}" = "${maybe_installed_pkg_name_and_version}" ]; then
              echo "FAIL: ${virtual_pkg_name_and_version} is installed." >&2
              exit 1
            fi

            maybe_real_pkg_installed_name_and_version="$(get_installed_version verity-opentofu-1.11-local-provider-config)"
            if [ -z "${maybe_real_pkg_installed_name_and_version}" ]; then
              echo "FAIL: No real package verity-opentofu-1.11-local-provider-config installed for virtual package opentofu-local-provider-config." >&2
              exit 1
            fi

            echo "PASS: ${virtual_pkg_name_and_version} is not installed."
            echo "PASS: ${maybe_real_pkg_installed_name_and_version} is installed."
        - runs: |
            declared_provides="$(apk info --installed --provides --quiet 'verity-opentofu-1.11-local-provider-config' | grep -v '^$')"
            if echo "${declared_provides}" | awk -F'=' '{print $1}' | grep -qx 'opentofu-local-provider-config'; then
              echo "PASS: real package [verity-opentofu-1.11-local-provider-config] correctly declares virtual package [opentofu-local-provider-config]."
              exit 0
            fi

            echo "FAIL: real package [verity-opentofu-1.11-local-provider-config] does not declare virtual package [opentofu-local-provider-config] in 'provides'." >&2
            exit 1

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc'
    - 'beta'
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.11

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
  pipeline:
    # AUTOGENERATED
    - runs: |
        tofu --version
        tofu --help
