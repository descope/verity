package:
  name: verity-opensearch-dashboards-config
  version: "3.6.0"
  epoch: 0
  description: Runtime config guard for Verity OpenSearch Dashboards images
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/verity-opensearch-dashboards-entrypoint" <<'EOF'
      #!/bin/sh
      set -eu

      config="${OPENSEARCH_DASHBOARDS_CONFIG:-/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml}"

      yaml_quote() {
        printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
      }

      has_yaml_key() {
        grep -Eq "^[[:space:]]*$1[[:space:]]*:" "$config"
      }

      if [ -f "$config" ]; then
        config_writable=1
        tmp="$(mktemp "${config}.verity.XXXXXX")"
        sed '/^opensearch_security\./d' "$config" > "$tmp"
        chmod 0644 "$tmp"
        if ! mv "$tmp" "$config"; then
          # ConfigMap subPath mounts cannot be atomically replaced. Fall back to
          # in-place copy when possible; if the mount is read-only, keep the
          # caller-provided config and continue.
          cat "$tmp" > "$config" 2>/dev/null || config_writable=0
          rm -f "$tmp"
        fi

        if [ "$config_writable" -eq 1 ]; then
          if [ -n "${SERVER_HOST:-}" ] && ! has_yaml_key 'server\.host'; then
            printf 'server.host: "%s"\n' "$(yaml_quote "$SERVER_HOST")" >> "$config"
          fi

          if [ -n "${OPENSEARCH_HOSTS:-}" ] && ! has_yaml_key 'opensearch\.hosts'; then
            case "$OPENSEARCH_HOSTS" in
              \[* ) printf 'opensearch.hosts: %s\n' "$OPENSEARCH_HOSTS" >> "$config" ;;
              * ) printf 'opensearch.hosts: ["%s"]\n' "$(yaml_quote "$OPENSEARCH_HOSTS")" >> "$config" ;;
            esac
          elif [ -n "${OPENSEARCH_URL:-}" ] && ! has_yaml_key 'opensearch\.hosts'; then
            printf 'opensearch.hosts: ["%s"]\n' "$(yaml_quote "$OPENSEARCH_URL")" >> "$config"
          fi

          if [ -n "${OPENSEARCH_USERNAME:-}" ] && ! has_yaml_key 'opensearch\.username'; then
            printf 'opensearch.username: "%s"\n' "$(yaml_quote "$OPENSEARCH_USERNAME")" >> "$config"
          fi

          if [ -n "${OPENSEARCH_PASSWORD:-}" ] && ! has_yaml_key 'opensearch\.password'; then
            printf 'opensearch.password: "%s"\n' "$(yaml_quote "$OPENSEARCH_PASSWORD")" >> "$config"
          fi
        fi
      fi

      exec /usr/share/opensearch-dashboards/bin/opensearch-dashboards "$@"
      EOF
      chmod 0755 "${{targets.destdir}}/usr/local/bin/verity-opensearch-dashboards-entrypoint"

test:
  pipeline:
    - runs: |
        test -x /usr/local/bin/verity-opensearch-dashboards-entrypoint
        grep -F "opensearch_security\\." /usr/local/bin/verity-opensearch-dashboards-entrypoint
