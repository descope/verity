package:
  name: apk-repository-signer
  version: "0.0.0"
  epoch: 0
  description: "Verity APK repository signer worker"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - ca-certificates-bundle
      - go-1.26=1.26.5-r1
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

# Signer source is pinned to the protected main revision that introduced the
# audited signer implementation; no mutable branch participates in resolution.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/verity-org/verity
      expected-commit: fffeadbbadd3bfc3c682479aad6648adc4a71d79
      depth: -1

  - uses: go/build
    with:
      packages: .
      output: apk-repository-signer
      go-package: go-1.26
      ldflags: -s -w

  - uses: strip

update:
  enabled: false
