name: jenkins
description: "Jenkins CI server — Wolfi rebuild targets persistent Debian CVEs"
upstream:
  package: "jenkins-{{version}}"

types:
  default:
    base: wolfi-base
    # busybox supplies /bin/sh + coreutils for the chart's `init` container,
    # which runs `sh -c '...'` to apply jcasc config before the main jenkins
    # process starts. Without it the init container fails at runc exec with
    # `sh: executable file not found`. Same shape as the valkey fix in
    # verity-org/verity#327. See verity-org/verity#318 (A.1 shell-missing cluster).
    #
    # openjdk-21-default-jvm provides the JVM runtime + `/usr/bin/java`
    # symlink + `/usr/lib/jvm/default-jvm` alias path that the entrypoint
    # and JAVA_HOME below reference. The wolfi `jenkins` package itself
    # does NOT declare a JVM dependency, so without an explicit JDK pull
    # the container crashes immediately at runc exec with:
    #   exec: "/usr/bin/java": stat /usr/bin/java: no such file or directory
    # → StatefulSet Ready 0/1, helm install --wait timeouts at 10m.
    # Verified against chart-integration run 25662716854, jenkins-0
    # status.lastState.terminated.message. Jenkins LTS 2.x requires Java
    # 17+; we choose 21 for parity with cassandra.yaml + maven.yaml +
    # openjdk.yaml versioning.
    #
    # `jenkins-{{version}}` (i.e. `jenkins-2`) is a SHELL package in wolfi —
    # it ships no files of its own. The actual jenkins.war is shipped by the
    # `jenkins-{{version}}-openjdk-21` subpackage (also `-openjdk-25`), which
    # installs the war at /usr/share/java/jenkins/jenkins.war (the path our
    # `entrypoint:` below already targets and the upstream helm chart
    # hardcodes). Without the subpackage in `packages:`, the published image
    # was missing the war entirely, producing
    # `Error: Unable to access jarfile /usr/share/java/jenkins/jenkins.war`
    # at container startup. Choosing openjdk-21 (LTS) over openjdk-25 (newest)
    # to match the Jenkins LTS targeting in the helm chart's default JVM tier.
    # Verified via gh api against wolfi-dev/os/jenkins-2.yaml (subpackage
    # range over openjdk-versions, pipeline `mv war/target/jenkins.war
    # ${{targets.contextdir}}/usr/share/java/jenkins/`). See
    # SCR-2026-05-14-001 Bucket B + jenkins drill.
    packages: ["jenkins-{{version}}", "jenkins-{{version}}-openjdk-21", "busybox", "openjdk-21-default-jvm"]
    entrypoint: /usr/bin/java -jar /usr/share/java/jenkins/jenkins.war
    environment:
      JENKINS_HOME: /var/jenkins_home
      JAVA_HOME: /usr/lib/jvm/default-jvm
    paths:
      - {path: /var/jenkins_home, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /usr/share/jenkins/ref, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "2": {}
