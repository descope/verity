name: kubectx
description: "kubectx & kubens — Kubernetes context/namespace switchers; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: kubectx

types:
  default:
    base: wolfi-base
    packages: ["kubectx"]
    entrypoint: /usr/bin/kubectx
    melange:
      bespoke: "kubectx.yaml"

versions:
  # renovate: datasource=github-tags depName=ahmetb/kubectx versioning=semver-coerced
  "0.11.0":
    latest: true
