name: kyverno
description: "Kyverno policy engine — Wolfi rebuild replaces Copa-patched distroless"
upstream:
  package: "kyverno-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["kyverno-{{version}}"]
    entrypoint: /usr/bin/kyverno
    melange:
      bespoke:
        - kyverno-1.14.yaml
        - kyverno-1.15.yaml
        - kyverno-1.16.yaml
        - kyverno-1.17.yaml
        - kyverno-1.18.yaml

versions:
  "1":
    latest: true
  "1.14": {}
  "1.15": {}
  "1.16": {}
  "1.17": {}
  "1.18": {}
