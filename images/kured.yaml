name: kured
description: "Kured — Kubernetes Reboot Daemon; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: kured

types:
  default:
    base: wolfi-base
    packages: ["kured"]
    entrypoint: /usr/bin/kured
    melange:
      bespoke: "kured.yaml"

versions:
  # renovate: datasource=github-tags depName=kubereboot/kured versioning=semver-coerced
  "1.21.0":
    latest: true
