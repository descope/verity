name: kured
description: "Kured — Kubernetes Reboot Daemon; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: kured

types:
  default:
    base: wolfi-base
    packages: ["kured"]
    entrypoint: /usr/bin/kured
    melange:
      bespoke: "kured.yaml"

versions:
  "1.21.0":
    latest: true
