name: goss
description: "Goss — quick and easy server/container validation; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: goss

types:
  default:
    base: wolfi-base
    packages: ["goss"]
    entrypoint: /usr/bin/goss
    melange:
      bespoke: "goss.yaml"

versions:
  # renovate: datasource=github-tags depName=goss-org/goss versioning=semver-coerced
  "0.4.9":
    latest: true
