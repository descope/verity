name: squid
description: "Squid caching proxy — Wolfi rebuild for zero-CVE base"
upstream:
  package: squid

types:
  default:
    base: wolfi-base
    packages: ["squid"]
    entrypoint: /usr/bin/squid
    paths:
      - {path: /etc/squid, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/cache/squid, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/log/squid, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "7": {}
