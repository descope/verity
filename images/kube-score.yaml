name: kube-score
description: "kube-score — Kubernetes object analysis & scoring; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: kube-score

types:
  default:
    base: wolfi-base
    packages: ["kube-score"]
    entrypoint: /usr/bin/kube-score
    cmd: version
    melange:
      bespoke: "kube-score.yaml"

versions:
  # renovate: datasource=github-tags depName=zegl/kube-score versioning=semver-coerced
  "1.20.0":
    latest: true
