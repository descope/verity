name: ollama
description: "Ollama model runner — Wolfi rebuild replaces dirty upstream image"
upstream:
  package: ollama

types:
  default:
    base: wolfi-base
    packages: ["ollama"]
    entrypoint: /usr/bin/ollama
    cmd: serve
    paths:
      - {path: /root/.ollama, type: directory, uid: 0, gid: 0, permissions: 0o755}

versions:
  "0": {}
