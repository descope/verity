name: coredns
description: "CoreDNS — Copa can't patch scratch-based official image; Wolfi rebuild"
upstream:
  package: coredns

types:
  default:
    base: wolfi-base
    packages: ["verity-coredns-1.14"]
    entrypoint: /usr/bin/coredns
    paths:
      - {path: /etc/coredns, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      bespoke: "coredns-1.14.yaml"

  fips:
    base: wolfi-base
    fips-profile: go
    packages: ["verity-coredns-1.14"]
    entrypoint: /usr/bin/coredns
    environment:
      GODEBUG: "fips140=on"
    paths:
      - {path: /etc/coredns, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      upstream: "coredns-1.14"
      env-file: "fips.env"

versions:
  "1":
    skip-types: [fips]  # go/bump + GOFIPS140 fails: golang/go#73649
