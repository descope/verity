name: coredns
description: "CoreDNS — Copa can't patch scratch-based official image; Wolfi rebuild"
upstream:
  package: coredns

types:
  default:
    base: wolfi-base
    packages: ["coredns-1.14"]
    entrypoint: /usr/bin/coredns
    paths:
      - {path: /etc/coredns, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  fips:
    base: wolfi-base
    fips-profile: go
    packages: ["coredns-1.14"]
    entrypoint: /usr/bin/coredns
    environment:
      GODEBUG: "fips140=on"
    paths:
      - {path: /etc/coredns, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      upstream: "coredns-1.14"
      env-file: "fips.env"

versions:
  "1":
    skip-types: [default, fips]  # 1.14 has CVE-2026-40898; fips also hits golang/go#73649
