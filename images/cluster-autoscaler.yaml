name: cluster-autoscaler
description: "Kubernetes Cluster Autoscaler — Wolfi rebuild replaces Copa-patched upstream with zero-CVE base"
upstream:
  package: cluster-autoscaler-1.35

types:
  default:
    base: wolfi-base
    packages: ["cluster-autoscaler-1.35"]
    entrypoint: /usr/bin/cluster-autoscaler
    paths:
      # kubernetes/autoscaler helm chart's StatefulSet hardcodes the
      # container command as `["./cluster-autoscaler", ...]` with the
      # default workingDir (`/`), so the kernel resolves it as
      # `/cluster-autoscaler`. Verity's wolfi rebuild ships at
      # `/usr/bin/cluster-autoscaler` (FHS). Symlink keeps both layouts
      # working. Same shape as velero (#330) and etcd (#330).
      # See verity-org/verity#318 (A.2 FHS-path mismatch sub-cluster).
      - {path: /cluster-autoscaler, type: symlink, source: /usr/bin/cluster-autoscaler, uid: 0, gid: 0}
      # Published `ghcr.io/verity-org/cluster-autoscaler:latest` ships
      # `/usr/bin/cluster-autoscaler` with mode 0o000 — `runc` aborts with
      # `exec: "./cluster-autoscaler": permission denied`. Declaring the path
      # forces apko to apply +x during layer assembly. type: hardened-binary
      # is apko's binary-mode marker (used for chmod-on-existing-file, not
      # mkdir); the integer renderer forwards unknown types to apko as-is.
      # See SCR-2026-05-14-001 Bucket H + image-mode-audit.md.
      - {path: /usr/bin/cluster-autoscaler, type: hardened-binary, uid: 0, gid: 0, permissions: 0o755}

versions:
  "1.35": {}
