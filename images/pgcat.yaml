name: pgcat
description: "pgCat PostgreSQL pooler/proxy — Wolfi rebuild for zero-CVE base"
upstream:
  package: pgcat

types:
  default:
    base: wolfi-base
    packages: ["pgcat"]
    entrypoint: /usr/bin/pgcat
    paths:
      - {path: /etc/pgcat, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
