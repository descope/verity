name: dotnet
description: ".NET runtime and SDK — drop-in for dotnet/sdk, dotnet/runtime, dotnet/aspnet; Wolfi rebuild"
upstream:
  package: "dotnet-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["dotnet-{{version}}-runtime"]
    entrypoint: /usr/bin/dotnet
    cmd: --info
    work-dir: /app
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
    paths:
      - {path: /app, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  sdk:
    base: wolfi-base
    packages: ["dotnet-{{version}}", "dotnet-{{version}}-sdk"]
    entrypoint: /usr/bin/dotnet
    work-dir: /app
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      NUGET_XMLDOC_MODE: skip
    paths:
      - {path: /app, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /root/.nuget, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  aspnet:
    base: wolfi-base
    packages: ["dotnet-{{version}}-runtime", "aspnet-{{version}}-runtime"]
    entrypoint: /usr/bin/dotnet
    work-dir: /app
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ASPNETCORE_URLS: "http://+:8080"
    paths:
      - {path: /app, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  sdk-fips:
    base: wolfi-fips
    # Runtime-proven 2026-07-02: ChaCha20Poly1305 (default-provider-only) is
    # rejected in-process, AES-GCM and SHA-2 are served by the active fips
    # 3.1.2 provider. Known caveat: MD5.HashData still computes because
    # upstream .NET fetches MD5 with a "-fips" property query on purpose
    # (dotnet/runtime pal_evp.c: "We should not fail to fetch MD5 even on a
    # FIPS enforced system") - an upstream compat decision for non-security
    # uses, not a wiring gap.
    fips-profile: openssl
    packages: ["dotnet-{{version}}", "dotnet-{{version}}-sdk", "openssl-provider-fips"]
    entrypoint: /usr/bin/openssl-fips-entrypoint /usr/bin/dotnet
    work-dir: /app
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      OPENSSL_MODULES: /usr/lib/ossl-modules
      OPENSSL_CONF: /etc/ssl/openssl-fips.cnf
    melange:
      bespoke:
        - "dotnet-8.yaml"
        - "openssl-provider-fips.yaml"
    paths:
      - {path: /app, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "8": {}
  "9":
    melange:
      sdk-fips:
        bespoke: "openssl-provider-fips.yaml"
  "10":
    melange:
      sdk-fips:
        bespoke: "openssl-provider-fips.yaml"
