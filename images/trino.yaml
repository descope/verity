name: trino
description: "Trino distributed SQL query engine — Wolfi rebuild for zero-CVE base"
upstream:
  package: trino

types:
  default:
    base: wolfi-base
    packages: ["trino"]
    entrypoint: /usr/bin/trino
    paths:
      - {path: /etc/trino, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /data/trino, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "474-r2": {}
