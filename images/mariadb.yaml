name: mariadb
description: "MariaDB database server — Wolfi rebuild targets persistent Debian CVEs"
upstream:
  package: "mariadb-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["mariadb-{{version}}"]
    entrypoint: mariadbd
    work-dir: /var/lib/mysql
    environment:
      MYSQL_UNIX_PORT: /var/run/mysqld/mysqld.sock
      MARIADB_AUTO_UPGRADE: "1"
    paths:
      - {path: /var/lib/mysql, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /var/run/mysqld, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /docker-entrypoint-initdb.d, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  fips:
    base: wolfi-fips
    # Stays `review`: empirically NOT promotable to the openssl profile.
    # 2026-07-02 runtime test with openssl-provider-fips wired in: `openssl
    # list -providers` showed fips 3.1.2 active, yet `SELECT MD5('x')`
    # returned a digest — mariadbd's SQL crypto uses bundled implementations
    # that bypass OpenSSL EVP, so the provider governs only TLS, not the
    # server's crypto surface. Claiming the openssl profile would overstate
    # FIPS coverage. Contrast postgres, where md5() fails under the provider.
    fips-profile: review
    packages: ["mariadb-{{version}}"]
    entrypoint: mariadbd
    work-dir: /var/lib/mysql
    environment:
      MYSQL_UNIX_PORT: /var/run/mysqld/mysqld.sock
      MARIADB_AUTO_UPGRADE: "1"
      OPENSSL_MODULES: /usr/lib/ossl-modules
      OPENSSL_CONF: /etc/ssl/openssl-fips.cnf
    paths:
      - {path: /var/lib/mysql, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /var/run/mysqld, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /docker-entrypoint-initdb.d, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "10.11": {}
  "11.4": {}
  "11.8": {}
