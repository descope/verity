name: stunnel
description: "stunnel TLS wrapper — Wolfi rebuild for zero-CVE base"
upstream:
  package: stunnel

types:
  default:
    base: wolfi-base
    packages: ["stunnel"]
    entrypoint: /usr/bin/stunnel
    paths:
      - {path: /etc/stunnel, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "5": {}
