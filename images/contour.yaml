name: contour
description: "Contour Kubernetes ingress controller — Wolfi's apks lag the advisory DB; bespoke build from source"
upstream:
  package: contour

types:
  default:
    base: wolfi-base
    packages: ["contour"]
    entrypoint: /usr/bin/contour
    melange:
      bespoke: "contour.yaml"

versions:
  "1.33.4":
    latest: true
