name: snmp-exporter
description: "Prometheus SNMP Exporter — bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: snmp-exporter

types:
  default:
    base: wolfi-base
    packages: ["snmp-exporter"]
    entrypoint: /usr/bin/snmp_exporter
    melange:
      bespoke: "snmp-exporter.yaml"

versions:
  "0.30.1":
    latest: true
