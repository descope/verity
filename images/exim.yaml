name: exim
description: "Exim mail transfer agent — Wolfi rebuild for zero-CVE base"
upstream:
  package: exim

types:
  default:
    base: wolfi-base
    packages: ["exim"]
    entrypoint: /usr/bin/exim
    paths:
      - {path: /etc/exim, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/spool/exim, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/log/exim, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "4": {}
