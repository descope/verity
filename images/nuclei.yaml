name: nuclei
description: "Nuclei — fast template-based vulnerability scanner; Wolfi rebuild for zero-CVE base"
upstream:
  package: nuclei

types:
  default:
    base: wolfi-base
    packages: ["nuclei"]
    entrypoint: /usr/bin/nuclei
    work-dir: /home/nonroot
    environment:
      HOME: /home/nonroot
    paths:
      - {path: /home/nonroot, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /home/nonroot/.config, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /home/nonroot/.config/nuclei, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "3": {}
