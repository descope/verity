name: neo4j
description: "Neo4j graph database — Wolfi rebuild for zero-CVE base"
upstream:
  package: neo4j-2026.01

types:
  default:
    base: wolfi-base
    packages: ["neo4j-2026.01"]
    entrypoint: /usr/bin/neo4j
