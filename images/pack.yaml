name: pack
description: "Pack — Cloud Native Buildpacks CLI; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: pack

types:
  default:
    base: wolfi-base
    packages: ["pack"]
    entrypoint: /usr/bin/pack
    melange:
      bespoke: "pack.yaml"

versions:
  # renovate: datasource=github-tags depName=buildpacks/pack versioning=semver-coerced
  "0.40.4":
    latest: true
