name: victoriametrics
description: "VictoriaMetrics time-series DB — Wolfi rebuild for zero-CVE base"
upstream:
  package: victoriametrics

types:
  default:
    base: wolfi-base
    packages: ["victoriametrics"]
    entrypoint: /usr/bin/victoria-metrics
    paths:
      - {path: /victoria-metrics-data, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
