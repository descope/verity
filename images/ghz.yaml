name: ghz
description: "ghz — gRPC benchmarking and load testing; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: ghz

types:
  default:
    base: wolfi-base
    packages: ["ghz"]
    entrypoint: /usr/bin/ghz
    melange:
      bespoke: "ghz.yaml"

versions:
  # renovate: datasource=github-tags depName=bojand/ghz versioning=semver-coerced
  "0.121.0":
    latest: true
