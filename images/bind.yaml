name: bind
description: "ISC BIND DNS server — Wolfi rebuild for zero-CVE base"
upstream:
  package: bind

types:
  default:
    base: wolfi-base
    packages: ["bind"]
    entrypoint: /usr/bin/named
    paths:
      - {path: /etc/bind, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/cache/bind, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/lib/bind, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "9": {}
