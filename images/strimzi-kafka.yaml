name: strimzi-kafka
description: "Strimzi Kafka Operator — Wolfi rebuild replaces Copa-patched RHEL/Java base"
upstream:
  package: "strimzi-kafka-operator-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["strimzi-kafka-operator-{{version}}"]
    entrypoint: /usr/bin/strimzi-kafka-operator
    environment:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk

versions:
  "0.50": {}
