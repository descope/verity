name: strimzi-kafka
description: "Strimzi Kafka Operator — Wolfi rebuild replaces Copa-patched RHEL/Java base"
upstream:
  package: "strimzi-kafka-operator"

types:
  default:
    base: wolfi-base
    packages: ["strimzi-kafka-operator"]
    entrypoint: /opt/strimzi/bin/launch_java.sh
    environment:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk

versions:
  "latest": {}
