name: gitea
description: "Gitea self-hosted Git service — Wolfi rebuild targets upstream Alpine/Debian CVEs"
upstream:
  package: gitea

types:
  default:
    base: wolfi-base
    packages: ["gitea"]
    entrypoint: /usr/bin/gitea
    paths:
      - {path: /data, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
