name: popeye
description: "Popeye — Kubernetes cluster resource sanitizer; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: popeye

types:
  default:
    base: wolfi-base
    packages: ["popeye"]
    entrypoint: /usr/bin/popeye
    melange:
      bespoke: "popeye.yaml"

versions:
  # renovate: datasource=github-tags depName=derailed/popeye versioning=semver-coerced
  "0.22.1":
    latest: true
