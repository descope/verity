name: kubeshark
description: "Kubeshark — Wireshark-like API traffic viewer for Kubernetes; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: kubeshark

types:
  default:
    base: wolfi-base
    packages: ["kubeshark"]
    entrypoint: /usr/bin/kubeshark
    melange:
      bespoke: "kubeshark.yaml"

versions:
  "53.2.5":
    latest: true
