name: opentelemetry-collector
description: "OpenTelemetry Collector — Copa can't patch distroless-based official image; Wolfi rebuild"
upstream:
  package: opentelemetry-collector

types:
  default:
    base: wolfi-base
    packages: ["opentelemetry-collector"]
    entrypoint: /usr/bin/otelcol
    paths:
      - {path: /etc/otelcol, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "0": {}
