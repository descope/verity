name: grafana-alloy
description: "Grafana Alloy OpenTelemetry distribution — Copa can't patch distroless-based official image; Wolfi rebuild"
upstream:
  package: grafana-alloy

types:
  default:
    base: wolfi-base
    packages: ["grafana-alloy"]
    entrypoint: /usr/bin/alloy
    paths:
      - {path: /etc/alloy, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/lib/alloy, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
