name: openjdk
description: "OpenJDK — drop-in for eclipse-temurin; Wolfi rebuild from source with <24hr CVE response"
upstream:
  package: "openjdk-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["openjdk-{{version}}", "openjdk-{{version}}-default-jvm"]
    entrypoint: /usr/bin/java
    cmd: -version
    work-dir: /app
    environment:
      JAVA_HOME: /usr/lib/jvm/java-{{version}}-openjdk
      PATH: /usr/lib/jvm/java-{{version}}-openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: en_US.UTF-8
    paths:
      - {path: /app, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  jre:
    base: wolfi-base
    packages: ["openjdk-{{version}}-jre", "openjdk-{{version}}-default-jvm"]
    entrypoint: /usr/bin/java
    work-dir: /app
    environment:
      JAVA_HOME: /usr/lib/jvm/java-{{version}}-openjdk
      PATH: /usr/lib/jvm/java-{{version}}-openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: en_US.UTF-8
    paths:
      - {path: /app, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  # No fips variant: JVM crypto goes through JCE providers (SunJCE et al),
  # not OpenSSL, so the openssl provider cannot govern Java workloads.
  # A fips tag requires a FIPS-validated JCE provider (e.g. Bouncy Castle
  # BC-FIPS) wired via java.security, which Wolfi does not ship.
  # Reviewed 2026-07-02.

versions:
  "17": {}
  "21": {}
  "25": {}
