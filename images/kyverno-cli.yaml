name: kyverno-cli
description: "Kyverno CLI — Wolfi rebuild"
upstream:
  package: "kyverno-cli-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["kyverno-cli-{{version}}"]
    entrypoint: /usr/bin/kubectl-kyverno
    melange:
      bespoke: "kyverno-cli-{{version}}.yaml"

versions:
  "1.14": {}
  "1.15": {}
  "1.16": {}
  "1.17": {}
  "1.18":
    latest: true
