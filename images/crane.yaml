name: crane
description: "crane OCI registry tool — Copa can't patch distroless-based official image; bespoke Wolfi build"
upstream:
  package: crane

types:
  default:
    base: wolfi-base
    packages: ["crane"]
    entrypoint: /usr/bin/crane
    melange:
      bespoke: "crane.yaml"

  fips:
    base: wolfi-base
    fips-profile: go
    packages: ["crane"]
    entrypoint: /usr/bin/crane
    environment:
      GODEBUG: "fips140=on"
    melange:
      upstream: "crane"
      env-file: "fips.env"

versions:
  # renovate: datasource=github-tags depName=google/go-containerregistry versioning=semver-coerced
  "0.21.7":
    latest: true
