name: fluentd
description: "Fluentd log collector — Wolfi rebuild replaces Copa-patched Debian"
upstream:
  package: "ruby3.2-fluentd-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["ruby3.2-fluentd-{{version}}"]
    entrypoint: /usr/bin/fluentd
    environment:
      GEM_HOME: /usr/lib/ruby/gems/3.2.0
    paths:
      - {path: /var/log/fluent, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /etc/fluent, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
