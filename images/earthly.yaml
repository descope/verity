name: earthly
description: "Earthly — build automation for the container era; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: earthly

types:
  default:
    base: wolfi-base
    packages: ["earthly"]
    entrypoint: /usr/bin/earthly
    melange:
      bespoke: "earthly.yaml"

versions:
  # renovate: datasource=github-tags depName=earthly/earthly versioning=semver-coerced
  "0.8.16":
    latest: true
