name: bird
description: "BIRD Internet Routing Daemon — Wolfi rebuild for zero-CVE base"
upstream:
  package: bird

types:
  default:
    base: wolfi-base
    packages: ["bird"]
    entrypoint: /usr/bin/bird
    paths:
      - {path: /etc/bird, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/run/bird, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "3": {}
