name: vault
description: "HashiCorp Vault secrets manager — Wolfi rebuild targets Debian CVEs"
upstream:
  package: vault

types:
  default:
    base: wolfi-base
    packages: ["vault"]
    entrypoint: vault server
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      HOME: /home/vault
    paths:
      - {path: /vault/config, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /vault/data, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /vault/logs, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /home/vault, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  fips:
    base: wolfi-fips
    # Stays `review`: vault is a Go binary whose crypto is Go's stdlib, not
    # OpenSSL, so openssl-provider-fips wiring would be a false claim. The
    # honest path is a Go-FIPS rebuild (GOFIPS140, like etcd/argocd), but
    # vault has no packages/upstream.lock.json entry to rebuild from.
    # Reviewed 2026-07-02; promote via the go profile once a lock entry and
    # a proven GOFIPS140 build exist.
    fips-profile: review
    packages: ["vault"]
    entrypoint: vault server
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      HOME: /home/vault
      OPENSSL_MODULES: /usr/lib/ossl-modules
      OPENSSL_CONF: /etc/ssl/openssl-fips.cnf
    paths:
      - {path: /vault/config, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /vault/data, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /vault/logs, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /home/vault, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
