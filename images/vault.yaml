name: vault
description: "HashiCorp Vault secrets manager — Wolfi rebuild targets Debian CVEs"
upstream:
  package: vault

types:
  default:
    base: wolfi-base
    packages: ["vault"]
    entrypoint: vault server
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      HOME: /home/vault
    paths:
      - {path: /vault/config, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /vault/data, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /vault/logs, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /home/vault, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  fips:
    base: wolfi-base
    fips-profile: go
    # Go-FIPS rebuild from upstream source (bespoke recipe): wolfi removed
    # its vault recipe at the BUSL relicense and the remaining wolfi apk is
    # a stale 1.14.1 with known CVEs, so the FIPS variant builds the current
    # release with GOFIPS140=v1.0.0 (via fips.env). Built without the web
    # UI; API/CLI unaffected. See packages/bespoke/vault-fips.yaml.
    packages: ["vault"]
    entrypoint: vault server
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      HOME: /home/vault
      GODEBUG: "fips140=on"
    melange:
      bespoke: "vault-fips.yaml"
      env-file: "fips.env"
    paths:
      - {path: /vault/config, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /vault/data, type: directory, uid: 65532, gid: 65532, permissions: 0o700}
      - {path: /vault/logs, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /home/vault, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  # default ships the wolfi vault apk (1.14.x line); the fips variant is a
  # bespoke source build of the current release, so each version label only
  # publishes the type whose contents match it.
  "1":
    skip-types: [fips]
  "2":
    skip-types: [default]
