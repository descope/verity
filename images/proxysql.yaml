name: proxysql
description: "ProxySQL — high-perf MySQL proxy — Wolfi rebuild for zero-CVE base"
upstream:
  package: proxysql

types:
  default:
    base: wolfi-base
    packages: ["proxysql"]
    entrypoint: /usr/bin/proxysql -f -F
    paths:
      - {path: /etc/proxysql, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/lib/proxysql, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "3": {}
