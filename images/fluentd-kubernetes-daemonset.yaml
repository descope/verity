name: fluentd-kubernetes-daemonset
description: "Fluentd Kubernetes DaemonSet — Wolfi rebuild replaces Copa-patched Debian"
upstream:
  package: "ruby3.2-fluentd-kubernetes-daemonset-{{version}}-kinesis"

types:
  default:
    base: wolfi-base
    packages: ["ruby3.2-fluentd-kubernetes-daemonset-{{version}}-kinesis"]
    entrypoint: /fluentd/entrypoint.sh
    environment:
      FLUENTD_CONF: fluent.conf
    paths:
      - {path: /var/log/fluent, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /etc/fluent, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
