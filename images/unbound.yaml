name: unbound
description: "Unbound DNS resolver — Wolfi rebuild for zero-CVE base"
upstream:
  package: unbound

types:
  default:
    base: wolfi-base
    packages: ["unbound"]
    entrypoint: /usr/bin/unbound
    paths:
      - {path: /etc/unbound, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
