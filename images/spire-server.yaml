name: spire-server
description: "SPIFFE SPIRE Server — Wolfi rebuild replaces Copa-patched Alpine base"
upstream:
  package: "spire-server-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["spire-server-{{version}}"]
    entrypoint: /usr/bin/spire-server
    paths:
      - {path: /opt/spire, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /run/spire/server, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1.14": {}
