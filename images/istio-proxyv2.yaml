name: istio-proxyv2
description: "Istio Proxy (Envoy) — Wolfi rebuild replaces Copa-patched Ubuntu base"
upstream:
  package: "istio-envoy-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["istio-envoy-{{version}}", "istio-pilot-agent-{{version}}"]
    entrypoint: /usr/bin/pilot-agent
    melange:
      bespoke: "istio-pilot-agent-{{version}}.yaml"

versions:
  "1":
    latest: true
  "1.25": {}
  "1.26": {}
  "1.27": {}
  "1.28": {}
  "1.29": {}
  "1.30": {}
