name: clamav
description: "ClamAV antivirus daemon — Wolfi rebuild for zero-CVE base"
upstream:
  package: clamav-daemon

types:
  default:
    base: wolfi-base
    packages: ["clamav-daemon"]
    entrypoint: /usr/bin/clamd --foreground
    paths:
      - {path: /etc/clamav, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/lib/clamav, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/log/clamav, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /run/clamav, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
