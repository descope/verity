name: checkov
description: "Bridgecrew Checkov IaC scanner — Wolfi removed the package upstream; bespoke build from source"
upstream:
  package: checkov

types:
  default:
    base: wolfi-base
    packages: ["checkov"]
    entrypoint: /usr/bin/checkov
    melange:
      bespoke: "checkov.yaml"

versions:
  "3.2.524":
    latest: true
