name: checkov
description: "Bridgecrew Checkov IaC scanner — Wolfi removed the package upstream; bespoke build from source"
upstream:
  package: checkov

types:
  default:
    base: wolfi-base
    packages: ["checkov"]
    entrypoint: /usr/bin/checkov
    cmd: --version
    melange:
      bespoke: "checkov.yaml"

versions:
  # renovate: datasource=github-tags depName=bridgecrewio/checkov versioning=semver-coerced
  "3.2.533":
    latest: true
