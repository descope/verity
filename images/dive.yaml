name: dive
description: "Dive container image analyzer — bespoke Wolfi rebuild targets upstream CVEs"
upstream:
  package: dive

types:
  default:
    base: wolfi-base
    packages: ["dive"]
    entrypoint: /usr/bin/dive
    melange:
      bespoke: "dive.yaml"

versions:
  # renovate: datasource=github-tags depName=wagoodman/dive versioning=semver-coerced
  "0.13.1":
    latest: true
