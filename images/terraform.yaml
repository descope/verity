name: terraform
description: "OpenTofu (Terraform-compatible) — Copa can't patch Alpine; Wolfi rebuild of BSL-free fork"
upstream:
  package: "opentofu-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["opentofu-{{version}}"]
    entrypoint: /usr/bin/tofu
    work-dir: /workspace
    paths:
      - {path: /workspace, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  fips:
    base: wolfi-base
    fips-profile: go
    packages: ["opentofu-{{version}}"]
    entrypoint: /usr/bin/tofu
    work-dir: /workspace
    environment:
      GODEBUG: "fips140=on"
    paths:
      - {path: /workspace, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      upstream: "terraform"
      env-file: "fips.env"

versions:
  "1.10":
    skip-types: [fips]
  "1.11":
    skip-types: [fips]
