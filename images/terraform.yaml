name: terraform
description: "OpenTofu (Terraform-compatible) — Copa can't patch Alpine; Wolfi rebuild of BSL-free fork"
upstream:
  package: "opentofu-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["verity-opentofu-{{version}}"]
    entrypoint: /usr/bin/tofu
    cmd: version
    work-dir: /workspace
    paths:
      - {path: /workspace, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      bespoke: "opentofu-{{version}}.yaml"

  fips:
    base: wolfi-base
    fips-profile: go
    packages: ["verity-opentofu-1.11"]
    entrypoint: /usr/bin/tofu
    work-dir: /workspace
    environment:
      GODEBUG: "fips140=on"
    paths:
      - {path: /workspace, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      bespoke: "opentofu-1.11.yaml"
      env-file: "fips.env"

versions:
  "1.10":
    skip-types: [fips]
  "1.11": {}
  "1.12":
    skip-types: [fips]
