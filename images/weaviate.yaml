name: weaviate
description: "Weaviate vector database — Wolfi rebuild for zero-CVE base"
upstream:
  package: weaviate

types:
  default:
    base: wolfi-base
    packages: ["weaviate"]
    entrypoint: /usr/bin/weaviate
    cmd: --help
    melange:
      bespoke: weaviate.yaml
    paths:
      - {path: /var/lib/weaviate, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
