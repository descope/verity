name: terragrunt
description: "Terragrunt — thin Terraform wrapper for keeping configurations DRY; Wolfi rebuild for zero-CVE base"
upstream:
  package: terragrunt

types:
  default:
    base: wolfi-base
    packages: ["terragrunt"]
    entrypoint: /usr/bin/terragrunt
    work-dir: /workspace
    paths:
      - {path: /workspace, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "1": {}
