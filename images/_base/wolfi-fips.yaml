include: images/_base/wolfi-base.yaml

# Placeholder/review base for OpenSSL FIPS images.
# OpenSSL FIPS provider artifacts are not shipped in public Wolfi yet, so
# variants using this base stay review-only until those artifacts exist.

environment:
  OPENSSL_MODULES: /usr/lib/ossl-modules
  OPENSSL_CONF: /etc/ssl/openssl-fips.cnf
