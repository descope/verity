name: tempo
description: "Grafana Tempo trace backend — family-owned immutable 2.10 Wolfi rebuild"
upstream:
  package: tempo

types:
  default:
    base: wolfi-base
    packages: ["tempo-2.10"]
    entrypoint: /usr/bin/tempo
    melange:
      bespoke: tempo-2.10.yaml
    paths:
      - {path: /var/tempo, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "2": {}
  "2.10.0": {}
