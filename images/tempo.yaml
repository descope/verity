name: tempo
description: "Grafana Tempo trace backend — Copa can't patch distroless-based official image; Wolfi rebuild"
upstream:
  package: tempo

types:
  default:
    base: wolfi-base
    packages: ["tempo"]
    entrypoint: /usr/bin/tempo
    paths:
      - {path: /var/tempo, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "2": {}
