name: tracee
description: "Tracee — eBPF-based runtime security and forensics; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: tracee

types:
  default:
    base: wolfi-base
    packages: ["tracee"]
    entrypoint: /usr/bin/tracee
    cmd: --help
    melange:
      bespoke: "tracee.yaml"

versions:
  # renovate: datasource=github-tags depName=aquasecurity/tracee versioning=semver-coerced
  "0.24.1":
    latest: true
