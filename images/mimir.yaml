name: mimir
description: "Grafana Mimir metrics backend — Wolfi rebuild targets Debian CVEs"
upstream:
  package: "grafana-mimir-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["grafana-mimir-{{version}}"]
    entrypoint: /usr/bin/mimir
    paths:
      - {path: /etc/mimir, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/lib/mimir, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      # Wolfi `grafana-mimir-3.0` package installs the binary at
      # `/usr/bin/grafana-mimir`, but the mimir-distributed helm chart
      # invokes `/usr/bin/mimir` (consistent with upstream `grafana/mimir`
      # image's binary path). Symlink keeps both layouts working — same
      # FHS-adapter pattern as etcd / fluent-bit / velero in verity-org/verity#330.
      # All 8 mimir components (alertmanager, compactor, distributor,
      # ingester×3, querier, etc.) run the same binary with different
      # `-target=...` flags, so this one symlink unblocks the whole shard.
      # See verity-org/verity#318 (A.2 sub-cluster).
      - {path: /usr/bin/mimir, type: symlink, source: /usr/bin/grafana-mimir, uid: 0, gid: 0}
      # `crane export ghcr.io/verity-org/mimir:latest` confirms the real
      # binary at `/usr/bin/grafana-mimir` ships with mode `0o000` — `runc`
      # aborts with `exec: "/usr/bin/mimir": permission denied`. Declaring
      # the binary path with `type: permissions` (apko's canonical
      # path-mode mutation type) forces +x on layer assembly.
      # See SCR-2026-05-14-001 Bucket H + evidences/.../image-mode-audit.md.
      - {path: /usr/bin/grafana-mimir, type: permissions, uid: 0, gid: 0, permissions: 0o755}

versions:
  "3.0": {}
