name: opensearch-dashboards
description: "OpenSearch Dashboards — Wolfi rebuild targets upstream CVEs"
upstream:
  package: "opensearch-dashboards-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["opensearch-dashboards-{{version}}"]
    # The apk does not ship `opensearch-dashboards-docker-entrypoint.sh`
    # (that script is a Docker-build artifact upstream, not an apk payload).
    # Published image's entrypoint failed with `exec: no such file or
    # directory`. Use the real CLI shipped by the apk at
    # /usr/share/opensearch-dashboards/bin/opensearch-dashboards.
    # See SCR-2026-05-14-001 Bucket B.
    entrypoint: /usr/share/opensearch-dashboards/bin/opensearch-dashboards
    environment:
      OPENSEARCH_DASHBOARDS_HOME: /usr/share/opensearch-dashboards
    paths:
      - {path: /usr/share/opensearch-dashboards/data, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /usr/share/opensearch-dashboards/config, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "3": {}
