name: vegeta
description: "Vegeta — HTTP load testing tool; bespoke Wolfi build (not in upstream apk repo)"
upstream:
  package: vegeta

types:
  default:
    base: wolfi-base
    packages: ["vegeta"]
    entrypoint: /usr/bin/vegeta
    melange:
      bespoke: "vegeta.yaml"

versions:
  # renovate: datasource=github-tags depName=tsenart/vegeta versioning=semver-coerced
  "12.13.0":
    latest: true
