name: cilium
description: "Cilium eBPF networking agent — bespoke source rebuild replaces patched Ubuntu"
upstream:
  package: "cilium-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["cilium-{{version}}"]
    entrypoint: /usr/bin/cilium-agent
    paths:
      - {path: /var/run/cilium, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
      - {path: /var/lib/cilium, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      upstream: "cilium-{{version}}"

versions:
  "1.19": {}
