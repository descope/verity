name: vcluster
description: "vcluster — virtual Kubernetes clusters in a namespace; bespoke Wolfi build (avoids transitive helm-3 CVEs in upstream Wolfi apk)"
upstream:
  package: vcluster

types:
  default:
    base: wolfi-base
    packages: ["vcluster"]
    entrypoint: /usr/bin/vcluster
    melange:
      bespoke: "vcluster.yaml"

versions:
  # renovate: datasource=github-tags depName=loft-sh/vcluster versioning=semver-coerced
  "0.35.1":
    latest: true
