name: telegraf
description: "Telegraf metrics agent — Wolfi rebuild targets Debian CVEs from official image"
upstream:
  package: "telegraf-{{version}}"

types:
  default:
    base: wolfi-base
    packages: ["telegraf-{{version}}"]
    entrypoint: /usr/bin/telegraf
    melange:
      bespoke:
        - telegraf-1.34.yaml
        - telegraf-1.35.yaml
        - telegraf-1.36.yaml
        - telegraf-1.37.yaml
        - telegraf-1.38.yaml
    paths:
      - {path: /etc/telegraf, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

  fips:
    base: wolfi-base
    fips-profile: go
    packages: ["telegraf-{{version}}"]
    entrypoint: /usr/bin/telegraf
    environment:
      GODEBUG: "fips140=on"
    paths:
      - {path: /etc/telegraf, type: directory, uid: 65532, gid: 65532, permissions: 0o755}
    melange:
      upstream: "telegraf"
      env-file: "fips.env"

versions:
  "1.34":
    skip-types: [fips]
  "1.35":
    skip-types: [fips]
  "1.36":
    skip-types: [fips]
  "1.37":
    skip-types: [fips]  # GOFIPS140 compilation exceeds GHA timeout; re-enable with larger runner
  "1.38":
    latest: true
    skip-types: [fips]
