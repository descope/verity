name: trivy
description: "Aqua Trivy vulnerability scanner — Copa can't patch scratch-based official image; Wolfi rebuild"
upstream:
  package: trivy

types:
  default:
    base: wolfi-base
    packages: ["trivy"]
    entrypoint: /usr/bin/trivy
    paths:
      - {path: /root/.cache/trivy, type: directory, uid: 65532, gid: 65532, permissions: 0o755}

versions:
  "0": {}
