services:
  # Local OCI registry for testing
  registry:
    image: registry:3
    ports:
      - "5555:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

  # BuildKit for Copa patching
  buildkit:
    image: moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5
    privileged: true
    ports:
      - "1234:1234"
    entrypoint:
      - buildkitd
      - --addr=tcp://0.0.0.0:1234

volumes:
  registry-data:
