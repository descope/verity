services:
  # Local OCI registry for testing
  registry:
    image: registry:3
    ports:
      - "5555:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

  # BuildKit for Copa patching
  buildkit:
    image: moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
    privileged: true
    ports:
      - "1234:1234"
    entrypoint:
      - buildkitd
      - --addr=tcp://0.0.0.0:1234

volumes:
  registry-data:
