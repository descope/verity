services:
  # Local OCI registry for testing
  registry:
    image: registry:3
    ports:
      - "5555:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

  # BuildKit for Copa patching
  buildkit:
    image: moby/buildkit:v0.21.1@sha256:87afb62ed6a762bb65b85d53819f3b341fb74a36d1fc0a1153a64f367637bfda
    privileged: true
    ports:
      - "1234:1234"
    entrypoint:
      - buildkitd
      - --addr=tcp://0.0.0.0:1234

volumes:
  registry-data:
