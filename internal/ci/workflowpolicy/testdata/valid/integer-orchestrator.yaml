name: Integer Orchestrator

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "integer.yaml"
      - "images/**"
      - "packages/bespoke/**"
      - "packages/pipelines/**"
      - "packages/overrides/**"
      - "packages/upstream.lock.json"
      - "*.go"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/integer-orchestrator.yaml"
      - ".github/workflows/integer-orchestrator-reusable.yaml"
      - ".github/workflows/integer-build-shard.yaml"
      - ".github/workflows/integer-build-image.yaml"
      - ".github/workflows/integer-build-image-reusable.yaml"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name to build (empty = all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: integer-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  build-verity:
    name: Build protected Verity once
    uses: ./.github/workflows/build-verity-protected.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

  orchestrate:
    name: Run strict Integer implementation
    needs: build-verity
    uses: ./.github/workflows/integer-orchestrator-reusable.yaml
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      source_sha: ${{ needs.build-verity.outputs.source-sha }}
      verity_artifact_name: ${{ needs.build-verity.outputs.artifact-name }}
      verity_artifact_digest: ${{ needs.build-verity.outputs.artifact-digest }}
      verity_build_key: ${{ needs.build-verity.outputs.build-key }}
      run_id: ${{ format('{0}', github.run_id) }}
      run_attempt: ${{ format('{0}', github.run_attempt) }}
      publication_id: ${{ format('integer-{0}-{1}', github.run_id, github.run_attempt) }}
      batch_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      event: ${{ github.event_name }}
      base_sha: ${{ github.event.before }}
      image: ${{ inputs.image }}
