name: Integer Build Image
run-name: "Build ${{ inputs.image }}:${{ inputs.version }}-${{ inputs.type }}"

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image name (e.g., node)"
        required: true
      version:
        description: "Version (e.g., 22)"
        required: true
      type:
        description: "Type (e.g., default, dev, fips)"
        required: true
        default: "default"
      tags:
        description: "Comma-separated tags to publish (e.g., 22,latest)"
        required: true
      registry:
        description: "Target registry"
        required: true
        default: "ghcr.io/verity-org"
      batch_id:
        description: "Parent nightly run freshness identifier (empty = this run)"
        required: false
        default: ""
      shard:
        description: "Parent Integer matrix shard (0 = direct dispatch)"
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  build-verity:
    name: Build protected Verity once
    uses: ./.github/workflows/build-verity-protected.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      source_sha: ${{ github.sha }}

  build:
    name: Run strict image implementation
    needs: build-verity
    uses: ./.github/workflows/integer-build-image-reusable.yaml
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      source_sha: ${{ needs.build-verity.outputs.source-sha }}
      verity_artifact_name: ${{ needs.build-verity.outputs.artifact-name }}
      verity_artifact_digest: ${{ needs.build-verity.outputs.artifact-digest }}
      verity_build_key: ${{ needs.build-verity.outputs.build-key }}
      run_id: ${{ format('{0}', github.run_id) }}
      run_attempt: ${{ format('{0}', github.run_attempt) }}
      publication_id: ${{ format('integer-{0}-{1}', github.run_id, github.run_attempt) }}
      batch_id: ${{ inputs.batch_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      event: workflow_dispatch
      mode: direct
      shard: ${{ format('{0}', inputs.shard) }}
      image: ${{ inputs.image }}
      version: ${{ inputs.version }}
      type: ${{ inputs.type }}
      tags: ${{ inputs.tags }}
      registry: ${{ inputs.registry }}
      expected_packages: "[]"
      publish_packages: "[]"
      artifact_key: ${{ format('direct-{0}-{1}', github.run_id, github.run_attempt) }}
