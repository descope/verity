name: PR Test

# Lightweight PR validation: discover (validates config) + integer smoke tests.
# Full Copa patch pipeline runs nightly via orchestrator.yaml — NOT on PRs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_REGISTRY: ghcr.io/verity-org

jobs:
  changes:
    name: Detect PR test scope
    runs-on: ubuntu-latest
    outputs:
      integer: ${{ steps.filter.outputs.integer }}
      copa: ${{ steps.filter.outputs.copa }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: filter
        name: Check changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt

          if grep -Eq '^images/|^integer\.yaml$|^internal/integer/|^cmd/(integer|discover|scan).*\.go$|^\.github/scripts/(melange-check|melange-build)\.sh$|^\.github/workflows/(pr-test|integer-.*)\.yaml$' changed-files.txt; then
            echo 'integer=true' >> "$GITHUB_OUTPUT"
          else
            echo 'integer=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^copa-config\.yaml$|^internal/patch/|^cmd/(patch|discover|scan).*\.go$|^\.github/scripts/(patch-image|scan-before|verify-patched|read-catalog-entry)\.sh$|^\.github/workflows/(pr-test|patch-image)\.yaml$|^\.github/actions/setup-binaries/' changed-files.txt; then
            echo 'copa=true' >> "$GITHUB_OUTPUT"
          else
            echo 'copa=false' >> "$GITHUB_OUTPUT"
          fi

  # ── Validate discovery works ───────────────────────────────────────
  discover:
    name: Discover Images
    needs: changes
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity
        run: go build -o verity .

      - name: Discover images
        run: |
          ./verity discover \
            --config copa-config.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            > images.json

          COUNT=$(jq 'length' images.json)
          echo "✓ Discovered ${COUNT} image+tag combos"
          jq -r '.[] | "  - \(.name): \(.source)"' images.json

  # ── Validate all integer image configs ─────────────────────────────────
  validate:
    name: Validate image configs
    needs: changes
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Validate all image configs
        run: ./verity integer validate

  # ── Detect Integer smoke scope ───────────────────────────────────────
  detect-smoke-scope:
    name: Detect smoke scope
    needs: [changes, detect-changed-images]
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build smoke matrix
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_IMAGE_SMOKE_MATRIX: ${{ needs.detect-changed-images.outputs.smoke-matrix }}
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" || true)

          # Rare path: core Integer build mechanics changed, so keep full representative smoke matrix.
          # Orchestrator-only changes still validate config but do not need image smoke builds.
          # Common path: reuse detect-changed-images output so smoke and build share one source of truth.
          if echo "$changed_files" | grep -Eq '^internal/integer/|^cmd/(integer|discover|scan).*\.go$|^\.github/scripts/(melange-check|melange-build)\.sh$|^\.github/workflows/(pr-test|integer-build-image)\.yaml$|^integer\.yaml$'; then
            matrix='{"include":[{"image":"golang","version":"1.24","type":"fips"},{"image":"haproxy","version":"3.0","type":"fips"},{"image":"haproxy","version":"3.1","type":"fips"},{"image":"node","version":"22","type":"dev"}]}'
          else
            matrix="$CHANGED_IMAGE_SMOKE_MATRIX"
          fi

          echo "$matrix" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # ── Integer (Wolfi-based) smoke test ─────────────────────────────────
  integer-smoke-test:
    name: "Integer ${{ matrix.image }}:${{ matrix.version }}-${{ matrix.type }}"
    needs: [changes, detect-smoke-scope]
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-smoke-scope.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Check if melange build needed
        id: melange-check
        env:
          IMAGE: ${{ matrix.image }}
          TYPE: ${{ matrix.type }}
          VERSION: ${{ matrix.version }}
        run: .github/scripts/melange-check.sh

      - name: Build melange package
        if: steps.melange-check.outputs.needed == 'true'
        env:
          UPSTREAM: ${{ steps.melange-check.outputs.upstream }}
          BESPOKE_JSON: ${{ steps.melange-check.outputs.bespoke_json }}
          ENV_FILE: ${{ steps.melange-check.outputs.env_file }}
          BUILD_OPTION: ${{ steps.melange-check.outputs.build_option }}
        run: .github/scripts/melange-build.sh

      - name: Generate apko config and build image (local, no push)
        run: |
          if [ "${{ steps.melange-check.outputs.needed }}" != "true" ]; then
            ./verity integer build \
              --image ${{ matrix.image }} \
              --version ${{ matrix.version }} \
              --type ${{ matrix.type }} \
              --output image.tar \
              --arch amd64
          else
            ./verity integer discover --gen-dir ./gen

            config="gen/${{ matrix.image }}/${{ matrix.version }}/${{ matrix.type }}.apko.yaml"
            if [ ! -f "$config" ]; then
              echo "Config not found: $config" >&2
              exit 1
            fi

            apko build \
              --arch amd64 \
              --repository-append "${GITHUB_WORKSPACE}/packages/repo" \
              --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub" \
              "$config" \
              "${{ matrix.image }}:smoke-test" \
              "$GITHUB_WORKSPACE/image.tar"
          fi

      - name: Trivy vulnerability scan
        run: |
          trivy image \
            --exit-code 0 \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --vuln-type os,library \
            --format json \
            --output trivy-report.json \
            --input image.tar
        continue-on-error: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.type }}"
          path: trivy-report.json
          retention-days: 7

  # ── Build + scan changed Integer images ──────────────────────────────
  detect-changed-images:
    name: Detect changed images
    needs: changes
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      smoke-matrix: ${{ steps.detect.outputs.smoke-matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Detect changed image files and build matrix
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
          ./verity ci plan \
            --kind integer-pr \
            --changed-files changed-files.txt \
            --gen-dir "$RUNNER_TEMP/integer-gen" \
            > ci-plan.json

          matrix=$(jq -c '.matrix' ci-plan.json)
          smoke_matrix=$(jq -c '.smokeMatrix' ci-plan.json)
          has_changes=$(jq -r '.hasChanges' ci-plan.json)
          count=$(jq '.include | length' <<< "$matrix")
          echo "Matrix: ${count} image builds"
          echo "$matrix" | jq .
          {
            echo "matrix=${matrix}"
            echo "smoke-matrix=${smoke_matrix}"
            echo "has-changes=${has_changes}"
          } >> "$GITHUB_OUTPUT"

  integer-build-changed:
    name: "Build ${{ matrix.image }}:${{ matrix.version }}-${{ matrix.type }}"
    needs: [changes, detect-changed-images]
    if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Check if melange build needed
        id: melange-check
        env:
          IMAGE: ${{ matrix.image }}
          TYPE: ${{ matrix.type }}
        run: .github/scripts/melange-check.sh

      - name: Build melange package
        if: steps.melange-check.outputs.needed == 'true'
        env:
          UPSTREAM: ${{ steps.melange-check.outputs.upstream }}
          BESPOKE_JSON: ${{ steps.melange-check.outputs.bespoke_json }}
          ENV_FILE: ${{ steps.melange-check.outputs.env_file }}
          BUILD_OPTION: ${{ steps.melange-check.outputs.build_option }}
        run: .github/scripts/melange-build.sh

      - name: Build image (local, no push)
        run: |
          if [ "${{ steps.melange-check.outputs.needed }}" != "true" ]; then
            ./verity integer build \
              --image ${{ matrix.image }} \
              --version ${{ matrix.version }} \
              --type ${{ matrix.type }} \
              --output image.tar \
              --arch amd64
          else
            ./verity integer discover --gen-dir ./gen

            config="gen/${{ matrix.image }}/${{ matrix.version }}/${{ matrix.type }}.apko.yaml"
            if [ ! -f "$config" ]; then
              echo "Config not found: $config" >&2
              exit 1
            fi

            apko build \
              --arch amd64 \
              --repository-append "${GITHUB_WORKSPACE}/packages/repo" \
              --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub" \
              "$config" \
              "${{ matrix.image }}:pr-test" \
              "$GITHUB_WORKSPACE/image.tar"
          fi

          echo "\u2713 Built ${{ matrix.image }}:${{ matrix.version }}-${{ matrix.type }}"
          ls -lh image.tar

      - name: Trivy vulnerability scan
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --format table \
            --input image.tar

          echo "\u2713 Zero CRITICAL/HIGH CVEs"

      - name: Full vulnerability report
        if: always()
        run: |
          trivy image \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --vuln-type os,library \
            --format json \
            --output trivy-report.json \
            --input image.tar

          TOTAL=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-report.json)
          echo "Total vulnerabilities: ${TOTAL}"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.type }}"
          path: trivy-report.json
          retention-days: 7

  # ── Detect changed Copa images and test them ─────────────────────────
  detect-copa-changes:
    name: Detect changed images
    needs: changes
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed Copa images
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
          git show "${BASE_SHA}":copa-config.yaml > base-copa-config.yaml 2>/dev/null || printf 'images: []\n' > base-copa-config.yaml

          ./verity ci plan \
            --kind copa-pr \
            --changed-files changed-files.txt \
            --base-copa-config base-copa-config.yaml \
            --copa-config copa-config.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            > ci-plan.json

          matrix=$(jq -c '.matrix' ci-plan.json)
          has_changes=$(jq -r '.hasChanges' ci-plan.json)
          count=$(jq '.include | length' <<< "$matrix")
          echo "Copa change matrix: ${count} images to test"
          echo "$matrix" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "has-changes=${has_changes}" >> "$GITHUB_OUTPUT"

  copa-patching-changed:
    name: "Copa Patch: ${{ matrix.name }}:${{ matrix.tag }}"
    needs: [changes, detect-copa-changes]
    if: needs.changes.outputs.copa == 'true' && needs.detect-copa-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true  # Go binary patching is experimental — don't block PR
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-copa-changes.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set safe artifact name
        id: safe-name
        run: echo "name=$(echo '${{ matrix.name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Read catalog entry
        id: catalog
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: ./.github/scripts/read-catalog-entry.sh

      - name: Setup Copa and Verity
        uses: ./.github/actions/setup-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup BuildKit
        run: |
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.21.1 \
            --use
          docker buildx inspect --bootstrap

      - name: Start local registry
        run: |
          # renovate: datasource=docker depName=registry
          docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Scan image (before patching)
        env:
          SOURCE: ${{ steps.catalog.outputs.source }}
        run: ./.github/scripts/scan-before.sh

      - name: Prepare report for patch-image.sh
        if: env.skip_patch != 'true'
        run: |
          mkdir -p reports
          REPORT_NAME=$(echo "${{ steps.catalog.outputs.source }}" | sed 's/[\/:]/_/g')
          cp before.json "reports/${REPORT_NAME}.json"

      - name: Patch image
        if: env.skip_patch != 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          PLATFORM: linux/amd64
          SOURCE: ${{ steps.catalog.outputs.source }}
          IMAGE_NAME: ${{ matrix.name }}
          STAGING_REGISTRY: localhost:5000/regression
          GO_VCS_URL: ${{ steps.catalog.outputs.go_vcs_url }}
        run: ./.github/scripts/patch-image.sh

      - name: Verify patched image is clean
        if: env.skip_patch != 'true'
        env:
          IMAGE_LABEL: "${{ matrix.name }}:${{ matrix.tag }}"
        run: |
          SAFE_IMAGE=$(echo "${{ matrix.name }}" | tr '/: ' '---')
          export PATCHED_IMAGE="localhost:5000/regression:${SAFE_IMAGE}-${{ matrix.tag }}-amd64"
          ./.github/scripts/verify-patched.sh

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "copa-changed-${{ steps.safe-name.outputs.name }}-${{ matrix.tag }}"
          path: |
            before.json
            after.json
          retention-days: 7

  # ── Copa patching regression tests ──────────────────────────────────
  # Matrix lists catalog image names + pinned tags.
  # Image URL and goVcsUrl are read from copa-config.yaml at runtime.
  copa-patching-regression:
    name: "Copa Patch: ${{ matrix.name }}:${{ matrix.tag }}"
    needs: changes
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: victoriametrics/victoria-logs
            tag: v1.49.0
          - name: library/rabbitmq
            tag: "4.1.0"
          - name: kiwigrid/k8s-sidecar
            tag: "1.30.4"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Read catalog entry
        id: catalog
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: ./.github/scripts/read-catalog-entry.sh

      - name: Setup Copa and Verity
        uses: ./.github/actions/setup-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup BuildKit
        run: |
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.21.1 \
            --use
          docker buildx inspect --bootstrap

      - name: Start local registry
        run: |
          # renovate: datasource=docker depName=registry
          docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Scan image (before patching)
        env:
          SOURCE: ${{ steps.catalog.outputs.source }}
        run: ./.github/scripts/scan-before.sh

      - name: Prepare report for patch-image.sh
        if: env.skip_patch != 'true'
        run: |
          mkdir -p reports
          REPORT_NAME=$(echo "${{ steps.catalog.outputs.source }}" | sed 's/[\/:]/_/g')
          cp before.json "reports/${REPORT_NAME}.json"

      - name: Patch image
        if: env.skip_patch != 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          PLATFORM: linux/amd64
          SOURCE: ${{ steps.catalog.outputs.source }}
          IMAGE_NAME: ${{ matrix.name }}
          STAGING_REGISTRY: localhost:5000/regression
          GO_VCS_URL: ${{ steps.catalog.outputs.go_vcs_url }}
        run: ./.github/scripts/patch-image.sh

      - name: Verify patched image is clean
        if: env.skip_patch != 'true'
        env:
          IMAGE_LABEL: "${{ matrix.name }}:${{ matrix.tag }}"
        run: |
          SAFE_IMAGE=$(echo "${{ matrix.name }}" | tr '/: ' '---')
          export PATCHED_IMAGE="localhost:5000/regression:${SAFE_IMAGE}-${{ matrix.tag }}-amd64"
          ./.github/scripts/verify-patched.sh

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "copa-regression-${{ matrix.tag }}"
          path: |
            before.json
            after.json
          retention-days: 7

  pr-test-result:
    name: PR Test
    needs:
      - changes
      - discover
      - validate
      - detect-changed-images
      - detect-smoke-scope
      - integer-smoke-test
      - integer-build-changed
      - detect-copa-changes
      - copa-patching-changed
      - copa-patching-regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate PR test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGER: ${{ needs.changes.outputs.integer }}
          COPA: ${{ needs.changes.outputs.copa }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DETECT_INTEGER_RESULT: ${{ needs.detect-changed-images.result }}
          DETECT_SMOKE_RESULT: ${{ needs.detect-smoke-scope.result }}
          INTEGER_SMOKE_RESULT: ${{ needs.integer-smoke-test.result }}
          INTEGER_BUILD_RESULT: ${{ needs.integer-build-changed.result }}
          DETECT_COPA_RESULT: ${{ needs.detect-copa-changes.result }}
          COPA_CHANGED_RESULT: ${{ needs.copa-patching-changed.result }}
          COPA_REGRESSION_RESULT: ${{ needs.copa-patching-regression.result }}
        run: |
          echo "changes: ${CHANGES_RESULT}"
          echo "integer: ${INTEGER}"
          echo "copa: ${COPA}"
          echo "discover: ${DISCOVER_RESULT}"
          echo "validate: ${VALIDATE_RESULT}"
          echo "detect-changed-images: ${DETECT_INTEGER_RESULT}"
          echo "detect-smoke-scope: ${DETECT_SMOKE_RESULT}"
          echo "integer-smoke-test: ${INTEGER_SMOKE_RESULT}"
          echo "integer-build-changed: ${INTEGER_BUILD_RESULT}"
          echo "detect-copa-changes: ${DETECT_COPA_RESULT}"
          echo "copa-patching-changed: ${COPA_CHANGED_RESULT}"
          echo "copa-patching-regression: ${COPA_REGRESSION_RESULT}"

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} did not succeed: ${result}"
              exit 1
            fi
          }

          allow_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::${name} did not succeed or skip cleanly: ${result}"
                exit 1
                ;;
            esac
          }

          require_success "changes" "$CHANGES_RESULT"

          if [ "$INTEGER" = "true" ]; then
            require_success "validate" "$VALIDATE_RESULT"
            require_success "detect-changed-images" "$DETECT_INTEGER_RESULT"
            require_success "detect-smoke-scope" "$DETECT_SMOKE_RESULT"
            allow_success_or_skipped "integer-smoke-test" "$INTEGER_SMOKE_RESULT"
            allow_success_or_skipped "integer-build-changed" "$INTEGER_BUILD_RESULT"
          else
            allow_success_or_skipped "validate" "$VALIDATE_RESULT"
            allow_success_or_skipped "detect-changed-images" "$DETECT_INTEGER_RESULT"
            allow_success_or_skipped "detect-smoke-scope" "$DETECT_SMOKE_RESULT"
            allow_success_or_skipped "integer-smoke-test" "$INTEGER_SMOKE_RESULT"
            allow_success_or_skipped "integer-build-changed" "$INTEGER_BUILD_RESULT"
          fi

          if [ "$COPA" = "true" ]; then
            require_success "discover" "$DISCOVER_RESULT"
            require_success "detect-copa-changes" "$DETECT_COPA_RESULT"
            allow_success_or_skipped "copa-patching-changed" "$COPA_CHANGED_RESULT"
            require_success "copa-patching-regression" "$COPA_REGRESSION_RESULT"
          else
            allow_success_or_skipped "discover" "$DISCOVER_RESULT"
            allow_success_or_skipped "detect-copa-changes" "$DETECT_COPA_RESULT"
            allow_success_or_skipped "copa-patching-changed" "$COPA_CHANGED_RESULT"
            allow_success_or_skipped "copa-patching-regression" "$COPA_REGRESSION_RESULT"
          fi
