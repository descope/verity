name: PR Test

# Lightweight PR validation: discover (validates config) + integer smoke tests.
# Full Copa patch pipeline runs nightly via orchestrator.yaml — NOT on PRs.

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_REGISTRY: ghcr.io/verity-org

jobs:
  changes:
    name: Detect PR test scope
    needs: build-verity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      integer: ${{ steps.filter.outputs.integer }}
      copa: ${{ steps.filter.outputs.copa }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          fetch-depth: "0"
          persist-credentials: "false"

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - id: filter
        name: Check changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./verity ci pr-test scope
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  build-verity:
    name: Build Verity once
    permissions:
      contents: read
    uses: ./.github/workflows/build-verity.yaml
    with:
      source_sha: ${{ github.sha }}

  # ── Validate discovery works ───────────────────────────────────────
  discover:
    name: Discover Images
    needs: [changes, build-verity]
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Discover images
        run: >-
          ./verity ci pr-test discover
          --config copa-config.yaml
          --target-registry "${TARGET_REGISTRY}"
          --output images.json

  # ── Validate all integer image configs ─────────────────────────────────
  validate:
    name: Validate image configs
    needs: [changes, build-verity]
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Validate all image configs
        run: ./verity integer validate

  # ── Integer smoke test ────────────────────────────────────────────────
  integer-smoke-test:
    name: "Integer smoke batch ${{ matrix.batch_id }} (${{ matrix.arch }})"
    needs: [changes, build-verity, detect-changed-images]
    if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.smoke-has-changes == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      INTEGER_ENTRIES: ${{ toJson(matrix.entries) }}
      INTEGER_BATCH_ID: ${{ matrix.batch_id }}
      INTEGER_ARCH: ${{ matrix.arch }}
      INTEGER_PACKAGE_ARCH: ${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.smoke-matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Enable linux/amd64 Verity on ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64
          cache-image: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Get Trivy cache key
        id: trivy-cache-key
        run: >-
          ./verity ci pr-test trivy-cache-key
          --github-output "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-cache-key.outputs.version }}-${{ steps.trivy-cache-key.outputs.date }}
          restore-keys: trivy-db-${{ steps.trivy-cache-key.outputs.version }}-

      - name: Build and verify native-architecture Integer smoke batch
        run: >-
          ./verity ci pr-test integer-batch
          --kind smoke
          --entries "$INTEGER_ENTRIES"
          --arch "$INTEGER_ARCH"
          --package-arch "$INTEGER_PACKAGE_ARCH"
          --runner-temp "$RUNNER_TEMP"
          --security-dir integer-security
          --reports-dir trivy-reports

      - name: Upload Integer security completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "integer-security-smoke-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: integer-security/*.passed
          retention-days: "7"

      - name: Upload architecture-qualified Trivy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-smoke-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: trivy-reports/**/*.json
          retention-days: "7"

  # ── Build + scan changed Integer images ──────────────────────────────
  detect-changed-images:
    name: Detect changed images
    needs: [changes, build-verity]
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      smoke-matrix: ${{ steps.detect.outputs.smoke-matrix }}
      expected-matrix: ${{ steps.detect.outputs.expected-matrix }}
      expected-smoke-matrix: ${{ steps.detect.outputs.expected-smoke-matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      smoke-has-changes: ${{ steps.detect.outputs.smoke-has-changes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          fetch-depth: "0"
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Detect changed image files and build matrix
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./verity ci pr-test plan-integer
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --temp-dir "$RUNNER_TEMP"
          --gen-dir "$RUNNER_TEMP/integer-gen"
          --github-output "$GITHUB_OUTPUT"

  integer-build-changed:
    name: "Integer build batch ${{ matrix.batch_id }} (${{ matrix.arch }})"
    needs: [changes, build-verity, detect-changed-images]
    if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.has-changes == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      INTEGER_ENTRIES: ${{ toJson(matrix.entries) }}
      INTEGER_BATCH_ID: ${{ matrix.batch_id }}
      INTEGER_ARCH: ${{ matrix.arch }}
      INTEGER_PACKAGE_ARCH: ${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Enable linux/amd64 Verity on ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64
          cache-image: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Get Trivy cache key
        id: trivy-cache-key
        run: >-
          ./verity ci pr-test trivy-cache-key
          --github-output "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-cache-key.outputs.version }}-${{ steps.trivy-cache-key.outputs.date }}
          restore-keys: trivy-db-${{ steps.trivy-cache-key.outputs.version }}-

      - name: Build and verify native-architecture Integer batch
        run: >-
          ./verity ci pr-test integer-batch
          --kind build
          --entries "$INTEGER_ENTRIES"
          --arch "$INTEGER_ARCH"
          --package-arch "$INTEGER_PACKAGE_ARCH"
          --runner-temp "$RUNNER_TEMP"
          --security-dir integer-security
          --reports-dir trivy-reports

      - name: Upload Integer security completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "integer-security-build-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: integer-security/*.passed
          retention-days: "7"

      - name: Upload architecture-qualified Trivy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-build-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: trivy-reports/**/*.json
          retention-days: "7"

  # ── Detect changed Copa images and test them ─────────────────────────
  detect-copa-changes:
    name: Detect changed images
    needs: [changes, build-verity]
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          fetch-depth: "0"
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Detect changed Copa images
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./verity ci pr-test plan-copa
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --temp-dir "$RUNNER_TEMP"
          --config copa-config.yaml
          --target-registry "${TARGET_REGISTRY}"
          --github-output "$GITHUB_OUTPUT"

  copa-patching-changed:
    name: "Copa Patch: ${{ matrix.name }}:${{ matrix.tag }}"
    needs: [changes, build-verity, detect-copa-changes]
    if: needs.changes.outputs.copa == 'true' && needs.detect-copa-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true  # Go binary patching is experimental — don't block PR
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-copa-changes.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Resolve Copa metadata
        id: metadata
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: >-
          ./verity ci pr-test copa-metadata
          --config copa-config.yaml
          --image-name "$IMAGE_NAME"
          --image-tag "$IMAGE_TAG"
          --platform linux/amd64
          --staging-registry localhost:5000/regression
          --github-output "$GITHUB_OUTPUT"

      - name: Setup BuildKit
        run: |
          # renovate: datasource=docker depName=moby/buildkit
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.21.1@sha256:87afb62ed6a762bb65b85d53819f3b341fb74a36d1fc0a1153a64f367637bfda \
            --use
          docker buildx inspect --bootstrap

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Scan image before patching
        env:
          SOURCE: ${{ steps.metadata.outputs.source }}
        run: >-
          ./verity ci repository-ops scan-before
          --source "$SOURCE"
          --report before.json
          --github-env "$GITHUB_ENV"

      - name: Patch image
        id: patch
        if: env.skip_patch != 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          SOURCE: ${{ steps.metadata.outputs.source }}
          IMAGE_NAME: ${{ matrix.name }}
          GO_VCS_URL: ${{ steps.metadata.outputs.go_vcs_url }}
        run: >-
          ./verity ci repository-ops patch-image
          --platform linux/amd64
          --source "$SOURCE"
          --image-name "$IMAGE_NAME"
          --staging-registry localhost:5000/regression
          --go-vcs-url "$GO_VCS_URL"
          --report before.json
          --github-output "$GITHUB_OUTPUT"

      - name: Pin patched image
        id: pinned
        if: env.skip_patch != 'true'
        env:
          DESTINATION: ${{ steps.metadata.outputs.destination }}
          STAGING_DIGEST: ${{ steps.patch.outputs.staging-digest }}
        run: >-
          ./verity ci pr-test copa-pin
          --destination "$DESTINATION"
          --digest "$STAGING_DIGEST"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify patched image is clean
        if: env.skip_patch != 'true'
        env:
          IMAGE_LABEL: "${{ matrix.name }}:${{ matrix.tag }}"
          PINNED_IMAGE: ${{ steps.pinned.outputs.image }}
          BEFORE_TOTAL: ${{ env.before_total }}
          BEFORE_GO: ${{ env.before_go }}
          BEFORE_NON_GO: ${{ env.before_non_go }}
        run: >-
          ./verity ci repository-ops verify-patched
          --image "$PINNED_IMAGE"
          --image-label "$IMAGE_LABEL"
          --report after.json
          --before-total "$BEFORE_TOTAL"
          --before-go "$BEFORE_GO"
          --before-non-go "$BEFORE_NON_GO"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "copa-changed-${{ steps.metadata.outputs.artifact_name }}-${{ matrix.tag }}"
          path: |
            before.json
            after.json
          retention-days: "7"

  # ── Copa patching regression tests ──────────────────────────────────
  # Matrix lists catalog image names + pinned tags.
  # Image URL and goVcsUrl are read from copa-config.yaml at runtime.
  copa-patching-regression:
    name: "Copa Patch: ${{ matrix.name }}:${{ matrix.tag }}"
    needs: [changes, build-verity]
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: victoriametrics/victoria-logs
            tag: v1.49.0
          - name: library/rabbitmq
            tag: "4.1.0"
          - name: kiwigrid/k8s-sidecar
            tag: "1.30.4"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Resolve Copa metadata
        id: metadata
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: >-
          ./verity ci pr-test copa-metadata
          --config copa-config.yaml
          --image-name "$IMAGE_NAME"
          --image-tag "$IMAGE_TAG"
          --platform linux/amd64
          --staging-registry localhost:5000/regression
          --github-output "$GITHUB_OUTPUT"

      - name: Setup BuildKit
        run: |
          # renovate: datasource=docker depName=moby/buildkit
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.21.1@sha256:87afb62ed6a762bb65b85d53819f3b341fb74a36d1fc0a1153a64f367637bfda \
            --use
          docker buildx inspect --bootstrap

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Scan image before patching
        env:
          SOURCE: ${{ steps.metadata.outputs.source }}
        run: >-
          ./verity ci repository-ops scan-before
          --source "$SOURCE"
          --report before.json
          --github-env "$GITHUB_ENV"

      - name: Patch image
        id: patch
        if: env.skip_patch != 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          SOURCE: ${{ steps.metadata.outputs.source }}
          IMAGE_NAME: ${{ matrix.name }}
          GO_VCS_URL: ${{ steps.metadata.outputs.go_vcs_url }}
        run: >-
          ./verity ci repository-ops patch-image
          --platform linux/amd64
          --source "$SOURCE"
          --image-name "$IMAGE_NAME"
          --staging-registry localhost:5000/regression
          --go-vcs-url "$GO_VCS_URL"
          --report before.json
          --github-output "$GITHUB_OUTPUT"

      - name: Pin patched image
        id: pinned
        if: env.skip_patch != 'true'
        env:
          DESTINATION: ${{ steps.metadata.outputs.destination }}
          STAGING_DIGEST: ${{ steps.patch.outputs.staging-digest }}
        run: >-
          ./verity ci pr-test copa-pin
          --destination "$DESTINATION"
          --digest "$STAGING_DIGEST"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify patched image is clean
        if: env.skip_patch != 'true'
        env:
          IMAGE_LABEL: "${{ matrix.name }}:${{ matrix.tag }}"
          PINNED_IMAGE: ${{ steps.pinned.outputs.image }}
          BEFORE_TOTAL: ${{ env.before_total }}
          BEFORE_GO: ${{ env.before_go }}
          BEFORE_NON_GO: ${{ env.before_non_go }}
        run: >-
          ./verity ci repository-ops verify-patched
          --image "$PINNED_IMAGE"
          --image-label "$IMAGE_LABEL"
          --report after.json
          --before-total "$BEFORE_TOTAL"
          --before-go "$BEFORE_GO"
          --before-non-go "$BEFORE_NON_GO"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "copa-regression-${{ steps.metadata.outputs.artifact_name }}-${{ matrix.tag }}"
          path: |
            before.json
            after.json
          retention-days: "7"

  pr-test-result:
    name: PR Test
    needs:
      - build-verity
      - changes
      - discover
      - validate
      - detect-changed-images
      - integer-smoke-test
      - integer-build-changed
      - detect-copa-changes
      - copa-patching-changed
      - copa-patching-regression
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Download Integer security completions
        if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.has-changes == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integer-security-*
          path: integer-security-results
          merge-multiple: "true"

      - name: Aggregate PR test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGER: ${{ needs.changes.outputs.integer }}
          COPA: ${{ needs.changes.outputs.copa }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DETECT_INTEGER_RESULT: ${{ needs.detect-changed-images.result }}
          INTEGER_HAS_CHANGES: ${{ needs.detect-changed-images.outputs.has-changes }}
          INTEGER_SMOKE_RESULT: ${{ needs.integer-smoke-test.result }}
          INTEGER_BUILD_RESULT: ${{ needs.integer-build-changed.result }}
          EXPECTED_INTEGER_MATRIX: ${{ needs.detect-changed-images.outputs.expected-matrix }}
          EXPECTED_INTEGER_SMOKE_MATRIX: ${{ needs.detect-changed-images.outputs.expected-smoke-matrix }}
          DETECT_COPA_RESULT: ${{ needs.detect-copa-changes.result }}
          COPA_CHANGED_RESULT: ${{ needs.copa-patching-changed.result }}
          COPA_REGRESSION_RESULT: ${{ needs.copa-patching-regression.result }}
        run: >-
          ./verity ci pr-test aggregate
          --changes-result "$CHANGES_RESULT"
          --integer "$INTEGER"
          --copa "$COPA"
          --discover-result "$DISCOVER_RESULT"
          --validate-result "$VALIDATE_RESULT"
          --detect-integer-result "$DETECT_INTEGER_RESULT"
          --integer-has-changes "$INTEGER_HAS_CHANGES"
          --integer-smoke-result "$INTEGER_SMOKE_RESULT"
          --integer-build-result "$INTEGER_BUILD_RESULT"
          --expected-integer-matrix "$EXPECTED_INTEGER_MATRIX"
          --expected-integer-smoke-matrix "$EXPECTED_INTEGER_SMOKE_MATRIX"
          --detect-copa-result "$DETECT_COPA_RESULT"
          --copa-changed-result "$COPA_CHANGED_RESULT"
          --copa-regression-result "$COPA_REGRESSION_RESULT"
          --security-dir integer-security-results
