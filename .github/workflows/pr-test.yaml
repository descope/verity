name: PR Test

# Lightweight PR validation: discover (validates config) + integer smoke tests.
# Full Copa patch pipeline runs nightly via orchestrator.yaml — NOT on PRs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_REGISTRY: ghcr.io/verity-org

jobs:
  changes:
    name: Detect PR test scope
    runs-on: ubuntu-latest
    outputs:
      integer: ${{ steps.filter.outputs.integer }}
      copa: ${{ steps.filter.outputs.copa }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: filter
        name: Check changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt

          if grep -Eq '^images/|^integer\.yaml$|^packages/(bespoke|pipelines|overrides)/|^packages/upstream\.lock\.json$|^internal/(ci|integer)/|^cmd/(ci|integer|nightly|discover|scan).*\.go$|^\.github/workflows/(pr-test|integer-.*)\.yaml$' changed-files.txt; then
            echo 'integer=true' >> "$GITHUB_OUTPUT"
          else
            echo 'integer=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^copa-config\.yaml$|^internal/patch/|^cmd/(ci|nightly|patch|discover|scan).*\.go$|^\.github/scripts/(patch-image|scan-before|verify-patched|read-catalog-entry)\.sh$|^\.github/workflows/(pr-test|patch-image)\.yaml$|^\.github/actions/setup-binaries/' changed-files.txt; then
            echo 'copa=true' >> "$GITHUB_OUTPUT"
          else
            echo 'copa=false' >> "$GITHUB_OUTPUT"
          fi

  # ── Validate discovery works ───────────────────────────────────────
  discover:
    name: Discover Images
    needs: changes
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity
        run: go build -o verity .

      - name: Discover images
        run: |
          ./verity discover \
            --config copa-config.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            > images.json

          COUNT=$(jq 'length' images.json)
          echo "✓ Discovered ${COUNT} image+tag combos"
          jq -r '.[] | "  - \(.name): \(.source)"' images.json

  # ── Validate all integer image configs ─────────────────────────────────
  validate:
    name: Validate image configs
    needs: changes
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Validate all image configs
        run: ./verity integer validate

  # ── Integer smoke test ────────────────────────────────────────────────
  integer-smoke-test:
    name: "Integer smoke batch ${{ matrix.batch_id }} (${{ matrix.arch }})"
    needs: [changes, detect-changed-images]
    if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.has-changes == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      INTEGER_ENTRIES: ${{ toJson(matrix.entries) }}
      INTEGER_BATCH_ID: ${{ matrix.batch_id }}
      INTEGER_ARCH: ${{ matrix.arch }}
      INTEGER_PACKAGE_ARCH: ${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.smoke-matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Build and verify native-architecture Integer smoke batch
        run: |
          mkdir -p integer-security
          while IFS= read -r entry; do
            image=$(jq -r '.image' <<< "$entry")
            version=$(jq -r '.version' <<< "$entry")
            type=$(jq -r '.type' <<< "$entry")
            safe_image=$(printf '%s' "$image" | tr '/:' '--')
            report_dir="trivy-reports/${safe_image}-${version}-${type}"
            mkdir -p "$report_dir"

            echo "::group::Melange ${image}:${version}-${type} (${INTEGER_PACKAGE_ARCH})"
            started=$SECONDS
            if timeout --signal=TERM --kill-after=1m 30m \
              ./verity integer melange build \
                --image "$image" \
                --version "$version" \
                --type "$type" \
                --arch "$INTEGER_PACKAGE_ARCH"; then
              echo "Melange ${image}:${version}-${type} (${INTEGER_PACKAGE_ARCH}) completed in $((SECONDS - started))s"
            else
              rc=$?
              echo "::error::Melange ${image}:${version}-${type} (${INTEGER_PACKAGE_ARCH}) failed after $((SECONDS - started))s with exit ${rc}"
              exit "$rc"
            fi
            echo "::endgroup::"

            if [ "$image" = "weaviate" ]; then
              expected_version=$(yq -r '.package.version' \
                melange-work/specs/weaviate.yaml/build.yaml)
              expected_full_version=$(yq -r '.package.version + "-r" + (.package.epoch | tostring)' \
                melange-work/specs/weaviate.yaml/build.yaml)
              timeout --signal=TERM --kill-after=1m 5m \
                melange test \
                  --arch "$INTEGER_PACKAGE_ARCH" \
                  --repository-append "${GITHUB_WORKSPACE}/packages/repo" \
                  --repository-append https://packages.wolfi.dev/os \
                  --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub" \
                  --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
                  --pipeline-dirs melange-work/pipelines \
                  --runner docker \
                  melange-work/specs/weaviate.yaml/build.yaml \
                  weaviate
            fi

            arch="$INTEGER_ARCH"
            tar_path="image-${safe_image}-${version}-${type}-${arch}.tar"
            ./verity integer build \
              --image "$image" \
              --version "$version" \
              --type "$type" \
              --output "$tar_path" \
              --arch "$arch" \
              --fail-on-severity "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

            load_output=$(docker load --input "$tar_path")
            echo "$load_output"
            loaded_ref=$(awk -F': ' '/^Loaded image: / {print $2}' <<< "$load_output" | tail -1)
            if [ -z "$loaded_ref" ]; then
              echo "::error::docker load did not report an image reference for ${arch}"
              exit 1
            fi
            runtime_arch=$(docker image inspect "$loaded_ref" --format '{{.Architecture}}')
            if [ "$runtime_arch" != "$arch" ]; then
              echo "::error::runtime architecture mismatch: expected ${arch}, got ${runtime_arch}"
              exit 1
            fi

            if [ "$image" = "weaviate" ]; then
              (
                container="integer-weaviate-${arch}-pr-smoke"
                sbom="${RUNNER_TEMP}/weaviate-${arch}.spdx.json"
                trap 'docker rm --force "$container" >/dev/null 2>&1 || true; rm -f "$sbom"' EXIT

                docker run --detach --rm --name "$container" \
                  --publish 127.0.0.1::8080 \
                  --env AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
                  --env CLUSTER_HOSTNAME="$container" \
                  --env DEFAULT_VECTORIZER_MODULE=none \
                  --env DISABLE_TELEMETRY=true \
                  --env PERSISTENCE_DATA_PATH=/var/lib/weaviate \
                  "$loaded_ref" --host 0.0.0.0 --port 8080 --scheme http

                host_port=$(docker port "$container" 8080/tcp | awk -F: 'END {print $NF}')
                test -n "$host_port"
                ready=false
                for _ in $(seq 1 90); do
                  if curl -fsS "http://127.0.0.1:$host_port/v1/.well-known/ready" >/dev/null; then
                    ready=true
                    break
                  fi
                  docker inspect --format '{{.State.Running}}' "$container" | grep -Fx true
                  sleep 1
                done
                test "$ready" = true
                curl -fsS "http://127.0.0.1:$host_port/v1/meta" \
                  | jq -e --arg version "$expected_version" '.version == $version'
                docker exec "$container" id -u | grep -Fx 65532

                docker cp \
                  "$container:/var/lib/db/sbom/weaviate-${expected_full_version}.spdx.json" \
                  "$sbom"
                jq -e --arg full_version "$expected_full_version" '
                  .spdxVersion == "SPDX-2.3"
                  and any(
                    .packages[];
                    .name == "weaviate"
                    and .versionInfo == $full_version
                    and .licenseDeclared == "BSD-3-Clause"
                  )
                ' "$sbom"
              )
            fi

            trivy image \
              --exit-code 1 \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --vuln-type os,library \
              --format json \
              --output "${report_dir}/${arch}.json" \
              --input "$tar_path"
            total=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "${report_dir}/${arch}.json")
            echo "${image}:${version}-${type} ${arch}: Total vulnerabilities: ${total}"
            touch "integer-security/smoke-${safe_image}-${version}-${type}-${arch}.passed"
            rm -f "$tar_path"
          done < <(jq -c '.[]' <<< "$INTEGER_ENTRIES")

      - name: Upload Integer security completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "integer-security-smoke-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: integer-security/*.passed
          retention-days: 7

      - name: Upload architecture-qualified Trivy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-smoke-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: trivy-reports/**/*.json
          retention-days: 7

  # ── Build + scan changed Integer images ──────────────────────────────
  detect-changed-images:
    name: Detect changed images
    needs: changes
    if: needs.changes.outputs.integer == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      smoke-matrix: ${{ steps.detect.outputs.smoke-matrix }}
      expected-matrix: ${{ steps.detect.outputs.expected-matrix }}
      expected-smoke-matrix: ${{ steps.detect.outputs.expected-smoke-matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Detect changed image files and build matrix
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
          git show "${BASE_SHA}":packages/upstream.lock.json > "$RUNNER_TEMP/base-upstream.lock.json" 2>/dev/null || printf '{"packages":{},"pipeline_files":{}}\n' > "$RUNNER_TEMP/base-upstream.lock.json"
          mkdir -p "$RUNNER_TEMP/base-images"
          while IFS= read -r file; do
            case "$file" in
              images/*.yaml)
                relative="${file#images/}"
                mkdir -p "$RUNNER_TEMP/base-images/$(dirname "$relative")"
                git show "${BASE_SHA}:${file}" > "$RUNNER_TEMP/base-images/$relative" 2>/dev/null || rm -f "$RUNNER_TEMP/base-images/$relative"
                ;;
            esac
          done < changed-files.txt
          ./verity ci plan \
            --kind integer-pr \
            --changed-files changed-files.txt \
            --base-upstream-lock "$RUNNER_TEMP/base-upstream.lock.json" \
            --base-images-dir "$RUNNER_TEMP/base-images" \
            --gen-dir "$RUNNER_TEMP/integer-gen" \
            > ci-plan.json

          expected_matrix=$(jq -c '.matrix' ci-plan.json)
          expected_smoke_matrix=$(jq -c '.smokeMatrix' ci-plan.json)
          matrix=$(jq -c '[.matrix.include | to_entries | group_by((.key / 16 | floor))[] | {batch_id: (.[0].key / 16 | floor), entries: map(.value)} as $batch | ["amd64", "arm64"][] as $arch | $batch + {arch: $arch, package_arch: (if $arch == "amd64" then "x86_64" else "aarch64" end), runner: (if $arch == "amd64" then "ubuntu-latest" else "ubuntu-24.04-arm" end)}] | {include: .}' ci-plan.json)
          smoke_matrix=$(jq -c '[.smokeMatrix.include | to_entries | group_by((.key / 16 | floor))[] | {batch_id: (.[0].key / 16 | floor), entries: map(.value)} as $batch | ["amd64", "arm64"][] as $arch | $batch + {arch: $arch, package_arch: (if $arch == "amd64" then "x86_64" else "aarch64" end), runner: (if $arch == "amd64" then "ubuntu-latest" else "ubuntu-24.04-arm" end)}] | {include: .}' ci-plan.json)
          has_changes=$(jq -r '.hasChanges' ci-plan.json)
          count=$(jq '.include | length' <<< "$expected_matrix")
          batch_count=$(jq '.include | length' <<< "$matrix")
          echo "Matrix: ${count} image builds in ${batch_count} batches"
          echo "$matrix" | jq .
          {
            echo "matrix=${matrix}"
            echo "smoke-matrix=${smoke_matrix}"
            echo "expected-matrix=${expected_matrix}"
            echo "expected-smoke-matrix=${expected_smoke_matrix}"
            echo "has-changes=${has_changes}"
          } >> "$GITHUB_OUTPUT"

  integer-build-changed:
    name: "Integer build batch ${{ matrix.batch_id }} (${{ matrix.arch }})"
    needs: [changes, detect-changed-images]
    if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.has-changes == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      INTEGER_ENTRIES: ${{ toJson(matrix.entries) }}
      INTEGER_BATCH_ID: ${{ matrix.batch_id }}
      INTEGER_ARCH: ${{ matrix.arch }}
      INTEGER_PACKAGE_ARCH: ${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Build and verify native-architecture Integer batch
        run: |
          mkdir -p integer-security
          while IFS= read -r entry; do
            image=$(jq -r '.image' <<< "$entry")
            version=$(jq -r '.version' <<< "$entry")
            type=$(jq -r '.type' <<< "$entry")
            safe_image=$(printf '%s' "$image" | tr '/:' '--')
            report_dir="trivy-reports/${safe_image}-${version}-${type}"
            mkdir -p "$report_dir"

            echo "::group::Melange ${image}:${version}-${type} (${INTEGER_PACKAGE_ARCH})"
            started=$SECONDS
            if timeout --signal=TERM --kill-after=1m 30m \
              ./verity integer melange build \
                --image "$image" \
                --version "$version" \
                --type "$type" \
                --arch "$INTEGER_PACKAGE_ARCH"; then
              echo "Melange ${image}:${version}-${type} (${INTEGER_PACKAGE_ARCH}) completed in $((SECONDS - started))s"
            else
              rc=$?
              echo "::error::Melange ${image}:${version}-${type} (${INTEGER_PACKAGE_ARCH}) failed after $((SECONDS - started))s with exit ${rc}"
              exit "$rc"
            fi
            echo "::endgroup::"

            if [ "$image" = linkerd ] && [ "$version" = 25 ] && [ "$type" = default ]; then
              if timeout --signal=TERM --kill-after=1m 30m \
                ./verity integer melange build \
                  --image "$image" \
                  --version "$version" \
                  --type "$type" \
                  --arch "$INTEGER_PACKAGE_ARCH" \
                  --staged; then
                echo "Staged Melange canary completed for ${INTEGER_PACKAGE_ARCH}"
              else
                rc=$?
                echo "::error::staged Melange canary failed for ${INTEGER_PACKAGE_ARCH} with exit ${rc}"
                exit "$rc"
              fi

              ./verity integer discover --apkindex-url "" --gen-dir ./pin-config-gen
              config="pin-config-gen/${image}/${version}/${type}.apko.yaml"
              ./verity integer melange pin-config \
                --config "$config" \
                --repository packages/repo \
                --arch "$INTEGER_PACKAGE_ARCH"
              grep -Eq 'linkerd2-cli=[^ ,]+@local' "$config"

              canary_image="pin-config-${INTEGER_ARCH}.tar"
              canary_report="pin-config-${INTEGER_ARCH}.json"
              apko build \
                --arch "$INTEGER_ARCH" \
                --repository-append "@local packages/repo" \
                --keyring-append melange-work/melange.rsa.pub \
                "$config" \
                integer:pin-config-canary \
                "$canary_image"
              trivy image \
                --exit-code 1 \
                --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
                --vuln-type os,library \
                --format json \
                --output "$canary_report" \
                --input "$canary_image"
              total=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "$canary_report")
              echo "Pin-config canary ${INTEGER_ARCH}: Total vulnerabilities: ${total}"
            fi

            arch="$INTEGER_ARCH"
            tar_path="image-${safe_image}-${version}-${type}-${arch}.tar"
            ./verity integer build \
              --image "$image" \
              --version "$version" \
              --type "$type" \
              --output "$tar_path" \
              --arch "$arch" \
              --fail-on-severity "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

            load_output=$(docker load --input "$tar_path")
            echo "$load_output"
            loaded_ref=$(awk -F': ' '/^Loaded image: / {print $2}' <<< "$load_output" | tail -1)
            if [ -z "$loaded_ref" ]; then
              echo "::error::docker load did not report an image reference for ${arch}"
              exit 1
            fi
            runtime_arch=$(docker image inspect "$loaded_ref" --format '{{.Architecture}}')
            if [ "$runtime_arch" != "$arch" ]; then
              echo "::error::runtime architecture mismatch: expected ${arch}, got ${runtime_arch}"
              exit 1
            fi

            trivy image \
              --exit-code 1 \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --vuln-type os,library \
              --format json \
              --output "${report_dir}/${arch}.json" \
              --input "$tar_path"
            total=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "${report_dir}/${arch}.json")
            echo "${image}:${version}-${type} ${arch}: Total vulnerabilities: ${total}"
            touch "integer-security/build-${safe_image}-${version}-${type}-${arch}.passed"
            rm -f "$tar_path"
          done < <(jq -c '.[]' <<< "$INTEGER_ENTRIES")

      - name: Upload Integer security completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "integer-security-build-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: integer-security/*.passed
          retention-days: 7

      - name: Upload architecture-qualified Trivy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-build-batch-${{ matrix.batch_id }}-${{ matrix.arch }}"
          path: trivy-reports/**/*.json
          retention-days: 7

  # ── Detect changed Copa images and test them ─────────────────────────
  detect-copa-changes:
    name: Detect changed images
    needs: changes
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed Copa images
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
          git show "${BASE_SHA}":copa-config.yaml > base-copa-config.yaml 2>/dev/null || printf 'images: []\n' > base-copa-config.yaml

          ./verity ci plan \
            --kind copa-pr \
            --changed-files changed-files.txt \
            --base-copa-config base-copa-config.yaml \
            --copa-config copa-config.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            > ci-plan.json

          matrix=$(jq -c '.matrix' ci-plan.json)
          has_changes=$(jq -r '.hasChanges' ci-plan.json)
          count=$(jq '.include | length' <<< "$matrix")
          echo "Copa change matrix: ${count} images to test"
          echo "$matrix" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "has-changes=${has_changes}" >> "$GITHUB_OUTPUT"

  copa-patching-changed:
    name: "Copa Patch: ${{ matrix.name }}:${{ matrix.tag }}"
    needs: [changes, detect-copa-changes]
    if: needs.changes.outputs.copa == 'true' && needs.detect-copa-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true  # Go binary patching is experimental — don't block PR
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-copa-changes.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set safe artifact name
        id: safe-name
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          SAFE_NAME=$(printf '%s' "$IMAGE_NAME" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-80)
          printf 'name=%s\n' "$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Read catalog entry
        id: catalog
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: ./.github/scripts/read-catalog-entry.sh

      - name: Setup Copa and Verity
        uses: ./.github/actions/setup-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup BuildKit
        run: |
          # renovate: datasource=docker depName=moby/buildkit
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.21.1 \
            --use
          docker buildx inspect --bootstrap

      - name: Start local registry
        run: |
          # renovate: datasource=docker depName=registry
          docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Scan image (before patching)
        env:
          SOURCE: ${{ steps.catalog.outputs.source }}
        run: ./.github/scripts/scan-before.sh

      - name: Prepare report for patch-image.sh
        if: env.skip_patch != 'true'
        run: |
          mkdir -p reports
          REPORT_NAME=$(echo "${{ steps.catalog.outputs.source }}" | sed 's/[\/:]/_/g')
          cp before.json "reports/${REPORT_NAME}.json"

      - name: Patch image
        if: env.skip_patch != 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          PLATFORM: linux/amd64
          SOURCE: ${{ steps.catalog.outputs.source }}
          IMAGE_NAME: ${{ matrix.name }}
          STAGING_REGISTRY: localhost:5000/regression
          GO_VCS_URL: ${{ steps.catalog.outputs.go_vcs_url }}
        run: ./.github/scripts/patch-image.sh

      - name: Verify patched image is clean
        if: env.skip_patch != 'true'
        env:
          IMAGE_LABEL: "${{ matrix.name }}:${{ matrix.tag }}"
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          SAFE_IMAGE=$(printf '%s' "$IMAGE_NAME" | tr '/: ' '---')
          export PATCHED_IMAGE="localhost:5000/regression:${SAFE_IMAGE}-${IMAGE_TAG}-amd64"
          ./.github/scripts/verify-patched.sh

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "copa-changed-${{ steps.safe-name.outputs.name }}-${{ matrix.tag }}"
          path: |
            before.json
            after.json
          retention-days: 7

  # ── Copa patching regression tests ──────────────────────────────────
  # Matrix lists catalog image names + pinned tags.
  # Image URL and goVcsUrl are read from copa-config.yaml at runtime.
  copa-patching-regression:
    name: "Copa Patch: ${{ matrix.name }}:${{ matrix.tag }}"
    needs: changes
    if: needs.changes.outputs.copa == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: victoriametrics/victoria-logs
            tag: v1.49.0
          - name: library/rabbitmq
            tag: "4.1.0"
          - name: kiwigrid/k8s-sidecar
            tag: "1.30.4"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Read catalog entry
        id: catalog
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: ./.github/scripts/read-catalog-entry.sh

      - name: Setup Copa and Verity
        uses: ./.github/actions/setup-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup BuildKit
        run: |
          # renovate: datasource=docker depName=moby/buildkit
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.21.1 \
            --use
          docker buildx inspect --bootstrap

      - name: Start local registry
        run: |
          # renovate: datasource=docker depName=registry
          docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Scan image (before patching)
        env:
          SOURCE: ${{ steps.catalog.outputs.source }}
        run: ./.github/scripts/scan-before.sh

      - name: Prepare report for patch-image.sh
        if: env.skip_patch != 'true'
        run: |
          mkdir -p reports
          REPORT_NAME=$(echo "${{ steps.catalog.outputs.source }}" | sed 's/[\/:]/_/g')
          cp before.json "reports/${REPORT_NAME}.json"

      - name: Patch image
        if: env.skip_patch != 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          PLATFORM: linux/amd64
          SOURCE: ${{ steps.catalog.outputs.source }}
          IMAGE_NAME: ${{ matrix.name }}
          STAGING_REGISTRY: localhost:5000/regression
          GO_VCS_URL: ${{ steps.catalog.outputs.go_vcs_url }}
        run: ./.github/scripts/patch-image.sh

      - name: Verify patched image is clean
        if: env.skip_patch != 'true'
        env:
          IMAGE_LABEL: "${{ matrix.name }}:${{ matrix.tag }}"
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          SAFE_IMAGE=$(printf '%s' "$IMAGE_NAME" | tr '/: ' '---')
          export PATCHED_IMAGE="localhost:5000/regression:${SAFE_IMAGE}-${IMAGE_TAG}-amd64"
          ./.github/scripts/verify-patched.sh

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "copa-regression-${{ matrix.tag }}"
          path: |
            before.json
            after.json
          retention-days: 7

  pr-test-result:
    name: PR Test
    needs:
      - changes
      - discover
      - validate
      - detect-changed-images
      - integer-smoke-test
      - integer-build-changed
      - detect-copa-changes
      - copa-patching-changed
      - copa-patching-regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Integer security completions
        if: needs.changes.outputs.integer == 'true' && needs.detect-changed-images.outputs.has-changes == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integer-security-*
          path: integer-security-results
          merge-multiple: true

      - name: Aggregate PR test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGER: ${{ needs.changes.outputs.integer }}
          COPA: ${{ needs.changes.outputs.copa }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DETECT_INTEGER_RESULT: ${{ needs.detect-changed-images.result }}
          INTEGER_HAS_CHANGES: ${{ needs.detect-changed-images.outputs.has-changes }}
          INTEGER_SMOKE_RESULT: ${{ needs.integer-smoke-test.result }}
          INTEGER_BUILD_RESULT: ${{ needs.integer-build-changed.result }}
          EXPECTED_INTEGER_MATRIX: ${{ needs.detect-changed-images.outputs.expected-matrix }}
          EXPECTED_INTEGER_SMOKE_MATRIX: ${{ needs.detect-changed-images.outputs.expected-smoke-matrix }}
          DETECT_COPA_RESULT: ${{ needs.detect-copa-changes.result }}
          COPA_CHANGED_RESULT: ${{ needs.copa-patching-changed.result }}
          COPA_REGRESSION_RESULT: ${{ needs.copa-patching-regression.result }}
        run: |
          echo "changes: ${CHANGES_RESULT}"
          echo "integer: ${INTEGER}"
          echo "copa: ${COPA}"
          echo "discover: ${DISCOVER_RESULT}"
          echo "validate: ${VALIDATE_RESULT}"
          echo "detect-changed-images: ${DETECT_INTEGER_RESULT}"
          echo "integer-has-changes: ${INTEGER_HAS_CHANGES}"
          echo "integer-smoke-test: ${INTEGER_SMOKE_RESULT}"
          echo "integer-build-changed: ${INTEGER_BUILD_RESULT}"
          echo "detect-copa-changes: ${DETECT_COPA_RESULT}"
          echo "copa-patching-changed: ${COPA_CHANGED_RESULT}"
          echo "copa-patching-regression: ${COPA_REGRESSION_RESULT}"

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} did not succeed: ${result}"
              exit 1
            fi
          }

          allow_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::${name} did not succeed or skip cleanly: ${result}"
                exit 1
                ;;
            esac
          }

          require_integer_markers() {
            local matrix="$1"
            local kind="$2"
            local entries
            if ! entries=$(jq -ce '
              if (.include | type) == "array" and (.include | length) > 0 then
                .include | unique_by(.image, .version, .type)[]
              else
                error("expected a non-empty include array")
              end
            ' <<< "$matrix"); then
              echo "::error::invalid expected Integer ${kind} matrix"
              exit 1
            fi
            while IFS= read -r entry; do
              image=$(jq -r '.image' <<< "$entry")
              version=$(jq -r '.version' <<< "$entry")
              type=$(jq -r '.type' <<< "$entry")
              safe_image=$(printf '%s' "$image" | tr '/:' '--')
              for arch in amd64 arm64; do
                marker="integer-security-results/${kind}-${safe_image}-${version}-${type}-${arch}.passed"
                if [ ! -f "$marker" ]; then
                  echo "::error::missing successful Integer ${kind} security leg: ${image}:${version}-${type} (${arch})"
                  exit 1
                fi
              done
            done <<< "$entries"
          }

          require_success "changes" "$CHANGES_RESULT"

          if [ "$INTEGER" = "true" ]; then
            require_success "validate" "$VALIDATE_RESULT"
            require_success "detect-changed-images" "$DETECT_INTEGER_RESULT"
            if [ "$INTEGER_HAS_CHANGES" = "true" ]; then
              require_success "integer-smoke-test" "$INTEGER_SMOKE_RESULT"
              require_success "integer-build-changed" "$INTEGER_BUILD_RESULT"
              require_integer_markers "$EXPECTED_INTEGER_SMOKE_MATRIX" smoke
              require_integer_markers "$EXPECTED_INTEGER_MATRIX" build
            else
              allow_success_or_skipped "integer-smoke-test" "$INTEGER_SMOKE_RESULT"
              allow_success_or_skipped "integer-build-changed" "$INTEGER_BUILD_RESULT"
            fi
          else
            allow_success_or_skipped "validate" "$VALIDATE_RESULT"
            allow_success_or_skipped "detect-changed-images" "$DETECT_INTEGER_RESULT"
            allow_success_or_skipped "integer-smoke-test" "$INTEGER_SMOKE_RESULT"
            allow_success_or_skipped "integer-build-changed" "$INTEGER_BUILD_RESULT"
          fi

          if [ "$COPA" = "true" ]; then
            require_success "discover" "$DISCOVER_RESULT"
            require_success "detect-copa-changes" "$DETECT_COPA_RESULT"
            allow_success_or_skipped "copa-patching-changed" "$COPA_CHANGED_RESULT"
            require_success "copa-patching-regression" "$COPA_REGRESSION_RESULT"
          else
            allow_success_or_skipped "discover" "$DISCOVER_RESULT"
            allow_success_or_skipped "detect-copa-changes" "$DETECT_COPA_RESULT"
            allow_success_or_skipped "copa-patching-changed" "$COPA_CHANGED_RESULT"
            allow_success_or_skipped "copa-patching-regression" "$COPA_REGRESSION_RESULT"
          fi
