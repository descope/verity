name: PR Test

# Lightweight PR validation: discover (validates config) + integer smoke tests.
# Full Copa patch pipeline runs nightly via orchestrator.yaml — NOT on PRs.

on:
  pull_request:
    paths:
      - 'copa-config.yaml'
      - 'images/**'
      - 'integer.yaml'
      - '.github/workflows/pr-test.yaml'
      - '.github/workflows/patch-image.yaml'
      - '.github/workflows/integer-*.yaml'
      - 'internal/integer/**'
      - 'cmd/integer*.go'
      - 'cmd/discover*.go'
      - 'cmd/scan*.go'

permissions:
  contents: read

env:
  TARGET_REGISTRY: ghcr.io/verity-org

jobs:
  # ── Validate discovery works ───────────────────────────────────────
  discover:
    name: Discover Images
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity
        run: go build -o verity .

      - name: Discover images
        run: |
          ./verity discover \
            --config copa-config.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            > images.json

          COUNT=$(jq 'length' images.json)
          echo "✓ Discovered ${COUNT} image+tag combos"
          jq -r '.[] | "  - \(.name): \(.source)"' images.json

  # ── Validate all integer image configs ─────────────────────────────────
  validate:
    name: Validate image configs
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Validate all image configs
        run: ./verity integer validate

  # ── Integer (Wolfi-based) smoke test ─────────────────────────────────
  integer-smoke-test:
    name: "Integer ${{ matrix.image }}:${{ matrix.version }}-${{ matrix.type }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: golang
            version: "1.24"
            type: fips
          - image: node
            version: "22"
            type: dev

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Generate apko config and build image (local, no push)
        run: |
          ./verity integer discover --gen-dir ./gen

          config="gen/${{ matrix.image }}/${{ matrix.version }}/${{ matrix.type }}.apko.yaml"
          if [ ! -f "$config" ]; then
            echo "Config not found: $config" >&2
            exit 1
          fi

          apko build \
            --arch amd64 \
            "$config" \
            "${{ matrix.image }}:smoke-test" \
            "$GITHUB_WORKSPACE/image.tar"

      - name: Trivy vulnerability scan
        run: |
          trivy image \
            --exit-code 0 \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --vuln-type os,library \
            --format json \
            --output trivy-report.json \
            --input image.tar
        continue-on-error: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: "trivy-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.type }}"
          path: trivy-report.json
          retention-days: 7

  # ── Build + scan changed Integer images ──────────────────────────────
  detect-changed-images:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Detect changed image files and build matrix
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Find image YAML files changed in this PR (use PR event SHAs)
          all_changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- 'images/*.yaml' 'images/_base/*.yaml' || true)

          if [ -z "$all_changed" ]; then
            echo "No image YAML files changed"
            echo 'has-changes=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if base images changed (affects all images)
          base_changed=$(echo "$all_changed" | grep '_base/' || true)
          image_changed=$(echo "$all_changed" | grep -v '_base/' || true)

          if [ -n "$base_changed" ]; then
            echo "Base image files changed — discovering all images"
            names=""  # empty = all
          elif [ -n "$image_changed" ]; then
            names=$(echo "$image_changed" | sed 's|images/||;s|\.yaml||' | paste -sd, || true)
            echo "Changed images: $names"
          else
            echo "No actionable changes"
            echo 'has-changes=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Discover version+type combos for changed images
          DISCOVER_FLAGS=""
          if [ -n "$names" ]; then
            DISCOVER_FLAGS="--only $names"
          fi

          # shellcheck disable=SC2086
          if ! all=$(./verity integer discover $DISCOVER_FLAGS); then
            echo "::error::verity integer discover failed"
            exit 1
          fi

          if [ -z "$all" ] || [ "$all" = "null" ] || [ "$all" = "[]" ]; then
            echo "No discoverable images"
            echo 'has-changes=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build matrix: pick the latest version per image+type.
          # sort_by(.version | split(".") | map(tonumber? // .)) handles numeric ordering.
          matrix=$(echo "$all" | jq -c '
            [.[] | . + {_key: (.name + "-" + .type)}]
            | sort_by(._key)
            | group_by(._key)
            | map(sort_by(.version | split(".") | map(tonumber? // .)) | last)
            | map({image: .name, version: .version, type: .type})
            | {include: .}
          ')

          count=$(echo "$matrix" | jq '.include | length')
          echo "Matrix: ${count} image builds"
          echo "$matrix" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo 'has-changes=true' >> "$GITHUB_OUTPUT"

  integer-build-changed:
    name: "Build ${{ matrix.image }}:${{ matrix.version }}-${{ matrix.type }}"
    needs: detect-changed-images
    if: needs.detect-changed-images.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-images.outputs.matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Check if melange build needed
        id: melange-check
        run: |
          image_yaml="images/${{ matrix.image }}.yaml"

          bespoke=$(yq -r ".types.\"${{ matrix.type }}\".melange.bespoke // \"\"" "$image_yaml")
          upstream=$(yq -r ".types.\"${{ matrix.type }}\".melange.upstream // \"\"" "$image_yaml")
          env_file=$(yq -r ".types.\"${{ matrix.type }}\".melange.env-file // \"\"" "$image_yaml")
          build_option=$(yq -r ".types.\"${{ matrix.type }}\".melange.build-option // \"\"" "$image_yaml")

          if [ -n "$bespoke" ] || [ -n "$upstream" ]; then
            needed=true
          else
            needed=false
          fi

          {
            echo "needed=${needed}"
            echo "bespoke=${bespoke}"
            echo "upstream=${upstream}"
            echo "env_file=${env_file}"
            echo "build_option=${build_option}"
          } >> "$GITHUB_OUTPUT"

      - name: Build melange package
        if: steps.melange-check.outputs.needed == 'true'
        env:
          UPSTREAM: ${{ steps.melange-check.outputs.upstream }}
          BESPOKE: ${{ steps.melange-check.outputs.bespoke }}
          ENV_FILE: ${{ steps.melange-check.outputs.env_file }}
          BUILD_OPTION: ${{ steps.melange-check.outputs.build_option }}
        run: |
          mkdir -p melange-work

          if [ -n "$BESPOKE" ]; then
            cp "packages/bespoke/${BESPOKE}" melange-work/build.yaml
          elif [ -n "$UPSTREAM" ]; then
            commit=$(jq -r '.wolfi_commit' packages/upstream.lock.json)
            if [ "$commit" = "null" ] || [ -z "$commit" ]; then
              echo "wolfi_commit missing or null in packages/upstream.lock.json" >&2
              exit 1
            fi
            file=$(jq -r --arg pkg "$UPSTREAM" '.packages[$pkg].file' packages/upstream.lock.json)
            expected_sha=$(jq -r --arg pkg "$UPSTREAM" '.packages[$pkg].sha256' packages/upstream.lock.json)
            if [ "$file" = "null" ] || [ -z "$file" ]; then
              echo "Package '${UPSTREAM}' not found in upstream.lock.json" >&2
              exit 1
            fi
            if [ "$expected_sha" = "null" ] || [ -z "$expected_sha" ]; then
              echo "No sha256 for '${UPSTREAM}' in upstream.lock.json" >&2
              exit 1
            fi
            url="https://raw.githubusercontent.com/wolfi-dev/os/${commit}/${file}"
            echo "Fetching upstream melange YAML: ${url}"
            curl -fsSL "$url" -o melange-work/build.yaml.tmp
            actual_sha=$(sha256sum melange-work/build.yaml.tmp | awk '{print $1}')
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "sha256 mismatch for ${UPSTREAM}: expected ${expected_sha}, got ${actual_sha}" >&2
              rm -f melange-work/build.yaml.tmp
              exit 1
            fi
            mv melange-work/build.yaml.tmp melange-work/build.yaml

            echo "Fetching wolfi pipelines/ and ${UPSTREAM}/ companion dir at commit ${commit}"
            tmp_wolfi=$(mktemp -d)
            trap 'rm -rf "$tmp_wolfi"' EXIT
            git -C "$tmp_wolfi" init --quiet
            git -C "$tmp_wolfi" remote add origin "https://github.com/wolfi-dev/os.git"

            if [[ ! "$UPSTREAM" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "upstream value contains unsafe characters: '${UPSTREAM}'" >&2
              exit 1
            fi

            git -C "$tmp_wolfi" sparse-checkout set --no-cone pipelines "${UPSTREAM}"
            git -C "$tmp_wolfi" fetch --quiet --depth 1 --filter=blob:none origin "$commit"
            git -C "$tmp_wolfi" checkout --quiet FETCH_HEAD -- pipelines "${UPSTREAM}" 2>/dev/null || \
              git -C "$tmp_wolfi" checkout --quiet FETCH_HEAD -- pipelines
            rm -rf melange-work/pipelines
            cp -r "$tmp_wolfi/pipelines" melange-work/pipelines
            if [ -d "$tmp_wolfi/${UPSTREAM}" ]; then
              cp -r "$tmp_wolfi/${UPSTREAM}/." melange-work/
              echo "Copied ${UPSTREAM}/ companion files into melange-work/"
            fi
          fi

          melange keygen melange-work/melange.rsa

          MELANGE_ARGS=(
            build melange-work/build.yaml
            --arch x86_64
            --signing-key melange-work/melange.rsa
            --out-dir packages/repo
            --repository-append https://packages.wolfi.dev/os
            --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
            --runner docker
          )

          if [ -d melange-work/pipelines ]; then
            MELANGE_ARGS+=(--pipeline-dirs melange-work/pipelines)
          fi

          if [ -n "$ENV_FILE" ]; then
            MELANGE_ARGS+=(--env-file "packages/overrides/${ENV_FILE}")
          fi
          if [ -n "$BUILD_OPTION" ]; then
            MELANGE_ARGS+=(--build-option "$BUILD_OPTION")
          fi

          echo "Running: melange ${MELANGE_ARGS[*]}"
          melange "${MELANGE_ARGS[@]}"

      - name: Build image (local, no push)
        run: |
          if [ "${{ steps.melange-check.outputs.needed }}" != "true" ]; then
            ./verity integer build \
              --image ${{ matrix.image }} \
              --version ${{ matrix.version }} \
              --type ${{ matrix.type }} \
              --output image.tar \
              --arch amd64
          else
            ./verity integer discover --gen-dir ./gen

            config="gen/${{ matrix.image }}/${{ matrix.version }}/${{ matrix.type }}.apko.yaml"
            if [ ! -f "$config" ]; then
              echo "Config not found: $config" >&2
              exit 1
            fi

            # Inject local melange repo into the generated apko config
            # (@local syntax works in YAML but not reliably via --repository-append)
            yq -i '.contents.repositories += ["@local '"${GITHUB_WORKSPACE}"'/packages/repo"]' "$config"
            yq -i '.contents.keyring += ["'"${GITHUB_WORKSPACE}"'/melange-work/melange.rsa.pub"]' "$config"

            apko build \
              --arch amd64 \
              "$config" \
              "${{ matrix.image }}:pr-test" \
              "$GITHUB_WORKSPACE/image.tar"
          fi

          echo "\u2713 Built ${{ matrix.image }}:${{ matrix.version }}-${{ matrix.type }}"
          ls -lh image.tar

      - name: Trivy vulnerability scan
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --format table \
            --input image.tar

          echo "\u2713 Zero CRITICAL/HIGH CVEs"

      - name: Full vulnerability report
        if: always()
        run: |
          trivy image \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --vuln-type os,library \
            --format json \
            --output trivy-report.json \
            --input image.tar

          TOTAL=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-report.json)
          echo "Total vulnerabilities: ${TOTAL}"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: "trivy-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.type }}"
          path: trivy-report.json
          retention-days: 7
