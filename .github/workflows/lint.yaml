name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          install_args: "go go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint go:golang.org/x/vuln/cmd/govulncheck"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run govulncheck
        run: govulncheck ./...

  static-lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          install_args: "node actionlint yamllint shellcheck npm:markdownlint-cli"

      - name: Run actionlint
        run: actionlint

      - name: Validate patch-image workflow guards
        run: python3 .github/scripts/validate-patch-image-workflow.py

      - name: Validate integer-build-image workflow guards
        run: python3 .github/scripts/validate-integer-build-image-workflow.py

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

      - name: Run ShellCheck
        run: shellcheck .github/scripts/*.sh

      - name: Run markdownlint
        run: markdownlint "*.md" --ignore node_modules --ignore site/node_modules

  node-lint:
    name: Node Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          install_args: "node"

      - name: Cache npm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Check Prettier formatting
        working-directory: site
        run: npm run format:check

      - name: Run ESLint
        working-directory: site
        run: npm run lint
