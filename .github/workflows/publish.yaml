name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publication mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - bootstrap
          - restore
      authorize_bootstrap:
        description: "Authorize a genesis publication"
        required: true
        default: false
        type: boolean
      authorize_restore:
        description: "Authorize restoration of one exact prior Build Site run"
        required: true
        default: false
        type: boolean
      previous_run_id:
        description: "Exact prior Build Site run ID"
        required: false
        type: string
      previous_run_attempt:
        description: "Exact prior Build Site run attempt"
        required: false
        type: string
      previous_source_sha:
        description: "Exact prior Build Site source SHA"
        required: false
        type: string
      previous_artifact_digest:
        description: "Exact prior github-pages archive digest"
        required: false
        type: string
      previous_manifest_digest:
        description: "Exact prior publication manifest digest"
        required: false
        type: string

permissions: {}

jobs:
  publish:
    name: Run protected publication DAG
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
      pages: write
    uses: ./.github/workflows/build-site.yaml
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
      trigger_event: ${{ github.event_name }}
      authorize_bootstrap: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_bootstrap || false }}
      authorize_restore: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_restore || false }}
      previous_run_id: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_run_id || '' }}
      previous_run_attempt: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_run_attempt || '' }}
      previous_source_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_source_sha || '' }}
      previous_artifact_digest: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_artifact_digest || '' }}
      previous_manifest_digest: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_manifest_digest || '' }}
