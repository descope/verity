name: Patch Image
run-name: "Patch ${{ inputs.image-name }} (${{ inputs.source-ref }})${{ inputs.batch_id != '' && format(' [batch {0}]', inputs.batch_id) || '' }}"

# Reusable per-image lifecycle: scan → patch (matrix) → finalize.
# Supports both workflow_call (PR inline) and workflow_dispatch (orchestrator).

on:
  workflow_call:
    inputs:
      image-name:
        description: "Short name of the image (e.g., nginx)"
        required: true
        type: string
      source-ref:
        description: "Full source image reference (e.g., mirror.gcr.io/library/nginx:1.29.3)"
        required: true
        type: string
      target-registry:
        description: "Target registry for final patched images (e.g., ghcr.io/verity-org)"
        required: true
        type: string
      platforms:
        description: "Comma-separated platforms (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      is-pr:
        description: "Set true when called from a PR; skips signing/attestation and reports branch push"
        required: false
        type: boolean
        default: false
      artifact-suffix:
        description: "Unique suffix appended to artifact names to avoid collisions in matrix runs"
        required: false
        type: string
        default: ""
      go-vcs-url:
        description: "Go VCS URL for binary patching (e.g., https://github.com/org/repo@v1.0.0)"
        required: false
        type: string
        default: ""
      source_sha:
        description: "Exact source commit from the caller"
        required: true
        type: string
      run_id:
        description: "Exact caller run ID"
        required: true
        type: string
      run_attempt:
        description: "Exact caller run attempt"
        required: true
        type: string
      publication_id:
        description: "Exact publication identity"
        required: true
        type: string
      batch_id:
        description: "Exact publication batch ID"
        required: true
        type: string
      verity_artifact_name:
        description: "Exact current-run Verity artifact name"
        required: true
        type: string
      verity_artifact_digest:
        description: "Exact current-run Verity artifact digest"
        required: true
        type: string
      verity_build_key:
        description: "Exact current-run Verity build key"
        required: true
        type: string
    outputs:
      source_sha:
        description: "Patched image source commit"
        value: ${{ jobs.scan.outputs.source_sha }}
      run_id:
        description: "Patched image producer run ID"
        value: ${{ jobs.scan.outputs.run_id }}
      run_attempt:
        description: "Patched image producer run attempt"
        value: ${{ jobs.scan.outputs.run_attempt }}
      publication_id:
        description: "Patched image publication identity"
        value: ${{ jobs.scan.outputs.publication_id }}
      batch_id:
        description: "Patched image publication batch"
        value: ${{ jobs.scan.outputs.batch_id }}
      artifact_name:
        description: "Immutable per-image COPA manifest artifact"
        value: ${{ jobs.scan.outputs.artifact_name }}
      artifact_digest:
        description: "Immutable per-image COPA manifest digest"
        value: ${{ jobs.scan.outputs.artifact_digest }}

  workflow_dispatch:
    inputs:
      image-name:
        description: "Short name of the image (e.g., nginx)"
        required: true
        type: string
      source-ref:
        description: "Full source image reference (e.g., mirror.gcr.io/library/nginx:1.29.3)"
        required: true
        type: string
      target-registry:
        description: "Target registry for final patched images (e.g., ghcr.io/verity-org)"
        required: true
        type: string
      platforms:
        description: "Comma-separated platforms (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      go-vcs-url:
        description: "Go VCS URL for binary patching (e.g., https://github.com/org/repo@v1.0.0)"
        required: false
        type: string
        default: ""
      batch_id:
        description: "Parent orchestrator run ID and attempt"
        required: false
        type: string
        default: ""
      publication_id:
        description: "Exact publication identity"
        required: false
        type: string
        default: ""

permissions: {}

env:
  OTEL_CLI_VERSION: "0.4.5"
  OTEL_CLI_SHA256_LINUX_AMD64: "2f192fadfb2107a92ae617ca93fd7c0b532fa618a5ebc3917e641c6a9fbaeb45"
  OTEL_CLI_SHA256_LINUX_ARM64: "f8f27f1289850983f86beaf62968ab65e3491207291d0cdb68247826cc21e695"

jobs:
  build-verity:
    name: Build Verity once
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/build-verity-protected.yaml

  verity:
    name: Resolve exact Verity coordinates
    needs: build-verity
    if: ${{ always() && (needs.build-verity.result == 'success' || needs.build-verity.result == 'skipped') }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions: {}
    outputs:
      source-sha: ${{ inputs.source_sha || needs.build-verity.outputs.source-sha }}
      artifact-name: ${{ inputs.verity_artifact_name || needs.build-verity.outputs.artifact-name }}
      artifact-digest: ${{ inputs.verity_artifact_digest || needs.build-verity.outputs.artifact-digest }}
      build-key: ${{ inputs.verity_build_key || needs.build-verity.outputs.build-key }}
    steps:
      - name: Reject incomplete called Verity coordinates
        if: ${{ github.event_name == 'workflow_call' && (inputs.source_sha == '' || inputs.verity_artifact_name == '' || inputs.verity_artifact_digest == '' || inputs.verity_build_key == '') }}
        run: exit 1

      - name: Resolve exact coordinates
        run: ":"

  # ── Job 1: Scan ────────────────────────────────────────────────────
  scan:
    name: "Scan ${{ inputs.image-name }}"
    needs: verity
    if: >-
      !cancelled() && needs.verity.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i+m8i/cpu=16/ram=32/image=ubuntu24-full-x64/volume=150gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      needs-patch: ${{ steps.check.outputs.needs-patch }}
      source-tag: ${{ steps.parse.outputs.source-tag }}
      staging-registry: ${{ steps.parse.outputs.staging-registry }}
      prev-report-exists: ${{ steps.prev-report.outputs.exists }}
      pre-vuln-count: ${{ steps.trivy-pre.outputs.vuln-count }}
      safe-name: ${{ steps.parse.outputs.safe-name }}
      source_sha: ${{ needs.verity.outputs.source-sha }}
      run_id: ${{ inputs.run_id || github.run_id }}
      run_attempt: ${{ inputs.run_attempt || github.run_attempt }}
      publication_id: ${{ inputs.publication_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      batch_id: ${{ inputs.batch_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      artifact_name: copa-patch-${{ inputs.publication_id || format('{0}-{1}', github.run_id, github.run_attempt) }}-${{ steps.parse.outputs.safe-name }}-${{ steps.parse.outputs.source-tag }}
      artifact_digest: ${{ steps.producer-artifact.outputs.artifact-digest }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Activate RunsOn telemetry
        uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2.2.0
        with:
          show_env: "false"
          show_costs: summary
          metrics: cpu,memory,disk,io,network

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"
          sparse-checkout: |
            mise.toml
            mise.lock
            .github/
            go.mod
            go.sum
            internal/buildmetadata/
          sparse-checkout-cone-mode: "false"

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.verity.outputs.artifact-digest }}
          source-sha: ${{ needs.verity.outputs.source-sha }}
          build-key: ${{ needs.verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Login to GHCR
        id: ghcr-login
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./verity ci workflowops retry-docker-login

      - name: Parse inputs
        id: parse
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          IMAGE_NAME: ${{ inputs.image-name }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
        run: ./verity ci patch-image parse-inputs

      - name: Get Trivy cache date key
        id: trivy-date
        run: ./verity ci patch-image trivy-date

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan source image
        id: trivy-pre
        env:
          IMAGE: ${{ inputs.source-ref }}
        run: ./verity ci patch-image scan-source

      - name: Upload immutable per-image COPA manifest
        id: producer-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copa-patch-${{ inputs.publication_id || format('{0}-{1}', github.run_id, github.run_attempt) }}-${{ steps.parse.outputs.safe-name }}-${{ steps.parse.outputs.source-tag }}
          path: pre.json
          retention-days: "7"
          if-no-files-found: error

      - name: Check existing patched image for vulnerabilities
        id: check
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ steps.parse.outputs.source-tag }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
        run: ./verity ci patch-image check-existing

      - name: Download previous post-patch report from reports branch
        id: prev-report
        if: steps.check.outputs.needs-patch == 'true'
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ steps.parse.outputs.source-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./verity ci patch-image download-previous-report

      - name: Upload scan artifacts
        if: steps.check.outputs.needs-patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ steps.parse.outputs.safe-name }}-${{ steps.parse.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: |
            pre.json
            prev-post.json
          retention-days: "1"

  # ── Job 2: Patch (per-platform matrix) ────────────────────────────
  patch:
    name: "Patch ${{ inputs.image-name }} (${{ matrix.platform }})"
    needs: [scan, verity]
    if: >-
      needs.scan.outputs.needs-patch == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=${{ matrix.platform == 'linux/amd64' && 'c8i+m8i' || 'c8g+m8g' }}/cpu=16/ram=32/image=ubuntu24-full-${{ matrix.platform == 'linux/amd64' && 'x64' || 'arm64' }}/volume=150gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner_profile: buildkit-x64
          - platform: linux/arm64
            runner_profile: buildkit-arm64
    # Filter to only requested platforms
    # (uses the include list but skips platforms not in inputs.platforms)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Activate RunsOn telemetry
        uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2.2.0
        with:
          show_env: "false"
          show_costs: summary
          metrics: cpu,memory,disk,io,network

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: "false"

      - name: Retry checkout on failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.verity.outputs.artifact-digest }}
          source-sha: ${{ needs.verity.outputs.source-sha }}
          build-key: ${{ needs.verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Check if this platform is requested
        id: platform-check
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PLATFORM: ${{ matrix.platform }}
        run: ./verity ci patch-image platform-requested

      - name: Install mise
        if: steps.platform-check.outputs.enabled == 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        if: steps.platform-check.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Login to GHCR
        if: steps.platform-check.outputs.enabled == 'true'
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./verity ci workflowops retry-docker-login

      - name: Setup BuildKit
        if: steps.platform-check.outputs.enabled == 'true'
        run: |
          BUILDKIT_IMAGE="${{ needs.scan.outputs.staging-registry }}/buildkit:buildx-stable-1"
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --buildkitd-flags '--allow-insecure-entitlement network.host' \
            --use
          docker buildx inspect --bootstrap

      - name: Download scan artifacts
        if: steps.platform-check.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: .

      - name: Setup binaries
        if: steps.platform-check.outputs.enabled == 'true'
        uses: ./.github/actions/setup-binaries
        with:
          github-token: ${{ github.token }}

      - name: Patch image
        id: copa
        if: steps.platform-check.outputs.enabled == 'true'
        env:
          COPA_EXPERIMENTAL: "1"
        # The typed command performs a real crane copy fallback when Copa has no updates.
        run: >-
          ./verity ci repository-ops patch-image
          --platform "${{ matrix.platform }}"
          --source "${{ inputs.source-ref }}"
          --image-name "${{ inputs.image-name }}"
          --staging-registry "${{ needs.scan.outputs.staging-registry }}"
          --go-vcs-url "${{ inputs.go-vcs-url }}"
          --report pre.json
          --github-output "$GITHUB_OUTPUT"

      - name: Write per-platform metrics
        if: ${{ !cancelled() && steps.platform-check.outputs.enabled == 'true' }}
        id: pl-meta
        env:
          ARCH: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          DURATION: ${{ steps.copa.outputs.duration-seconds }}
          EXIT_CODE: ${{ steps.copa.outputs.exit-code }}
          DIGEST: ${{ steps.copa.outputs.staging-digest }}
        run: ./verity ci patch-image write-platform-metrics

      - name: Upload per-platform metrics artifact
        if: ${{ !cancelled() && steps.platform-check.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _pl-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}
          path: ${{ steps.pl-meta.outputs.path }}
          retention-days: "1"
          if-no-files-found: error

      - name: Cache otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && steps.platform-check.outputs.enabled == 'true' }}
        id: cache-otel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/otel-cli
          key: otel-cli-v${{ env.OTEL_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && steps.platform-check.outputs.enabled == 'true' && steps.cache-otel.outputs.cache-hit != 'true' }}
        run: ./verity ci patch-image install-otel

      - name: Emit Honeycomb span (per-platform patch)
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && steps.platform-check.outputs.enabled == 'true' }}
        env:
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: x-honeycomb-team=${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_SERVICE_NAME: verity-ci
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          CVE_BEFORE: ${{ needs.scan.outputs.pre-vuln-count }}
          COPA_EXIT: ${{ steps.copa.outputs.exit-code }}
          COPA_DURATION: ${{ steps.copa.outputs.duration-seconds }}
          STAGING_DIGEST: ${{ steps.copa.outputs.staging-digest }}
        run: ./verity ci patch-image emit-platform-span

  # ── Job 3: Finalize ───────────────────────────────────────────────
  finalize:
    name: "Finalize ${{ inputs.image-name }}"
    needs: [scan, patch, verity]
    if: needs.scan.outputs.needs-patch == 'true' && needs.patch.result == 'success'
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    outputs:
      metrics-artifact-name: ${{ steps.metrics-json.outputs.artifact-name }}
      metrics-run-id: ${{ steps.metrics-json.outputs.run-id }}
      metrics-run-attempt: ${{ steps.metrics-json.outputs.run-attempt }}
      metrics-source-sha: ${{ steps.metrics-json.outputs.source-sha }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    # Serialize report writes for the same image+tag to prevent SHA-based TOCTOU
    # conflicts in the typed report publisher (GitHub Contents API requires the current SHA).
    concurrency:
      group: reports-${{ inputs.image-name }}-${{ needs.scan.outputs.source-tag }}
      cancel-in-progress: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        id: finalize-harden
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: finalize-checkout
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            .github/actions/setup-verity
            go.mod
            go.sum
            internal/buildmetadata/
          sparse-checkout-cone-mode: "false"

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.verity.outputs.artifact-digest }}
          source-sha: ${{ needs.verity.outputs.source-sha }}
          build-key: ${{ needs.verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Install mise
        id: finalize-mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: "true"
          cache: "true"

      - name: Login to GHCR
        id: ghcr-login
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./verity ci workflowops retry-docker-login

      - name: Download scan artifacts
        id: scan-artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: .

      - name: Create multi-arch manifest
        id: manifest
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          STAGING_REGISTRY: ${{ needs.scan.outputs.staging-registry }}
          PLATFORMS: ${{ inputs.platforms }}
        run: ./verity ci patch-image create-manifest

      - name: Post-scan new patched image
        id: postscan
        env:
          IMAGE: ${{ steps.manifest.outputs.manifest-tag }}
        run: ./verity ci patch-image scan-post

      - name: Compare with previous post-patch report
        id: compare
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
          PREVIOUS_EXISTED: ${{ needs.scan.outputs.prev-report-exists }}
        run: ./verity ci patch-image compare-reports

      - name: Push manifest to target registry
        id: push
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
          MANIFEST_TAG: ${{ steps.manifest.outputs.manifest-tag }}
        run: ./verity ci patch-image crane copy

      - name: Resolve target manifest
        id: target
        if: ${{ !cancelled() && inputs.is-pr == false }}
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
        run: ./verity ci patch-image resolve-manifest

      - name: Sign manifest with cosign
        id: cosign-sign
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          FINAL_REPO: ${{ steps.push.outputs.final-repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: ./verity ci patch-image cosign sign

      - name: Generate SBOM
        id: sbom
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        run: |
          syft "${{ steps.push.outputs.final-tag }}@${{ steps.push.outputs.digest }}" -o cyclonedx-json=sbom.json

      - name: Attest SBOM
        id: attest
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.push.outputs.final-repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom.json
          push-to-registry: "true"

      - name: Cache otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' }}
        id: cache-otel-finalize
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/otel-cli
          key: otel-cli-v${{ env.OTEL_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install otel-cli
        id: install-otel-finalize
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && steps.cache-otel-finalize.outputs.cache-hit != 'true' }}
        run: ./verity ci patch-image install-otel

      - name: Emit Honeycomb span (per-image finalize)
        id: emit-otel-finalize
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' }}
        env:
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: x-honeycomb-team=${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_SERVICE_NAME: verity-ci
        run: |
          set -euo pipefail
          ~/.local/bin/otel-cli span \
            --name "patch-image.finalize" \
            --service verity-ci \
            --kind internal \
            --attrs "image=${{ inputs.image-name }},source_tag=${{ needs.scan.outputs.source-tag }},manifest_digest=${{ steps.target.outputs.digest }},final_tag=${{ steps.target.outputs.final-tag }},final_repo=${{ steps.push.outputs.final-repo }},post_scan_vuln_count=${{ steps.postscan.outputs.vuln-count }},rekor_url=${{ steps.cosign-sign.outputs.rekor-url }},attestation_id=${{ steps.attest.outputs.attestation-id }},attestation_bundle_path=${{ steps.attest.outputs.bundle-path }},deployment.environment=verity-prod"

      - name: Push reports to reports branch
        id: push-reports
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # git push equivalent: the typed command writes through the GitHub Contents API.
          ./verity ci workflowops push-reports
          "reports/${IMAGE_NAME}/${SOURCE_TAG}/pre.json" pre.json
          "reports/${IMAGE_NAME}/${SOURCE_TAG}/post.json" post.json

      - name: Update preflight manifest
        id: preflight-manifest
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          SOURCE_REF: ${{ inputs.source-ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./verity ci patch-image update-preflight

      - name: Upload PR scan artifacts
        id: upload-pr-scan
        if: inputs.is-pr == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-patch-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: |
            pre.json
            post.json
          retention-days: "7"

      # Companion artifacts follow _pl-${arch}-${safe-name}-${source-tag}.
      - name: Download per-platform metrics
        if: ${{ !cancelled() }}
        id: pl-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: _pl-*-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}
          path: ${{ runner.temp }}/pl-meta
          merge-multiple: "true"

      # merge-multiple writes platform-amd64.json / platform-arm64.json into one directory.
      - name: Merge per-platform metadata
        if: ${{ !cancelled() }}
        id: pl-merged
        env:
          PLATFORM_METRICS_DIR: ${{ runner.temp }}/pl-meta
        run: ./verity ci patch-image merge-platform-metrics

      - name: Build consolidated metrics JSON
        if: ${{ !cancelled() }}
        id: metrics-json
        env:
          SAFE_NAME: ${{ needs.scan.outputs.safe-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_SHA: ${{ needs.verity.outputs.source-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARDEN_OUTCOME: ${{ steps.finalize-harden.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.finalize-checkout.outcome }}
          MISE_OUTCOME: ${{ steps.finalize-mise.outcome }}
          LOGIN_OUTCOME: ${{ steps.ghcr-login.outcome }}
          SCAN_ARTIFACTS_OUTCOME: ${{ steps.scan-artifacts.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          POSTSCAN_OUTCOME: ${{ steps.postscan.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          COSIGN_OUTCOME: ${{ steps.cosign-sign.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          OTEL_CACHE_OUTCOME: ${{ steps.cache-otel-finalize.outcome }}
          OTEL_INSTALL_OUTCOME: ${{ steps.install-otel-finalize.outcome }}
          OTEL_EMIT_OUTCOME: ${{ steps.emit-otel-finalize.outcome }}
          PUSH_REPORTS_OUTCOME: ${{ steps.push-reports.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight-manifest.outcome }}
          UPLOAD_PR_SCAN_OUTCOME: ${{ steps.upload-pr-scan.outcome }}
          PL_DOWNLOAD_OUTCOME: ${{ steps.pl-download.outcome }}
          PL_MERGE_OUTCOME: ${{ steps.pl-merged.outcome }}
          TARGET_REF: ${{ steps.target.outputs.final-tag }}
          MANIFEST_DIGEST: ${{ steps.target.outputs.digest }}
          VULN_BEFORE: ${{ needs.scan.outputs.pre-vuln-count }}
          VULN_AFTER: ${{ steps.postscan.outputs.vuln-count }}
          AMD64: ${{ steps.pl-merged.outputs.amd64 }}
          ARM64: ${{ steps.pl-merged.outputs.arm64 }}
          REKOR_URL: ${{ steps.cosign-sign.outputs.rekor-url }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: ./verity ci patch-image build-success-metrics

      - name: Upload metrics artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: "5"
        with:
          name: ${{ steps.metrics-json.outputs.artifact-name }}
          path: ${{ steps.metrics-json.outputs.filename }}
          retention-days: "7"
          if-no-files-found: error

  # ── Job 4: Metrics on Failure ─────────────────────────────────────
  # When the patch matrix fails, finalize is skipped — but we still want
  # a durable metrics record for trend analysis. Emits a minimal JSON
  # capturing the failure with whatever per-platform breadcrumbs the
  # matrix produced before failing, so failed runs land in _metrics.
  metrics-on-failure:
    name: "Metrics on Failure: ${{ inputs.image-name }}"
    needs: [scan, patch, verity]
    if: ${{ !cancelled() && needs.scan.outputs.needs-patch == 'true' && needs.patch.result == 'failure' }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    outputs:
      metrics-artifact-name: ${{ steps.metrics-json.outputs.artifact-name }}
      metrics-run-id: ${{ steps.metrics-json.outputs.run-id }}
      metrics-run-attempt: ${{ steps.metrics-json.outputs.run-attempt }}
      metrics-source-sha: ${{ steps.metrics-json.outputs.source-sha }}
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
          sparse-checkout: |
            mise.toml
            mise.lock
            .github/actions/setup-verity
            go.mod
            go.sum
            internal/buildmetadata/
          sparse-checkout-cone-mode: "false"

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.verity.outputs.artifact-digest }}
          source-sha: ${{ needs.verity.outputs.source-sha }}
          build-key: ${{ needs.verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Download per-platform metrics (best-effort)
        id: download-pl
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: _pl-*-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}
          path: ${{ runner.temp }}/pl-meta
          merge-multiple: "true"

      - name: Resolve workflow start timestamp
        id: started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./verity ci patch-image workflow-start

      - name: Build minimal failure metrics JSON
        id: metrics-json
        env:
          SAFE_NAME: ${{ needs.scan.outputs.safe-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_SHA: ${{ needs.verity.outputs.source-sha }}
          STARTED_AT: ${{ steps.started.outputs.value }}
          PLATFORM_METRICS_DIR: ${{ runner.temp }}/pl-meta
        run: ./verity ci patch-image build-failure-metrics

      - name: Upload metrics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: "5"
        with:
          name: ${{ steps.metrics-json.outputs.artifact-name }}
          path: ${{ steps.metrics-json.outputs.filename }}
          retention-days: "7"
          if-no-files-found: error

  # Call the archive workflow directly. Runs dispatched by GITHUB_TOKEN do not
  # emit a downstream workflow_run event, but nested reusable workflows remain
  # part of this run and can consume its completed metrics artifact.
  archive-metrics:
    name: Archive Metrics
    needs: [scan, patch, finalize, metrics-on-failure, verity]
    if: ${{ always() && !cancelled() && inputs.is-pr != true && needs.scan.outputs.needs-patch == 'true' && (needs.finalize.outputs.metrics-artifact-name != '' || needs.metrics-on-failure.outputs.metrics-artifact-name != '') }}
    permissions:
      actions: read
      attestations: read
      contents: write
    uses: ./.github/workflows/metrics-finalize.yaml
    with:
      run-id: ${{ needs.finalize.outputs.metrics-run-id || needs.metrics-on-failure.outputs.metrics-run-id }}
      run-attempt: ${{ needs.finalize.outputs.metrics-run-attempt || needs.metrics-on-failure.outputs.metrics-run-attempt }}
      artifact-name: ${{ needs.finalize.outputs.metrics-artifact-name || needs.metrics-on-failure.outputs.metrics-artifact-name }}
      source_sha: ${{ needs.finalize.outputs.metrics-source-sha || needs.metrics-on-failure.outputs.metrics-source-sha }}
      verity_artifact_name: ${{ needs.verity.outputs.artifact-name }}
      verity_artifact_digest: ${{ needs.verity.outputs.artifact-digest }}
      verity_build_key: ${{ needs.verity.outputs.build-key }}
    secrets:
      archive-token: ${{ secrets.GITHUB_TOKEN }}
