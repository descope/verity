name: Patch Image
run-name: "Patch ${{ inputs.image-name }} (${{ inputs.source-ref }})"

# Reusable per-image lifecycle: scan → patch (matrix) → finalize.
# Supports both workflow_call (PR inline) and workflow_dispatch (orchestrator).

on:
  workflow_call:
    inputs:
      image-name:
        description: "Short name of the image (e.g., nginx)"
        required: true
        type: string
      source-ref:
        description: "Full source image reference (e.g., mirror.gcr.io/library/nginx:1.29.3)"
        required: true
        type: string
      target-registry:
        description: "Target registry for final patched images (e.g., ghcr.io/verity-org)"
        required: true
        type: string
      platforms:
        description: "Comma-separated platforms (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      is-pr:
        description: "Set true when called from a PR; skips signing/attestation and reports branch push"
        required: false
        type: boolean
        default: false
      artifact-suffix:
        description: "Unique suffix appended to artifact names to avoid collisions in matrix runs"
        required: false
        type: string
        default: ""
      go-vcs-url:
        description: "Go VCS URL for binary patching (e.g., https://github.com/org/repo@v1.0.0)"
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      image-name:
        description: "Short name of the image (e.g., nginx)"
        required: true
        type: string
      source-ref:
        description: "Full source image reference (e.g., mirror.gcr.io/library/nginx:1.29.3)"
        required: true
        type: string
      target-registry:
        description: "Target registry for final patched images (e.g., ghcr.io/verity-org)"
        required: true
        type: string
      platforms:
        description: "Comma-separated platforms (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      go-vcs-url:
        description: "Go VCS URL for binary patching (e.g., https://github.com/org/repo@v1.0.0)"
        required: false
        type: string
        default: ""

permissions:
  contents: write       # push to reports branch
  packages: write       # push images to GHCR
  id-token: write       # cosign keyless signing + actions/attest
  attestations: write   # actions/attest

env:
  HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
  OTEL_CLI_VERSION: "0.4.5"

jobs:
  # ── Job 1: Scan ────────────────────────────────────────────────────
  scan:
    name: "Scan ${{ inputs.image-name }}"
    runs-on: ubuntu-24.04
    outputs:
      needs-patch: ${{ steps.check.outputs.needs-patch }}
      source-tag: ${{ steps.parse.outputs.source-tag }}
      staging-registry: ${{ steps.parse.outputs.staging-registry }}
      prev-report-exists: ${{ steps.prev-report.outputs.exists }}
      pre-vuln-count: ${{ steps.trivy-pre.outputs.vuln-count }}
      safe-name: ${{ steps.parse.outputs.safe-name }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            .github/
          sparse-checkout-cone-mode: false

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse inputs
        id: parse
        run: |
          SOURCE_REF="${{ inputs.source-ref }}"
          SOURCE_TAG="${SOURCE_REF##*:}"
          echo "source-tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "safe-name=$(echo '${{ inputs.image-name }}' | tr '/: ' '---')" >> "$GITHUB_OUTPUT"

          TARGET_REGISTRY="${{ inputs.target-registry }}"
          STAGING_REGISTRY="${TARGET_REGISTRY}/cache"
          echo "staging-registry=${STAGING_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Get Trivy cache date key
        id: trivy-date
        run: echo "date=$(date -u '+%Y-%m-%d-%H')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan source image
        id: trivy-pre
        run: |
          trivy image \
            --vuln-type os,library \
            --format json \
            --quiet \
            "${{ inputs.source-ref }}" > pre.json
          VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' pre.json)
          echo "✓ Source scan: ${VULN_COUNT} vulnerabilities"
          echo "vuln-count=${VULN_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Check existing patched image for vulnerabilities
        id: check
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ steps.parse.outputs.source-tag }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
        run: |
          REPO="${TARGET_REGISTRY}/${IMAGE_NAME}"
          EXISTING_TAG="${SOURCE_TAG}"
          if crane digest "${REPO}:${EXISTING_TAG}" > /dev/null 2>&1; then
            echo "Found existing image: ${REPO}:${EXISTING_TAG}"
          else
            echo "No existing patched image found — needs patching"
            echo "needs-patch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scan existing patched image
          if ! trivy image \
            --vuln-type os,library \
            --format json \
            --quiet \
            "${REPO}:${EXISTING_TAG}" > patched-existing.json 2>/dev/null; then
            echo "Trivy scan failed — treating as needs-patch to be safe"
            echo "needs-patch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' patched-existing.json 2>/dev/null); then
            echo "Failed to parse Trivy JSON — treating as needs-patch to be safe"
            echo "needs-patch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Existing patched image vulnerabilities: ${VULN_COUNT}"

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "Vulnerabilities found in patched image — needs re-patching"
            echo "needs-patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "Patched image is clean — skipping"
            echo "needs-patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous post-patch report from reports branch
        id: prev-report
        if: steps.check.outputs.needs-patch == 'true'
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ steps.parse.outputs.source-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api \
            "repos/${{ github.repository }}/contents/reports/${IMAGE_NAME}/${SOURCE_TAG}/post.json?ref=reports" \
            --jq '.content' 2>/dev/null \
            | base64 -d > prev-post.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ Previous post report downloaded ($(wc -c < prev-post.json) bytes)"
          else
            echo '{"Results":[]}' > prev-post.json
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No previous post report found — treating as first-time patch"
          fi

      - name: Upload scan artifacts
        if: steps.check.outputs.needs-patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ steps.parse.outputs.safe-name }}-${{ steps.parse.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: |
            pre.json
            prev-post.json
          retention-days: 1

  # ── Job 2: Patch (per-platform matrix) ────────────────────────────
  patch:
    name: "Patch ${{ inputs.image-name }} (${{ matrix.platform }})"
    needs: scan
    if: needs.scan.outputs.needs-patch == 'true'
    runs-on: ${{ matrix.runner }}
    outputs:
      timing-amd64: ${{ matrix.platform == 'linux/amd64' && steps.copa.outputs.duration-seconds || '' }}
      timing-arm64: ${{ matrix.platform == 'linux/arm64' && steps.copa.outputs.duration-seconds || '' }}
      copa-exit-amd64: ${{ matrix.platform == 'linux/amd64' && steps.copa.outputs.exit-code || '' }}
      copa-exit-arm64: ${{ matrix.platform == 'linux/arm64' && steps.copa.outputs.exit-code || '' }}
      staging-digest-amd64: ${{ matrix.platform == 'linux/amd64' && steps.copa.outputs.staging-digest || '' }}
      staging-digest-arm64: ${{ matrix.platform == 'linux/arm64' && steps.copa.outputs.staging-digest || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Filter to only requested platforms
    # (uses the include list but skips platforms not in inputs.platforms)

    steps:
      - name: Check if this platform is requested
        id: platform-check
        run: |
          if echo "${{ inputs.platforms }}" | grep -q "${{ matrix.platform }}"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Harden the runner (Audit all outbound calls)
        if: steps.platform-check.outputs.enabled == 'true'
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.platform-check.outputs.enabled == 'true'
        id: checkout
        continue-on-error: true

      - name: Retry checkout on failure
        if: steps.platform-check.outputs.enabled == 'true' && steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mise
        if: steps.platform-check.outputs.enabled == 'true'
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Cache Go modules
        if: steps.platform-check.outputs.enabled == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Login to GHCR
        if: steps.platform-check.outputs.enabled == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup BuildKit
        if: steps.platform-check.outputs.enabled == 'true'
        run: |
          BUILDKIT_IMAGE="${{ needs.scan.outputs.staging-registry }}/buildkit:buildx-stable-1"
          docker buildx create \
            --name copa-builder \
            --driver docker-container \
            --driver-opt network=host \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --buildkitd-flags '--allow-insecure-entitlement network.host' \
            --use
          docker buildx inspect --bootstrap

      - name: Download scan artifacts
        if: steps.platform-check.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: .

      - name: Setup binaries
        if: steps.platform-check.outputs.enabled == 'true'
        uses: ./.github/actions/setup-binaries
        with:
          github-token: ${{ github.token }}

      - name: Patch image
        id: copa
        if: steps.platform-check.outputs.enabled == 'true'
        env:
          COPA_EXPERIMENTAL: "1"
          PLATFORM: ${{ matrix.platform }}
          SOURCE: ${{ inputs.source-ref }}
          IMAGE_NAME: ${{ inputs.image-name }}
          STAGING_REGISTRY: ${{ needs.scan.outputs.staging-registry }}
          GO_VCS_URL: ${{ inputs.go-vcs-url }}
        run: |
          mkdir -p reports
          cp pre.json "reports/$(echo "${SOURCE}" | sed 's/[\/:]/_/g').json"
          .github/scripts/patch-image.sh

      - name: Cache otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && env.HONEYCOMB_API_KEY != '' && steps.platform-check.outputs.enabled == 'true' }}
        id: cache-otel
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/bin/otel-cli
          key: otel-cli-v${{ env.OTEL_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && env.HONEYCOMB_API_KEY != '' && steps.platform-check.outputs.enabled == 'true' && steps.cache-otel.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
          esac
          curl -fsSL "https://github.com/equinix-labs/otel-cli/releases/download/v${OTEL_CLI_VERSION}/otel-cli_${OTEL_CLI_VERSION}_${OS}_${ARCH}.tar.gz" | tar -xz -C ~/.local/bin otel-cli
          chmod +x ~/.local/bin/otel-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Emit Honeycomb span (per-platform patch)
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && env.HONEYCOMB_API_KEY != '' && steps.platform-check.outputs.enabled == 'true' }}
        env:
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: x-honeycomb-team=${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_SERVICE_NAME: verity-ci
        run: |
          set -euo pipefail
          PKG_HASH=$(jq -c '[.Results[]?.Vulnerabilities[]?.PkgName] | sort | unique' pre.json 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "unknown")
          ~/.local/bin/otel-cli span \
            --name "patch-image.matrix" \
            --service verity-ci \
            --kind internal \
            --attrs "image=${{ inputs.image-name }},platform=${{ matrix.platform }},source_tag=${{ needs.scan.outputs.source-tag }},cve_before=${{ needs.scan.outputs.pre-vuln-count }},copa_exit=${{ steps.copa.outputs.exit-code }},copa_duration_seconds=${{ steps.copa.outputs.duration-seconds }},staging_digest=${{ steps.copa.outputs.staging-digest }},package_list_sha256=${PKG_HASH},deployment.environment=verity-prod"

  # ── Job 3: Finalize ───────────────────────────────────────────────
  finalize:
    name: "Finalize ${{ inputs.image-name }}"
    needs: [scan, patch]
    if: needs.scan.outputs.needs-patch == 'true' && needs.patch.result == 'success'
    runs-on: ubuntu-24.04
    # Serialize report writes for the same image+tag to prevent SHA-based TOCTOU
    # conflicts in push-reports.sh (GitHub Contents API requires the current SHA).
    concurrency:
      group: reports-${{ inputs.image-name }}-${{ needs.scan.outputs.source-tag }}
      cancel-in-progress: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            .github/scripts/push-reports.sh
          sparse-checkout-cone-mode: false

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: .

      - name: Create multi-arch manifest
        id: manifest
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          STAGING_REGISTRY: ${{ needs.scan.outputs.staging-registry }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          SAFE_IMAGE=$(echo "$IMAGE_NAME" | tr '/: ' '---')

          # Collect platform-specific staging images
          SOURCE_TAGS=""
          IFS=',' read -ra PLATS <<< "$PLATFORMS"
          for plat in "${PLATS[@]}"; do
            arch=$(echo "$plat" | cut -d/ -f2)
            tag="${STAGING_REGISTRY}:${SAFE_IMAGE}-${SOURCE_TAG}-${arch}"
            if crane digest "$tag" > /dev/null 2>&1; then
              SOURCE_TAGS="${SOURCE_TAGS} ${tag}"
            else
              echo "⚠️  Missing platform image: $tag"
              exit 1
            fi
          done

          # Always stage the manifest — non-PR runs promote to target
          # only after the compare step confirms
          # the vuln set changed. This prevents target registry writes on no-ops.
          MANIFEST_TAG="${STAGING_REGISTRY}:${SAFE_IMAGE}-${SOURCE_TAG}"

          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "${MANIFEST_TAG}" ${SOURCE_TAGS}
          echo "✓ Created manifest: ${MANIFEST_TAG}"
          echo "manifest-tag=${MANIFEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Post-scan new patched image
        id: postscan
        env:
          MANIFEST_TAG: ${{ steps.manifest.outputs.manifest-tag }}
        run: |
          trivy image \
            --vuln-type os,library \
            --format json \
            --quiet \
            "${MANIFEST_TAG}" > post.json
          NEW_VULNS=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' post.json)
          echo "Post-patch vulnerabilities: ${NEW_VULNS}"
          echo "vuln-count=${NEW_VULNS}" >> "$GITHUB_OUTPUT"

      - name: Compare with previous post-patch report
        id: compare
        run: |
          # Extract sorted vuln IDs from both reports for comparison
          NEW_IDS=$(jq -r '[.Results[]?.Vulnerabilities // [] | .[] | .VulnerabilityID] | sort | .[]' post.json | sha256sum)
          PREV_IDS=$(jq -r '[.Results[]?.Vulnerabilities // [] | .[] | .VulnerabilityID] | sort | .[]' prev-post.json 2>/dev/null | sha256sum || echo "")

          PREV_EXISTED="${{ needs.scan.outputs.prev-report-exists }}"

          if [ "$PREV_EXISTED" = "true" ] && [ "$NEW_IDS" = "$PREV_IDS" ]; then
            echo "Vuln set unchanged — discarding new image (no-op)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Vuln set changed (or first time) — publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push manifest to target registry
        id: push
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
          MANIFEST_TAG: ${{ steps.manifest.outputs.manifest-tag }}
        run: |
          FINAL_REPO="${TARGET_REGISTRY}/${IMAGE_NAME}"
          FINAL_TAG="${FINAL_REPO}:${SOURCE_TAG}"
          crane copy "${MANIFEST_TAG}" "${FINAL_TAG}"
          DIGEST=$(crane digest "${FINAL_TAG}")
          echo "✓ Pushed to target: ${FINAL_TAG} (${DIGEST})"
          echo "${FINAL_TAG}" > final-manifest.txt
          {
            echo "digest=${DIGEST}"
            echo "final-tag=${FINAL_TAG}"
            echo "final-repo=${FINAL_REPO}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "DIGEST=${DIGEST}"
            echo "FINAL_TAG=${FINAL_TAG}"
            echo "FINAL_REPO=${FINAL_REPO}"
          } >> "$GITHUB_ENV"

      - name: Sign manifest with cosign
        id: cosign-sign
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        run: |
          set -o pipefail
          cosign sign --yes "${{ steps.push.outputs.final-repo }}@${{ steps.push.outputs.digest }}" 2>&1 | tee /tmp/cosign-out
          REKOR_URL=$(grep -oE 'https://rekor[^ ]+' /tmp/cosign-out | tail -n 1 || true)
          if [ -n "${REKOR_URL}" ]; then
            echo "rekor-url=${REKOR_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOM
        id: sbom
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        run: |
          syft "${{ steps.push.outputs.final-tag }}@${{ steps.push.outputs.digest }}" -o cyclonedx-json=sbom.json

      - name: Attest SBOM
        id: attest
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.final-repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom.json
          push-to-registry: true

      - name: Cache otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && env.HONEYCOMB_API_KEY != '' }}
        id: cache-otel-finalize
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/bin/otel-cli
          key: otel-cli-v${{ env.OTEL_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install otel-cli
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && env.HONEYCOMB_API_KEY != '' && steps.cache-otel-finalize.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
          esac
          curl -fsSL "https://github.com/equinix-labs/otel-cli/releases/download/v${OTEL_CLI_VERSION}/otel-cli_${OTEL_CLI_VERSION}_${OS}_${ARCH}.tar.gz" | tar -xz -C ~/.local/bin otel-cli
          chmod +x ~/.local/bin/otel-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Emit Honeycomb span (per-image finalize)
        if: ${{ !cancelled() && vars.HONEYCOMB_ENABLED == 'true' && env.HONEYCOMB_API_KEY != '' }}
        env:
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: x-honeycomb-team=${{ secrets.HONEYCOMB_API_KEY }}
          OTEL_SERVICE_NAME: verity-ci
        run: |
          set -euo pipefail
          ~/.local/bin/otel-cli span \
            --name "patch-image.finalize" \
            --service verity-ci \
            --kind internal \
            --attrs "image=${{ inputs.image-name }},source_tag=${{ needs.scan.outputs.source-tag }},manifest_digest=${{ steps.push.outputs.digest }},final_tag=${{ steps.push.outputs.final-tag }},final_repo=${{ steps.push.outputs.final-repo }},post_scan_vuln_count=${{ steps.postscan.outputs.vuln-count }},rekor_url=${{ steps.cosign-sign.outputs.rekor-url }},attestation_id=${{ steps.attest.outputs.attestation-id }},attestation_bundle_path=${{ steps.attest.outputs.bundle-path }},deployment.environment=verity-prod"

      - name: Push reports to reports branch
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/push-reports.sh \
            "reports/${IMAGE_NAME}/${SOURCE_TAG}/pre.json" pre.json \
            "reports/${IMAGE_NAME}/${SOURCE_TAG}/post.json" post.json

      - name: Update preflight manifest
        if: steps.compare.outputs.changed == 'true' && inputs.is-pr == false
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          SOURCE_REF: ${{ inputs.source-ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_DIGEST=$(crane digest "${SOURCE_REF}" 2>/dev/null || echo "")
          VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' post.json 2>/dev/null || echo "0")
          MANIFEST_FILE="reports/preflight-manifest.json"
          BRANCH="reports"
          REPO="${{ github.repository }}"
          KEY="${IMAGE_NAME}/${SOURCE_TAG}"
          MAX_RETRIES=5

          MANIFEST_UPDATED=false
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if gh api "repos/${REPO}/contents/${MANIFEST_FILE}?ref=${BRANCH}" > /tmp/manifest_resp.json 2>&1; then
              SHA=$(jq -r '.sha' /tmp/manifest_resp.json)
              CONTENT=$(jq -r '.content' /tmp/manifest_resp.json | base64 -d)
            elif grep -q '"Not Found"' /tmp/manifest_resp.json 2>/dev/null; then
              SHA=""
              CONTENT="{}"
            else
              echo "Warning: unexpected API response fetching manifest (attempt ${attempt}/${MAX_RETRIES})"
              cat /tmp/manifest_resp.json >&2
              sleep 2
              continue
            fi

            UPDATED=$(echo "$CONTENT" | jq \
              --arg key "$KEY" \
              --arg digest "$UPSTREAM_DIGEST" \
              --argjson vulns "$VULN_COUNT" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.[$key] = {upstream_digest: $digest, patched_vulns: $vulns, last_patched: $ts}')

            ENCODED=$(echo "$UPDATED" | base64 | tr -d '\n')
            ARGS=(--method PUT "repos/${REPO}/contents/${MANIFEST_FILE}"
              --field "message=chore: update preflight manifest for ${KEY}"
              --field "content=${ENCODED}"
              --field "branch=${BRANCH}")
            [ -n "$SHA" ] && ARGS+=(--field "sha=${SHA}")

            if gh api "${ARGS[@]}" --silent; then
              MANIFEST_UPDATED=true
              break
            fi

            echo "Warning: manifest update attempt ${attempt}/${MAX_RETRIES} failed (SHA conflict), retrying..."
            sleep 2
          done
          if [ "$MANIFEST_UPDATED" != "true" ]; then
            echo "::warning::Preflight manifest update failed after ${MAX_RETRIES} attempts"
          fi

      - name: Upload PR scan artifacts
        if: inputs.is-pr == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-patch-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}${{ inputs.artifact-suffix }}
          path: |
            pre.json
            post.json
          retention-days: 7

      - name: Build consolidated metrics JSON
        if: ${{ !cancelled() }}
        id: metrics-json
        env:
          SAFE_NAME: ${{ needs.scan.outputs.safe-name }}
          SOURCE_TAG: ${{ needs.scan.outputs.source-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="metrics-${SAFE_NAME}-${SOURCE_TAG}.json"
          STARTED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.run_started_at' 2>/dev/null || true)

          SEVERITIES_BEFORE=$(jq -c '
            {CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, UNKNOWN: 0} +
            ([.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) |
              map({key: .[0], value: length}) | from_entries)
          ' pre.json 2>/dev/null || echo '{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"UNKNOWN":0}')
          SEVERITIES_AFTER=$(jq -c '
            {CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, UNKNOWN: 0} +
            ([.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) |
              map({key: .[0], value: length}) | from_entries)
          ' post.json 2>/dev/null || echo '{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"UNKNOWN":0}')
          VULN_BEFORE=${{ needs.scan.outputs.pre-vuln-count }}
          VULN_AFTER=${{ steps.postscan.outputs.vuln-count }}
          SBOM_DIGEST=$(sha256sum sbom.json 2>/dev/null | cut -d' ' -f1 || true)

          jq -n \
            --arg schema_version "v1" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg started_at "${STARTED_AT}" \
            --arg ended_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg conclusion "${{ needs.patch.result }}" \
            --arg image_name "${{ inputs.image-name }}" \
            --arg source_tag "${SOURCE_TAG}" \
            --arg target_ref "${{ steps.push.outputs.final-tag }}" \
            --arg manifest_digest "${{ steps.push.outputs.digest }}" \
            --argjson vuln_before "${VULN_BEFORE:-0}" \
            --argjson vuln_after "${VULN_AFTER:-0}" \
            --argjson sev_before "$SEVERITIES_BEFORE" \
            --argjson sev_after "$SEVERITIES_AFTER" \
            --arg t_amd64 "${{ needs.patch.outputs.timing-amd64 }}" \
            --arg t_arm64 "${{ needs.patch.outputs.timing-arm64 }}" \
            --arg e_amd64 "${{ needs.patch.outputs.copa-exit-amd64 }}" \
            --arg e_arm64 "${{ needs.patch.outputs.copa-exit-arm64 }}" \
            --arg d_amd64 "${{ needs.patch.outputs.staging-digest-amd64 }}" \
            --arg d_arm64 "${{ needs.patch.outputs.staging-digest-arm64 }}" \
            --arg rekor_url "${{ steps.cosign-sign.outputs.rekor-url }}" \
            --arg attestation_id "${{ steps.attest.outputs.attestation-id }}" \
            --arg sbom_digest "${SBOM_DIGEST}" \
            --arg attestation_bundle_path "${{ steps.attest.outputs.bundle-path }}" \
            '{
              schema_version: $schema_version,
              run: {
                id: ($run_id | tonumber),
                attempt: ($run_attempt | tonumber),
                started_at: $started_at,
                ended_at: $ended_at,
                conclusion: $conclusion
              },
              image: {
                name: $image_name,
                source_tag: $source_tag,
                target_ref: (if $target_ref == "" then null else $target_ref end),
                manifest_digest: (if $manifest_digest == "" then null else $manifest_digest end)
              },
              scan: {
                before: { vuln_count: $vuln_before, by_severity: $sev_before },
                after: { vuln_count: $vuln_after, by_severity: $sev_after }
              },
              platforms: {
                amd64: (if $t_amd64 == "" then null else {
                  copa_duration_seconds: ($t_amd64 | tonumber? // null),
                  copa_exit_code: ($e_amd64 | tonumber? // null),
                  staging_digest: (if $d_amd64 == "" then null else $d_amd64 end)
                } end),
                arm64: (if $t_arm64 == "" then null else {
                  copa_duration_seconds: ($t_arm64 | tonumber? // null),
                  copa_exit_code: ($e_arm64 | tonumber? // null),
                  staging_digest: (if $d_arm64 == "" then null else $d_arm64 end)
                } end)
              },
              supply_chain: {
                rekor_url: (if $rekor_url == "" then null else $rekor_url end),
                attestation_id: (if $attestation_id == "" then null else $attestation_id end),
                sbom_digest: (if $sbom_digest == "" then null else ("sha256:" + $sbom_digest) end),
                attestation_bundle_path: (if $attestation_bundle_path == "" then null else $attestation_bundle_path end)
              }
            }' > "$OUT"

          cat "$OUT"
          echo "filename=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload metrics artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: 5
        with:
          name: metrics-${{ needs.scan.outputs.safe-name }}-${{ needs.scan.outputs.source-tag }}
          path: ${{ steps.metrics-json.outputs.filename }}
          retention-days: 1
          if-no-files-found: warn
