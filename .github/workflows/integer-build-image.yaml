name: Integer Build Image
run-name: "Build ${{ inputs.image }}:${{ inputs.version }}-${{ inputs.type }}"

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image name (e.g., node)"
        required: true
      version:
        description: "Version (e.g., 22)"
        required: true
      type:
        description: "Type (e.g., default, dev, fips)"
        required: true
        default: "default"
      tags:
        description: "Comma-separated tags to publish (e.g., 22,latest)"
        required: true
      registry:
        description: "Target registry"
        required: true
        default: "ghcr.io/verity-org"

permissions:
  contents: write          # push-reports.sh writes to reports branch via GitHub API
  packages: write          # push to GHCR
  id-token: write          # keyless cosign signing
  attestations: write      # actions/attest SBOM

jobs:
  # ── Melange prep (conditional) ──────────────────────────────────────────
  # Lightweight job: checks if this image/type needs a melange build,
  # resolves the melange YAML source, and generates an ephemeral signing
  # key.  Artifacts are consumed by the melange-build matrix and the
  # build job.  Skips all work when the image definition has no melange:
  # block.

  melange-prep:
    name: "Melange prep"
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      bespoke_json: ${{ steps.check.outputs.bespoke_json }}
      env_file: ${{ steps.check.outputs.env_file }}
      build_option: ${{ steps.check.outputs.build_option }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Validate inputs
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          check() {
            local label="$1" value="$2" pattern="$3"
            if [[ ! "$value" =~ $pattern ]]; then
              echo "Invalid ${label}: ${value}" >&2
              exit 1
            fi
          }
          check image "$INPUT_IMAGE" '^[a-z][a-z0-9-]*(/[a-z][a-z0-9-]*)*$'
          check type  "$INPUT_TYPE"  '^[a-z][a-z0-9-]*$'

      - name: Check if melange build needed
        id: check
        env:
          IMAGE: ${{ inputs.image }}
          TYPE: ${{ inputs.type }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/melange-check.sh

      - name: Resolve melange YAML source
        if: steps.check.outputs.needed == 'true'
        env:
          UPSTREAM: ${{ steps.check.outputs.upstream }}
          BESPOKE_JSON: ${{ steps.check.outputs.bespoke_json }}
        run: |
          mkdir -p melange-work/specs

          commit=$(jq -r '.wolfi_commit' packages/upstream.lock.json)
          if [ "$commit" = "null" ] || [ -z "$commit" ]; then
            echo "wolfi_commit missing or null in packages/upstream.lock.json" >&2
            exit 1
          fi

          if [ "$BESPOKE_JSON" != '[]' ]; then
            while IFS= read -r bespoke; do
              spec_dir="melange-work/specs/${bespoke}"
              rm -rf "$spec_dir"
              mkdir -p "$spec_dir"
              cp "packages/bespoke/${bespoke}" "$spec_dir/build.yaml"
            done < <(printf '%s' "$BESPOKE_JSON" | jq -r '.[]')
          elif [ -n "$UPSTREAM" ]; then
            file=$(jq -r --arg pkg "$UPSTREAM" '.packages[$pkg].file' packages/upstream.lock.json)
            expected_sha=$(jq -r --arg pkg "$UPSTREAM" '.packages[$pkg].sha256' packages/upstream.lock.json)
            if [ "$file" = "null" ] || [ -z "$file" ]; then
              echo "Package '${UPSTREAM}' not found in upstream.lock.json" >&2
              exit 1
            fi
            if [ "$expected_sha" = "null" ] || [ -z "$expected_sha" ]; then
              echo "No sha256 for '${UPSTREAM}' in upstream.lock.json" >&2
              exit 1
            fi
            url="https://raw.githubusercontent.com/wolfi-dev/os/${commit}/${file}"
            echo "Fetching upstream melange YAML: ${url}"
            spec_dir="melange-work/specs/${UPSTREAM}"
            rm -rf "$spec_dir"
            mkdir -p "$spec_dir"
            curl -fsSL "$url" -o "$spec_dir/build.yaml.tmp"
            actual_sha=$(sha256sum "$spec_dir/build.yaml.tmp" | awk '{print $1}')
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "sha256 mismatch for ${UPSTREAM}: expected ${expected_sha}, got ${actual_sha}" >&2
              rm -f "$spec_dir/build.yaml.tmp"
              exit 1
            fi
            mv "$spec_dir/build.yaml.tmp" "$spec_dir/build.yaml"
          fi

          echo "Fetching wolfi pipelines/ at commit ${commit}"
          tmp_wolfi=$(mktemp -d)
          trap 'rm -rf "$tmp_wolfi"' EXIT
          git -C "$tmp_wolfi" init --quiet
          git -C "$tmp_wolfi" remote add origin "https://github.com/wolfi-dev/os.git"

          sparse_paths=(pipelines)
          if [ -n "$UPSTREAM" ]; then
            if [[ ! "$UPSTREAM" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "upstream value contains unsafe characters: '${UPSTREAM}'" >&2
              exit 1
            fi
            sparse_paths+=("${UPSTREAM}")
          fi

          git -C "$tmp_wolfi" sparse-checkout set --no-cone "${sparse_paths[@]}"
          git -C "$tmp_wolfi" fetch --quiet --depth 1 --filter=blob:none origin "$commit"
          if [ -n "$UPSTREAM" ]; then
            git -C "$tmp_wolfi" checkout --quiet FETCH_HEAD -- pipelines "${UPSTREAM}" 2>/dev/null || \
              git -C "$tmp_wolfi" checkout --quiet FETCH_HEAD -- pipelines
          else
            git -C "$tmp_wolfi" checkout --quiet FETCH_HEAD -- pipelines
          fi
          rm -rf melange-work/pipelines
          cp -r "$tmp_wolfi/pipelines" melange-work/pipelines
          if [ -n "$UPSTREAM" ]; then
            if [ -d "$tmp_wolfi/${UPSTREAM}" ]; then
              cp -r "$tmp_wolfi/${UPSTREAM}/." "$spec_dir/"
            fi
          fi

      - name: Generate ephemeral melange signing key
        if: steps.check.outputs.needed == 'true'
        run: |
          melange keygen melange-work/melange.rsa

      - name: Upload melange work artifacts
        if: steps.check.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: melange-work
          path: |
            melange-work/
            packages/overrides/
          retention-days: 1

  # ── Melange build (native arch matrix) ──────────────────────────────────
  # Builds single-arch APKs on native runners (no QEMU).  Each arch
  # uploads its packages/ tree (which contains an arch-specific subdir
  # like x86_64/ or aarch64/) as a separate artifact.

  melange-build:
    name: "Melange build (${{ matrix.arch }})"
    needs: [melange-prep]
    if: needs.melange-prep.outputs.needed == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Download melange work artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-work
          path: .

      - name: Build melange package (${{ matrix.arch }})
        env:
          ENV_FILE: ${{ needs.melange-prep.outputs.env_file }}
          BUILD_OPTION: ${{ needs.melange-prep.outputs.build_option }}
        run: |
          chmod 600 melange-work/melange.rsa

          shopt -s nullglob
          builds=(melange-work/specs/*/build.yaml)
          if [ ${#builds[@]} -eq 0 ]; then
            echo "No melange build YAMLs staged in melange-work/specs" >&2
            exit 1
          fi

          for build_yaml in "${builds[@]}"; do
            MELANGE_ARGS=(
              build "$build_yaml"
              --arch "${{ matrix.arch }}"
              --signing-key melange-work/melange.rsa
              --out-dir packages/repo
              --repository-append https://packages.wolfi.dev/os
              --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
              --runner docker
            )

            if [ -d melange-work/pipelines ]; then
              MELANGE_ARGS+=(--pipeline-dirs melange-work/pipelines)
            fi

            if [ -n "$ENV_FILE" ]; then
              MELANGE_ARGS+=(--env-file "packages/overrides/${ENV_FILE}")
            fi
            if [ -n "$BUILD_OPTION" ]; then
              MELANGE_ARGS+=(--build-option "$BUILD_OPTION")
            fi

            echo "Running: melange ${MELANGE_ARGS[*]}"
            melange "${MELANGE_ARGS[@]}"
          done

          echo "Built packages:"
          find packages/repo -type f -name '*.apk'

      - name: Upload arch packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: melange-packages-${{ matrix.arch }}
          path: packages/repo/
          retention-days: 1

  # ── Build & publish ─────────────────────────────────────────────────────

  build:
    name: "Build ${{ inputs.image }}:${{ inputs.version }}-${{ inputs.type }}"
    needs: [melange-prep, melange-build]
    # Always run: melange-build is skipped for non-melange images, which
    # sets its result to 'skipped' — that's fine, not a failure.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      # ── Setup ──────────────────────────────────────────────────────────────

      - name: Validate inputs
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          # Guard against shell injection via workflow_dispatch inputs.
          # Inputs are passed through env vars (not interpolated into the script)
          # and validated against their expected character sets before any use.
          check() {
            local label="$1" value="$2" pattern="$3"
            if [[ ! "$value" =~ $pattern ]]; then
              echo "Invalid ${label}: ${value}" >&2
              exit 1
            fi
          }
          check image    "$INPUT_IMAGE"    '^[a-z][a-z0-9-]*(/[a-z][a-z0-9-]*)*$'
          check version  "$INPUT_VERSION"  '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
          check type     "$INPUT_TYPE"     '^[a-z][a-z0-9-]*$'
          check tags     "$INPUT_TAGS"     '^[a-zA-Z0-9.,_-]+$'
          check registry "$INPUT_REGISTRY" '^[a-zA-Z0-9./:_-]+$'

      - name: Log in to GHCR
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/retry-docker-login.sh

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Generate apko configs
        id: gen
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          # Generate all apko configs into ./gen/ with absolute include: paths
          # so apko can resolve them from any working directory.
          ./verity integer discover --gen-dir ./gen

          config="gen/${INPUT_IMAGE}/${INPUT_VERSION}/${INPUT_TYPE}.apko.yaml"
          if [ ! -f "$config" ]; then
            echo "Config not found: $config (image/version/type combination may not exist)" >&2
            exit 1
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

          # Build space-separated image refs for all tags.
          refs=""
          IFS=',' read -ra TAGS <<< "$INPUT_TAGS"
          for tag in "${TAGS[@]}"; do
            tag="${tag// /}"
            ref="${INPUT_REGISTRY}/${INPUT_IMAGE}:${tag}"
            refs="${refs:+$refs }$ref"
          done
          {
            echo "refs=$refs"
            echo "primary_tag=${TAGS[0]// /}"
            # Artifact names reject '/', so flatten slashed image names.
            echo "safe_image=${INPUT_IMAGE//\//-}"
          } >> "$GITHUB_OUTPUT"

      - name: Read image metadata
        id: meta
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          image_yaml="images/${INPUT_IMAGE}.yaml"
          title=$(yq '.name' "$image_yaml")
          description=$(yq '.description' "$image_yaml")
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"

      # ── Melange artifact merge ──────────────────────────────────────────

      - name: Download melange packages (x86_64)
        if: needs.melange-prep.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-packages-x86_64
          path: packages/repo

      - name: Download melange packages (aarch64)
        if: needs.melange-prep.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-packages-aarch64
          path: packages/repo

      - name: Download melange signing key
        if: needs.melange-prep.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-work
          path: .

      - name: Verify melange package merge
        if: needs.melange-prep.outputs.needed == 'true'
        run: |
          echo "Merged melange repository contents:"
          find packages/repo -type f | sort
          # Verify both arch subdirs are present
          if [ ! -d packages/repo/x86_64 ]; then
            echo "ERROR: x86_64 packages not found" >&2
            exit 1
          fi
          if [ ! -d packages/repo/aarch64 ]; then
            echo "ERROR: aarch64 packages not found" >&2
            exit 1
          fi

      # ── Build ──────────────────────────────────────────────────────────────

      # ── Zero-CVE preflight gate: build locally & scan BEFORE any registry write
      - name: Trivy publish gate (not clean, no go)
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          # The verity binary owns this gate (cmd/integer_build.go
          # integerTrivyGate) — it is unit-tested and cannot silently regress,
          # unlike inline workflow bash. Build the image LOCALLY and Trivy-scan
          # it here; if any CVEs are found this step FAILS before staging or
          # final promotion. Verity never uploads an Integer image with a CVE.
          # Gate BOTH published arches (publish pushes amd64+arm64). apko build
          # and trivy scan assemble/read packages without executing arch
          # binaries, so no QEMU is needed.
          for gate_arch in amd64 arm64; do
            echo "::group::Trivy publish gate ($gate_arch)"
            ./verity integer build \
              --image "$INPUT_IMAGE" \
              --version "$INPUT_VERSION" \
              --type "$INPUT_TYPE" \
              --arch "$gate_arch" \
              --fail-on-severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --output "gate-$gate_arch.tar"
            echo "::endgroup::"
          done

      - name: Build, verify, and publish multi-arch image
        id: build
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          PRIMARY_TAG: ${{ steps.gen.outputs.primary_tag }}
          REFS: ${{ steps.gen.outputs.refs }}
          OCI_TITLE: ${{ steps.meta.outputs.title }}
          OCI_DESCRIPTION: ${{ steps.meta.outputs.description }}
          CONFIG_PATH: ${{ steps.gen.outputs.path }}
          MELANGE_NEEDED: ${{ needs.melange-prep.outputs.needed }}
        run: |
          # Inject dynamic OCI annotations into a temp copy of the generated config.
          # The generated config uses absolute include: paths so apko can resolve
          # them without needing to cd into the config directory.
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export BUILD_TIMESTAMP
          tmpconfig=$(mktemp --suffix=.apko.yaml)
          trap 'rm -f "$tmpconfig"' EXIT
          cp "$CONFIG_PATH" "$tmpconfig"
          yq -i '
            .annotations["org.opencontainers.image.title"]       = strenv(OCI_TITLE) |
            .annotations["org.opencontainers.image.description"] = strenv(OCI_DESCRIPTION) |
            .annotations["org.opencontainers.image.version"]     = strenv(INPUT_VERSION) |
            .annotations["org.opencontainers.image.revision"]    = strenv(GITHUB_SHA) |
            .annotations["org.opencontainers.image.created"]     = strenv(BUILD_TIMESTAMP)
          ' "$tmpconfig"

          # Split final refs into an array for safe expansion (one arg per ref).
          read -ra FINAL_REFS <<< "$REFS"

          # Stage one run-scoped ref first. This lets Trivy scan the exact
          # multi-arch image apko produced before any final user-facing tag is
          # written, closing the rebuild drift gap between local tar scans and
          # apko publish.
          STAGING_REF="${INPUT_REGISTRY}/cache/${INPUT_IMAGE}:${PRIMARY_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Build apko args — conditionally append local melange repo.
          APKO_ARGS=(
            publish
            --arch "amd64,arm64"
            --sbom-path "$GITHUB_WORKSPACE"
          )

          if [ "$MELANGE_NEEDED" = "true" ]; then
            # NOTE: the local melange repo is appended UNTAGGED (no "@local "
            # prefix). apko/apk-tools only consult tagged repositories when a
            # package is explicitly pinned with the same tag (e.g. "popeye@local").
            # Our apko configs reference packages by bare name (e.g. "popeye"),
            # so a tagged @local repo would be silently ignored — which broke
            # bespoke-only packages that don't exist in upstream Wolfi
            # (popeye, kubectx, kubeconform, kube-score, kube-linter; see #297
            # follow-up). Untagged here means apk-tools picks the highest
            # version across all repos, which naturally prefers our bespoke
            # build (epoch-bumped) over any upstream Wolfi copy.
            APKO_ARGS+=(
              --repository-append "${GITHUB_WORKSPACE}/packages/repo"
              --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub"
            )
            echo "Appending local melange repo to apko publish"
          fi

          APKO_ARGS+=("$tmpconfig" "$STAGING_REF")

          bash .github/scripts/retry-registry-command.sh \
            "apko publish" \
            apko "${APKO_ARGS[@]}"

          trivy image \
            --exit-code 1 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --vuln-type os,library \
            --format json \
            --output trivy-report.json \
            "$STAGING_REF"

          for final_ref in "${FINAL_REFS[@]}"; do
            bash .github/scripts/retry-registry-command.sh \
              "crane copy" \
              crane copy "$STAGING_REF" "$final_ref"
          done

          # Capture the digest of the clean promoted index for signing.
          digest=$(bash .github/scripts/retry-registry-command.sh \
            "crane digest" \
            crane digest "${INPUT_REGISTRY}/${INPUT_IMAGE}:${PRIMARY_TAG}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ── Security scan ──────────────────────────────────────────────────────

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-${{ steps.gen.outputs.safe_image }}-${{ inputs.version }}-${{ inputs.type }}"
          path: trivy-report.json
          retention-days: 30

      # ── Sign & attest ──────────────────────────────────────────────────────

      - name: Sign image with cosign (keyless)
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign by digest — immutable reference that covers all tags pointing to this image.
          bash .github/scripts/retry-registry-command.sh \
            "cosign sign" \
            cosign sign --yes "${INPUT_REGISTRY}/${INPUT_IMAGE}@${DIGEST}"

      - name: Attest SBOM
        if: hashFiles('sbom-amd64.spdx.json') != ''
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom-amd64.spdx.json
          push-to-registry: true

      # ── Report ─────────────────────────────────────────────────────────────

      - name: Push build report to reports branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          status="success"
          if [ "$JOB_STATUS" != "success" ]; then
            status="failure"
          fi

          report=$(jq -n \
            --arg image    "$INPUT_IMAGE" \
            --arg version  "$INPUT_VERSION" \
            --arg type     "$INPUT_TYPE" \
            --arg tags     "$INPUT_TAGS" \
            --arg registry "$INPUT_REGISTRY" \
            --arg digest   "$DIGEST" \
            --arg status   "$status" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id   "$RUN_ID" \
            '{image: $image, version: $version, type: $type, tags: ($tags | split(",")),
              registry: $registry, digest: $digest, status: $status,
              built_at: $built_at, run_id: $run_id}')

          echo "$report" > report.json
          bash .github/scripts/push-reports.sh \
            "reports/${INPUT_IMAGE}/${INPUT_VERSION}/${INPUT_TYPE}/latest.json" \
            report.json

      - name: Update preflight manifest
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          MANIFEST_FILE="reports/preflight-manifest.json"
          BRANCH="reports"
          REPO="${{ github.repository }}"
          KEY="${INPUT_IMAGE}/${INPUT_VERSION}-${INPUT_TYPE}"
          MAX_RETRIES=5

          MANIFEST_UPDATED=false
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if gh api "repos/${REPO}/contents/${MANIFEST_FILE}?ref=${BRANCH}" > /tmp/manifest_resp.json 2>&1; then
              SHA=$(jq -r '.sha' /tmp/manifest_resp.json)
              CONTENT=$(jq -r '.content' /tmp/manifest_resp.json | base64 -d)
            elif grep -q '"Not Found"' /tmp/manifest_resp.json 2>/dev/null; then
              SHA=""
              CONTENT="{}"
            else
              echo "Warning: unexpected API response fetching manifest (attempt ${attempt}/${MAX_RETRIES})"
              cat /tmp/manifest_resp.json >&2
              sleep 2
              continue
            fi

            UPDATED=$(echo "$CONTENT" | jq \
              --arg key "$KEY" \
              --arg digest "$DIGEST" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.[$key] = {upstream_digest: $digest, patched_vulns: 0, last_patched: $ts}')

            ENCODED=$(echo "$UPDATED" | base64 | tr -d '\n')
            ARGS=(--method PUT "repos/${REPO}/contents/${MANIFEST_FILE}"
              --field "message=chore: update preflight manifest for ${KEY}"
              --field "content=${ENCODED}"
              --field "branch=${BRANCH}")
            [ -n "$SHA" ] && ARGS+=(--field "sha=${SHA}")

            if gh api "${ARGS[@]}" --silent; then
              MANIFEST_UPDATED=true
              break
            fi

            echo "Warning: manifest update attempt ${attempt}/${MAX_RETRIES} failed (SHA conflict), retrying..."
            sleep 2
          done
          if [ "$MANIFEST_UPDATED" != "true" ]; then
            echo "::warning::Preflight manifest update failed after ${MAX_RETRIES} attempts"
          fi
