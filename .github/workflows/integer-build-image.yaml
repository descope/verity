name: Integer Build Image
run-name: "Build ${{ inputs.image }}:${{ inputs.version }}-${{ inputs.type }}"

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      version:
        required: true
        type: string
      type:
        required: true
        type: string
      tags:
        required: true
        type: string
      registry:
        required: true
        type: string
      batch_id:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: "Image name (e.g., node)"
        required: true
      version:
        description: "Version (e.g., 22)"
        required: true
      type:
        description: "Type (e.g., default, dev, fips)"
        required: true
        default: "default"
      tags:
        description: "Comma-separated tags to publish (e.g., 22,latest)"
        required: true
      registry:
        description: "Target registry"
        required: true
        default: "ghcr.io/verity-org"
      batch_id:
        description: "Parent nightly run freshness identifier (empty = this run)"
        required: false
        default: ""

permissions:
  contents: write          # push-reports.sh writes to reports branch via GitHub API
  packages: write          # push to GHCR
  id-token: write          # keyless cosign signing
  attestations: write      # actions/attest SBOM

jobs:
  # ── Melange prep (conditional) ──────────────────────────────────────────
  # Lightweight job: checks if this image/type needs a melange build,
  # resolves the melange YAML source, and generates an ephemeral signing
  # key.  Artifacts are consumed by the melange-build matrix and the
  # build job.  Skips all work when the image definition has no melange:
  # block.

  melange-prep:
    name: "Melange prep"
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Build verity CLI
        run: go build -o verity .

      - name: Prepare bespoke package
        id: check
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          ./verity integer melange prepare \
            --image "$INPUT_IMAGE" \
            --version "$INPUT_VERSION" \
            --type "$INPUT_TYPE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload melange work artifacts
        if: steps.check.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: melange-work
          path: |
            melange-work/
            packages/overrides/
          retention-days: 1

  # ── Melange build (native arch matrix) ──────────────────────────────────
  # Builds single-arch APKs on native runners (no QEMU).  Each arch
  # uploads its packages/ tree (which contains an arch-specific subdir
  # like x86_64/ or aarch64/) as a separate artifact.

  melange-build:
    name: "Melange build (${{ matrix.arch }})"
    needs: [melange-prep]
    if: needs.melange-prep.outputs.needed == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Build verity CLI
        run: go build -o verity .

      - name: Download melange work artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-work
          path: .

      - name: Build melange package (${{ matrix.arch }})
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          ./verity integer melange build \
            --image "$INPUT_IMAGE" \
            --version "$INPUT_VERSION" \
            --type "$INPUT_TYPE" \
            --arch "$BUILD_ARCH" \
            --staged

      - name: Test Trivy package natively (${{ matrix.arch }})
        if: inputs.image == 'trivy'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          melange test \
            --arch "$BUILD_ARCH" \
            --repository-append "${GITHUB_WORKSPACE}/packages/repo" \
            --repository-append https://packages.wolfi.dev/os \
            --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub" \
            --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
            --runner docker \
            melange-work/specs/trivy.yaml/build.yaml \
            trivy

      - name: Test rclone package natively (${{ matrix.arch }})
        if: inputs.image == 'rclone'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/test-rclone-package.sh "$BUILD_ARCH"

      - name: Test rclone image natively (${{ matrix.arch }})
        if: inputs.image == 'rclone'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          case "$BUILD_ARCH" in
            x86_64) IMAGE_ARCH=amd64 ;;
            aarch64) IMAGE_ARCH=arm64 ;;
            *) echo "Unsupported rclone architecture: $BUILD_ARCH" >&2; exit 1 ;;
          esac

          rclone_version=$(yq -r '.package.version' \
            melange-work/specs/rclone.yaml/build.yaml)
          rclone_full_version=$(yq -r '.package.version + "-r" + (.package.epoch | tostring)' \
            melange-work/specs/rclone.yaml/build.yaml)

          image_tar="rclone-$IMAGE_ARCH.tar"
          image_ref="integer:local-$IMAGE_ARCH"
          container="integer-rclone-$IMAGE_ARCH-proof"
          smoke=$(mktemp -d)
          sbom="/tmp/rclone-$IMAGE_ARCH.spdx.json"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker image rm "$image_ref" >/dev/null 2>&1 || true
            rm -rf "$image_tar" "$smoke" "$sbom"
          }
          trap cleanup EXIT

          ./verity integer build \
            --image "$INPUT_IMAGE" \
            --version "$INPUT_VERSION" \
            --type "$INPUT_TYPE" \
            --arch "$IMAGE_ARCH" \
            --fail-on-severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output "$image_tar"

          docker load --input "$image_tar"
          docker run --rm "$image_ref" --version \
            | grep -E "^rclone v?${rclone_version}$"

          mkdir -p "$smoke/source" "$smoke/destination"
          chmod 0755 "$smoke" "$smoke/source"
          chmod 0777 "$smoke/destination"
          printf '%s\n' 'verity rclone image checksum smoke' \
            >"$smoke/source/payload.txt"
          (
            cd "$smoke/source"
            sha256sum payload.txt >../payload.sha256
          )
          docker run --rm --volume "$smoke:/work" "$image_ref" \
            copy /work/source /work/destination
          docker run --rm --volume "$smoke:/work" "$image_ref" \
            check --checksum /work/source /work/destination
          (
            cd "$smoke/destination"
            sha256sum --check ../payload.sha256
          )

          docker image inspect "$image_ref" \
            --format '{{.Architecture}} {{.Os}}' \
            | grep -Fx "$IMAGE_ARCH linux"
          docker create --name "$container" "$image_ref" --version >/dev/null
          docker cp \
            "$container:/var/lib/db/sbom/rclone-${rclone_full_version}.spdx.json" \
            "$sbom"
          jq -e --arg full_version "$rclone_full_version" '
            .spdxVersion == "SPDX-2.3"
            and any(
              .packages[];
              .name == "rclone"
              and .versionInfo == $full_version
              and .licenseDeclared == "MIT"
            )
          ' "$sbom"

      - name: Test Weaviate package natively (${{ matrix.arch }})
        if: inputs.image == 'weaviate'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          melange test \
            --arch "$BUILD_ARCH" \
            --repository-append "${GITHUB_WORKSPACE}/packages/repo" \
            --repository-append https://packages.wolfi.dev/os \
            --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub" \
            --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
            --pipeline-dirs melange-work/pipelines \
            --runner docker \
            melange-work/specs/weaviate.yaml/build.yaml \
            weaviate

      - name: Test Weaviate image natively (${{ matrix.arch }})
        if: inputs.image == 'weaviate'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          case "$BUILD_ARCH" in
            x86_64) IMAGE_ARCH=amd64 ;;
            aarch64) IMAGE_ARCH=arm64 ;;
            *) echo "Unsupported Weaviate architecture: $BUILD_ARCH" >&2; exit 1 ;;
          esac

          image_tar="weaviate-$IMAGE_ARCH.tar"
          image_ref="integer:local-$IMAGE_ARCH"
          container="integer-weaviate-$IMAGE_ARCH-proof"
          sbom="/tmp/weaviate-$IMAGE_ARCH.spdx.json"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker image rm "$image_ref" >/dev/null 2>&1 || true
            rm -f "$image_tar" "$sbom"
          }
          trap cleanup EXIT

          ./verity integer build \
            --image "$INPUT_IMAGE" \
            --version "$INPUT_VERSION" \
            --type "$INPUT_TYPE" \
            --arch "$IMAGE_ARCH" \
            --fail-on-severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output "$image_tar"

          docker load --input "$image_tar"
          docker run --detach --rm --name "$container" \
            --publish 127.0.0.1::8080 \
            --env AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
            --env CLUSTER_HOSTNAME="$container" \
            --env DEFAULT_VECTORIZER_MODULE=none \
            --env DISABLE_TELEMETRY=true \
            --env PERSISTENCE_DATA_PATH=/var/lib/weaviate \
            "$image_ref" --host 0.0.0.0 --port 8080 --scheme http

          host_port=$(docker port "$container" 8080/tcp | awk -F: 'END {print $NF}')
          test -n "$host_port"
          ready=false
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$host_port/v1/.well-known/ready" >/dev/null; then
              ready=true
              break
            fi
            docker inspect --format '{{.State.Running}}' "$container" | grep -Fx true
            sleep 1
          done
          test "$ready" = true
          curl -fsS "http://127.0.0.1:$host_port/v1/meta" \
            | jq -e '.version == "1.38.4"'
          docker exec "$container" /usr/bin/weaviate --help >/dev/null
          docker image inspect "$image_ref" \
            --format '{{.Architecture}} {{.Os}} {{.Config.User}}' \
            | grep -Fx "$IMAGE_ARCH linux 65532"

          docker cp \
            "$container:/var/lib/db/sbom/weaviate-1.38.4-r1.spdx.json" \
            "$sbom"
          jq -e '
            .spdxVersion == "SPDX-2.3"
            and any(
              .packages[];
              .name == "weaviate"
              and .versionInfo == "1.38.4-r1"
              and .licenseDeclared == "BSD-3-Clause"
            )
          ' "$sbom"

      - name: Test Step CA package natively (${{ matrix.arch }})
        if: inputs.image == 'step-ca'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/test-step-ca-package.sh "$BUILD_ARCH"

      - name: Upload arch packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: melange-packages-${{ matrix.arch }}
          path: packages/repo/
          retention-days: 1

  # ── Build & publish ─────────────────────────────────────────────────────

  build:
    name: "Build ${{ inputs.image }}:${{ inputs.version }}-${{ inputs.type }}"
    needs: [melange-prep, melange-build]
    # Always run: melange-build is skipped for non-melange images, which
    # sets its result to 'skipped' — that's fine, not a failure.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      failure_stage: ${{ steps.report-context.outputs.failure_stage }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      # ── Setup ──────────────────────────────────────────────────────────────

      - name: Validate inputs
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          # Guard against shell injection via workflow_dispatch inputs.
          # Inputs are passed through env vars (not interpolated into the script)
          # and validated against their expected character sets before any use.
          check() {
            local label="$1" value="$2" pattern="$3"
            if [[ ! "$value" =~ $pattern ]]; then
              echo "Invalid ${label}: ${value}" >&2
              exit 1
            fi
          }
          check image    "$INPUT_IMAGE"    '^[a-z][a-z0-9-]*(/[a-z][a-z0-9-]*)*$'
          check version  "$INPUT_VERSION"  '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
          check type     "$INPUT_TYPE"     '^[a-z][a-z0-9-]*$'
          check tags     "$INPUT_TAGS"     '^[a-zA-Z0-9.,_-]+$'
          check registry "$INPUT_REGISTRY" '^[a-zA-Z0-9./:_-]+$'

      - name: Log in to GHCR
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/retry-docker-login.sh

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity CLI
        run: go build -o verity .

      - name: Generate apko configs
        id: gen
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          # Generate all apko configs into ./gen/ with absolute include: paths
          # so apko can resolve them from any working directory.
          ./verity integer discover --gen-dir ./gen

          config="gen/${INPUT_IMAGE}/${INPUT_VERSION}/${INPUT_TYPE}.apko.yaml"
          if [ ! -f "$config" ]; then
            echo "Config not found: $config (image/version/type combination may not exist)" >&2
            exit 1
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

          # Build space-separated image refs for all tags.
          refs=""
          IFS=',' read -ra TAGS <<< "$INPUT_TAGS"
          for tag in "${TAGS[@]}"; do
            tag="${tag// /}"
            ref="${INPUT_REGISTRY}/${INPUT_IMAGE}:${tag}"
            refs="${refs:+$refs }$ref"
          done
          {
            echo "refs=$refs"
            echo "primary_tag=${TAGS[0]// /}"
            # Artifact names reject '/', so flatten slashed image names.
            echo "safe_image=${INPUT_IMAGE//\//-}"
          } >> "$GITHUB_OUTPUT"

      - name: Read image metadata
        id: meta
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          ./verity integer metadata \
            --image "$INPUT_IMAGE" \
            --github-output "$GITHUB_OUTPUT"

      # ── Melange artifact merge ──────────────────────────────────────────

      - name: Download melange packages (x86_64)
        if: needs.melange-prep.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-packages-x86_64
          path: packages/repo

      - name: Download melange packages (aarch64)
        if: needs.melange-prep.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-packages-aarch64
          path: packages/repo

      - name: Download melange signing key
        if: needs.melange-prep.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: melange-work
          path: .

      - name: Verify melange package merge
        if: needs.melange-prep.outputs.needed == 'true'
        run: |
          echo "Merged melange repository contents:"
          find packages/repo -type f | sort
          # Verify both arch subdirs are present
          if [ ! -d packages/repo/x86_64 ]; then
            echo "ERROR: x86_64 packages not found" >&2
            exit 1
          fi
          if [ ! -d packages/repo/aarch64 ]; then
            echo "ERROR: aarch64 packages not found" >&2
            exit 1
          fi

      - name: Pin publish config to local package revisions
        id: pin
        if: needs.melange-prep.outputs.needed == 'true'
        env:
          CONFIG_PATH: ${{ steps.gen.outputs.path }}
        run: |
          ./verity integer melange pin-config \
            --config "$CONFIG_PATH" \
            --repository packages/repo \
            --arch x86_64 \
            --arch aarch64

      # ── Build ──────────────────────────────────────────────────────────────

      # ── Zero-CVE preflight gate: build locally & scan BEFORE any registry write
      - name: Trivy publish gate (not clean, no go)
        id: trivy-preflight
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          if [ "$INPUT_IMAGE" = "trivy" ]; then
            echo "Repository-pinned external scanner"
            trivy --version
          fi

          # The verity binary owns this gate (cmd/integer_build.go
          # integerTrivyGate) — it is unit-tested and cannot silently regress,
          # unlike inline workflow bash. Build the image LOCALLY and Trivy-scan
          # it here; if any CVEs are found this step FAILS before staging or
          # final promotion. Verity never uploads an Integer image with a CVE.
          # Gate BOTH published arches (publish pushes amd64+arm64). apko build
          # and trivy scan assemble/read packages without executing arch
          # binaries, so no QEMU is needed.
          for gate_arch in amd64 arm64; do
            echo "::group::Trivy publish gate ($gate_arch)"
            ./verity integer build \
              --image "$INPUT_IMAGE" \
              --version "$INPUT_VERSION" \
              --type "$INPUT_TYPE" \
              --arch "$gate_arch" \
              --fail-on-severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --output "gate-$gate_arch.tar"
            echo "::endgroup::"
          done

      - name: Build, verify, and publish multi-arch image
        id: build
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          PRIMARY_TAG: ${{ steps.gen.outputs.primary_tag }}
          REFS: ${{ steps.gen.outputs.refs }}
          OCI_TITLE: ${{ steps.meta.outputs.title }}
          OCI_DESCRIPTION: ${{ steps.meta.outputs.description }}
          CONFIG_PATH: ${{ steps.gen.outputs.path }}
          MELANGE_NEEDED: ${{ needs.melange-prep.outputs.needed }}
        run: |
          # Inject dynamic OCI annotations into a temp copy of the generated config.
          # The generated config uses absolute include: paths so apko can resolve
          # them without needing to cd into the config directory.
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export BUILD_TIMESTAMP
          tmpconfig=$(mktemp --suffix=.apko.yaml)
          trap 'rm -f "$tmpconfig"' EXIT
          cp "$CONFIG_PATH" "$tmpconfig"
          yq -i '
            .annotations["org.opencontainers.image.title"]       = strenv(OCI_TITLE) |
            .annotations["org.opencontainers.image.description"] = strenv(OCI_DESCRIPTION) |
            .annotations["org.opencontainers.image.version"]     = strenv(INPUT_VERSION) |
            .annotations["org.opencontainers.image.revision"]    = strenv(GITHUB_SHA) |
            .annotations["org.opencontainers.image.created"]     = strenv(BUILD_TIMESTAMP)
          ' "$tmpconfig"

          # Split final refs into an array for safe expansion (one arg per ref).
          read -ra FINAL_REFS <<< "$REFS"

          # Stage one run-scoped ref first. This lets Trivy scan the exact
          # multi-arch image apko produced before any final user-facing tag is
          # written, closing the rebuild drift gap between local tar scans and
          # apko publish.
          STAGING_REF="${INPUT_REGISTRY}/cache/${INPUT_IMAGE}:${PRIMARY_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Build apko args — conditionally append local melange repo.
          APKO_ARGS=(
            publish
            --arch "amd64,arm64"
            --sbom-path "$GITHUB_WORKSPACE"
          )

          if [ "$MELANGE_NEEDED" = "true" ]; then
            # pin-config rewrites every locally built package to
            # name=version@local after confirming both architecture indexes
            # agree, so apk-tools cannot substitute a remote package.
            APKO_ARGS+=(
              --repository-append "@local ${GITHUB_WORKSPACE}/packages/repo"
              --keyring-append "${GITHUB_WORKSPACE}/melange-work/melange.rsa.pub"
            )
            echo "Appending tagged local melange repo to apko publish"
          fi

          APKO_ARGS+=("$tmpconfig" "$STAGING_REF")

          bash .github/scripts/retry-registry-command.sh \
            "apko publish" \
            apko "${APKO_ARGS[@]}"

          trivy image \
            --exit-code 1 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --vuln-type os,library \
            --format json \
            --output trivy-report.json \
            "$STAGING_REF"

          for final_ref in "${FINAL_REFS[@]}"; do
            bash .github/scripts/retry-registry-command.sh \
              "crane copy" \
              crane copy "$STAGING_REF" "$final_ref"
          done

          # Capture the digest of the clean promoted index for signing.
          digest=$(bash .github/scripts/retry-registry-command.sh \
            "crane digest" \
            crane digest "${INPUT_REGISTRY}/${INPUT_IMAGE}:${PRIMARY_TAG}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ── Security scan ──────────────────────────────────────────────────────

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "trivy-${{ steps.gen.outputs.safe_image }}-${{ inputs.version }}-${{ inputs.type }}"
          path: trivy-report.json
          retention-days: 30

      # ── Sign & attest ──────────────────────────────────────────────────────

      - name: Sign image with cosign (keyless)
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign by digest — immutable reference that covers all tags pointing to this image.
          bash .github/scripts/retry-registry-command.sh \
            "cosign sign" \
            cosign sign --yes "${INPUT_REGISTRY}/${INPUT_IMAGE}@${DIGEST}"

      - name: Attest SBOM
        if: hashFiles('sbom-amd64.spdx.json') != ''
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom-amd64.spdx.json
          push-to-registry: true

      - name: Capture report context
        if: always()
        id: report-context
        env:
          PIN_OUTCOME: ${{ steps.pin.outcome }}
          TRIVY_PREFLIGHT_OUTCOME: ${{ steps.trivy-preflight.outcome }}
          PUBLISH_OUTCOME: ${{ steps.build.outcome }}
        run: |
          failure_stage=""
          if [ "$PIN_OUTCOME" = "failure" ]; then
            failure_stage="pin"
          elif [ "$TRIVY_PREFLIGHT_OUTCOME" = "failure" ]; then
            failure_stage="trivy"
          elif [ "$PUBLISH_OUTCOME" = "failure" ]; then
            failure_stage="publish"
          fi
          echo "failure_stage=$failure_stage" >> "$GITHUB_OUTPUT"

  # ── Report ─────────────────────────────────────────────────────────────
  # This independent terminal job runs even when prepare, either native
  # Melange build, pinning, or a Trivy gate fails before the build job can
  # reach its normal final step. It replaces latest.json for this exact batch
  # so the site cannot retain a previous successful result.
  report:
    name: "Report ${{ inputs.image }}:${{ inputs.version }}-${{ inputs.type }}"
    needs: [melange-prep, melange-build, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Push current build report to reports branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          DIGEST: ${{ needs.build.outputs.digest }}
          MELANGE_PREP_RESULT: ${{ needs.melange-prep.result }}
          MELANGE_BUILD_RESULT: ${{ needs.melange-build.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_FAILURE_STAGE: ${{ needs.build.outputs.failure_stage }}
          BATCH_ID: ${{ inputs.batch_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          status="success"
          failure_stage=""
          if [ "$MELANGE_PREP_RESULT" = "failure" ] || [ "$MELANGE_PREP_RESULT" = "cancelled" ]; then
            status="failure"
            failure_stage="melange-prep"
          elif [ "$MELANGE_BUILD_RESULT" = "failure" ] || [ "$MELANGE_BUILD_RESULT" = "cancelled" ]; then
            status="failure"
            failure_stage="melange-build"
          elif [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "cancelled" ]; then
            status="failure"
            failure_stage="${BUILD_FAILURE_STAGE:-build}"
          fi

          batch_id="${BATCH_ID:-${RUN_ID}-${RUN_ATTEMPT}}"
          report=$(jq -n \
            --arg image          "$INPUT_IMAGE" \
            --arg version        "$INPUT_VERSION" \
            --arg type           "$INPUT_TYPE" \
            --arg tags           "$INPUT_TAGS" \
            --arg registry       "$INPUT_REGISTRY" \
            --arg digest         "$DIGEST" \
            --arg status         "$status" \
            --arg failure_stage  "$failure_stage" \
            --arg built_at       "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id         "$RUN_ID" \
            --arg batch_id       "$batch_id" \
            '{image: $image, version: $version, type: $type, tags: ($tags | split(",")),
              registry: $registry, digest: $digest, status: $status,
              failure_stage: $failure_stage, built_at: $built_at, run_id: $run_id,
              batch_id: $batch_id}')

          echo "$report" > report.json
          bash .github/scripts/push-reports.sh \
            "reports/${INPUT_IMAGE}/${INPUT_VERSION}/${INPUT_TYPE}/latest.json" \
            report.json

      - name: Update preflight manifest
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.type }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          MANIFEST_FILE="reports/preflight-manifest.json"
          BRANCH="reports"
          REPO="${{ github.repository }}"
          KEY="${INPUT_IMAGE}/${INPUT_VERSION}-${INPUT_TYPE}"
          MAX_RETRIES=5

          MANIFEST_UPDATED=false
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if gh api "repos/${REPO}/contents/${MANIFEST_FILE}?ref=${BRANCH}" > /tmp/manifest_resp.json 2>&1; then
              SHA=$(jq -r '.sha' /tmp/manifest_resp.json)
              CONTENT=$(jq -r '.content' /tmp/manifest_resp.json | base64 -d)
            elif grep -q '"Not Found"' /tmp/manifest_resp.json 2>/dev/null; then
              SHA=""
              CONTENT="{}"
            else
              echo "Warning: unexpected API response fetching manifest (attempt ${attempt}/${MAX_RETRIES})"
              cat /tmp/manifest_resp.json >&2
              sleep 2
              continue
            fi

            UPDATED=$(echo "$CONTENT" | jq \
              --arg key "$KEY" \
              --arg digest "$DIGEST" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.[$key] = {upstream_digest: $digest, patched_vulns: 0, last_patched: $ts}')

            ENCODED=$(echo "$UPDATED" | base64 | tr -d '\n')
            ARGS=(--method PUT "repos/${REPO}/contents/${MANIFEST_FILE}"
              --field "message=chore: update preflight manifest for ${KEY}"
              --field "content=${ENCODED}"
              --field "branch=${BRANCH}")
            [ -n "$SHA" ] && ARGS+=(--field "sha=${SHA}")

            if gh api "${ARGS[@]}" --silent; then
              MANIFEST_UPDATED=true
              break
            fi

            echo "Warning: manifest update attempt ${attempt}/${MAX_RETRIES} failed (SHA conflict), retrying..."
            sleep 2
          done
          if [ "$MANIFEST_UPDATED" != "true" ]; then
            echo "::warning::Preflight manifest update failed after ${MAX_RETRIES} attempts"
          fi
