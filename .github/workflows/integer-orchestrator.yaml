name: Integer Orchestrator

on:
  schedule:
    # Daily at 03:00 UTC (offset from verity's 02:00 to avoid resource contention)
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "images/*.yaml"
      - "images/**/*.yaml"
      - "images/_base/*.yaml"
      - "integer.yaml"
      - ".github/workflows/integer-orchestrator.yaml"
      - ".github/workflows/integer-build-shard.yaml"
      - ".github/workflows/integer-build-image.yaml"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name to build (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: integer-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Detect changed images (push only) ──────────────────────
  detect:
    name: Detect Changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      filter: ${{ steps.detect.outputs.filter }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect which images changed
        id: detect
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

          if echo "$changed" | grep -qE '^(integer\.yaml|images/_base/)'; then
            echo "Base config or base images changed — rebuild all"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          names=$(echo "$changed" \
            | grep '^images/' | grep -v '_base/' \
            | sed 's|images/||;s|\.yaml||' \
            | paste -sd, || true)

          if [ -z "$names" ]; then
            echo "No image YAML files changed — workflow files only, run all"
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "Changed images: $names"
            echo "mode=filter" >> "$GITHUB_OUTPUT"
            echo "filter=$names" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 2: Discover image+version+type combos ─────────────────────
  discover:
    name: Discover images
    needs: detect
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.discover.outputs.images }}
      count: ${{ steps.discover.outputs.count }}
      shards: ${{ steps.discover.outputs.shards }}
      shard_count: ${{ steps.discover.outputs.shard_count }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verity CLI
        run: go build -o verity .

      - name: Plan dirty image×version×type combos
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETECT_MODE: ${{ needs.detect.outputs.mode }}
          DETECT_FILTER: ${{ needs.detect.outputs.filter }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          PLAN_ARGS=(
            nightly plan
            --family integer
            --output images.json
            --github-output "$GITHUB_OUTPUT"
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_IMAGE" ]; then
            # Validate dispatch input matches safe pattern
            if [[ ! "$DISPATCH_IMAGE" =~ ^[a-z0-9][a-z0-9./_-]*$ ]]; then
              echo "Invalid image name: ${DISPATCH_IMAGE}" >&2
              exit 1
            fi
            PLAN_ARGS+=(--only "$DISPATCH_IMAGE")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            PLAN_ARGS+=(--force)
          elif [ "${{ github.event_name }}" = "push" ] && [ "$DETECT_MODE" = "filter" ] && [ -n "$DETECT_FILTER" ]; then
            PLAN_ARGS+=(--only "$DETECT_FILTER" --force)
          fi

          ./verity "${PLAN_ARGS[@]}"
          echo "✓ Planned $(jq 'length' images.json) Integer remediation run(s)"
          jq -r '.[] | "  - \(.name):\(.version)-\(.type) → \(.registry)/\(.name):\(.tags[0])"' images.json

      - name: Upload Integer build plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integer-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: images.json
          retention-days: 7

  build-shards:
    name: Shard ${{ matrix.shard }} (${{ matrix.count }} entries)
    needs: discover
    if: always() && !failure() && !cancelled() && needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.shards) }}
    uses: ./.github/workflows/integer-build-shard.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      shard: ${{ matrix.shard }}
      entries: ${{ matrix.entries }}
      batch_id: ${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  aggregate:
    name: Aggregate build results
    needs: [discover, build-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Integer build plan
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integer-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: integer-build-plan

      - name: Download Integer child reports
        if: needs.discover.outputs.count != '0'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integer-build-result-*
          path: integer-build-results

      - name: Fail when any child build failed
        if: always()
        env:
          CHILD_RESULT: ${{ needs.build-shards.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          bash .github/scripts/aggregate-integer-results.sh
          integer-build-plan/images.json integer-build-results
          "$CHILD_RESULT" "$REPOSITORY" "$RUN_ID" "$BATCH_ID"
