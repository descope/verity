name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      go: ${{ steps.filter.outputs.go }}
      static: ${{ steps.filter.outputs.static }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: filter
        name: Check changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo 'tests=true'
              echo 'go=true'
              echo 'static=true'
              echo 'node=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt

          if grep -Eq '(^|/)(go\.mod|go\.sum)$|\.go$|^cmd/|^internal/|^scripts/|^\.github/workflows/ci\.yaml$|^Makefile$|^mise\.toml$' changed-files.txt; then
            echo 'tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tests=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '\.go$|(^|/)(go\.mod|go\.sum)$|^\.golangci\.ya?ml$' changed-files.txt; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
          else
            echo 'go=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^\.github/|^scripts/|\.ya?ml$|\.md$|^Makefile$|^mise\.toml$' changed-files.txt; then
            echo 'static=true' >> "$GITHUB_OUTPUT"
          else
            echo 'static=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^site/|^\.github/workflows/ci\.yaml$|^mise\.toml$' changed-files.txt; then
            echo 'node=true' >> "$GITHUB_OUTPUT"
          else
            echo 'node=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Unit Tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          install_args: "go"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${coverage}%"
          if (( $(echo "$coverage < 80" | bc -l) )); then
            echo "Coverage ${coverage}% is below required 80%"
            exit 1
          fi

      - name: Build verity
        run: go build -o verity .

  go-lint:
    name: Go Lint
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          install_args: "go go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint go:golang.org/x/vuln/cmd/govulncheck"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run govulncheck
        run: govulncheck ./...

  static-lint:
    name: Static Analysis
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          install_args: "node actionlint yamllint shellcheck npm:markdownlint-cli"

      - name: Run actionlint
        run: actionlint

      - name: Validate patch-image workflow guards
        run: python3 .github/scripts/validate-patch-image-workflow.py

      - name: Validate integer-build-image workflow guards
        run: python3 .github/scripts/validate-integer-build-image-workflow.py

      - name: Validate chart-integration workflow guards
        run: python3 .github/scripts/validate-chart-integration-workflow.py

      - name: Validate nightly workflow guards
        run: python3 .github/scripts/validate-nightly-workflows.py

      - name: Validate CI workflow guards
        run: python3 .github/scripts/validate-ci-workflow.py

      - name: Validate retry helpers
        run: bash .github/scripts/validate-retry-helpers.sh

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

      - name: Run ShellCheck
        run: shellcheck .github/scripts/*.sh

      - name: Run markdownlint
        run: markdownlint "*.md" --ignore node_modules --ignore site/node_modules

  node-lint:
    name: Node Lint
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          install_args: "node"

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Check Biome formatting
        working-directory: site
        run: npm run format:check

      - name: Run ESLint
        working-directory: site
        run: npm run lint
