name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-verity:
    name: Build Verity once
    permissions:
      contents: read
    uses: ./.github/workflows/build-verity.yaml
    with:
      source_sha: ${{ github.sha }}
      protected_attestation: "false"

  changes:
    name: Detect CI scope
    needs: build-verity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      go: ${{ steps.filter.outputs.go }}
      static: ${{ steps.filter.outputs.static }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: "0"

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - id: filter
        name: Check changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./verity ci workflow scope
          --event-name "$EVENT_NAME"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  test:
    name: Unit Tests
    needs: [changes, build-verity]
    if: github.event_name != 'pull_request' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"
          install_args: "go"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Check coverage
        run: ./verity ci workflow coverage --profile coverage.out --minimum 80

  go-lint:
    name: Go Lint
    needs: [changes, build-verity]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"
          install_args: "go go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint go:golang.org/x/vuln/cmd/govulncheck"

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run govulncheck
        run: ./verity ci vulncheck

  static-lint:
    name: Static Analysis
    needs: [changes, build-verity]
    if: github.event_name != 'pull_request' || needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"
          install_args: "node actionlint yamllint shellcheck npm:markdownlint-cli"

      - name: Run actionlint
        run: actionlint

      - name: Validate workflow policy
        run: ./verity ci workflow validate .github/workflows

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

      - name: Run ShellCheck
        run: shellcheck .github/scripts/*.sh

      - name: Run markdownlint
        run: markdownlint "*.md" --ignore node_modules --ignore site/node_modules

  node-lint:
    name: Node Lint
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"
          install_args: "node"

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Check Biome formatting
        working-directory: site
        run: npm run format:check

      - name: Run ESLint
        working-directory: site
        run: npm run lint
