name: chart-integration

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact chart producer source commit"
        required: true
        type: string
      run_id:
        description: "Exact chart producer run ID"
        required: true
        type: string
      run_attempt:
        description: "Exact chart producer run attempt"
        required: true
        type: string
      publication_id:
        description: "Exact chart publication identity"
        required: true
        type: string
      batch_id:
        description: "Exact chart publication batch"
        required: true
        type: string
      artifact_name:
        description: "Exact immutable chart publication artifact"
        required: true
        type: string
      artifact_digest:
        description: "Exact immutable chart publication digest"
        required: true
        type: string
      verity_artifact_name:
        description: "Exact current-run Verity artifact name"
        required: true
        type: string
      verity_artifact_digest:
        description: "Exact current-run Verity artifact digest"
        required: true
        type: string
      verity_build_key:
        description: "Exact current-run Verity build key"
        required: true
        type: string
    outputs:
      source_sha:
        description: "Integrated chart source commit"
        value: ${{ jobs.chart-integration-result.outputs.source_sha }}
      run_id:
        description: "Integrated chart producer run ID"
        value: ${{ jobs.chart-integration-result.outputs.run_id }}
      run_attempt:
        description: "Integrated chart producer run attempt"
        value: ${{ jobs.chart-integration-result.outputs.run_attempt }}
      publication_id:
        description: "Integrated chart publication identity"
        value: ${{ jobs.chart-integration-result.outputs.publication_id }}
      batch_id:
        description: "Integrated chart publication batch"
        value: ${{ jobs.chart-integration-result.outputs.batch_id }}
      artifact_name:
        description: "Integrated immutable chart publication artifact"
        value: ${{ jobs.chart-integration-result.outputs.artifact_name }}
      artifact_digest:
        description: "Integrated immutable chart publication digest"
        value: ${{ jobs.chart-integration-result.outputs.artifact_digest }}
  pull_request:
    # No path filter: the "Chart Integration" gate job is a required status
    # check, so it must report on EVERY PR. Scoping happens in discover-charts
    # (changed-file grep -> chart matrix); PRs touching no chart-relevant
    # paths get an empty matrix and the gate passes immediately.

permissions:
  contents: read

concurrency:
  group: chart-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verity:
    name: Build Verity once
    if: >-
      startsWith(github.workflow_ref, 'verity-org/verity/.github/workflows/chart-integration.yaml@') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/build-verity.yaml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}

  verity:
    name: Resolve exact Verity coordinates
    needs: build-verity
    if: >-
      !cancelled() &&
      (needs.build-verity.result == 'success' || needs.build-verity.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions: {}
    outputs:
      matrix: '["verity"]'
      source-sha: ${{ inputs.source_sha || needs.build-verity.outputs.source-sha }}
      artifact-name: ${{ inputs.verity_artifact_name || needs.build-verity.outputs.artifact-name }}
      artifact-digest: ${{ inputs.verity_artifact_digest || needs.build-verity.outputs.artifact-digest }}
      build-key: ${{ inputs.verity_build_key || needs.build-verity.outputs.build-key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha || needs.build-verity.outputs.source-sha }}
          persist-credentials: "false"

      - name: Activate same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ inputs.verity_artifact_name || needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ inputs.verity_artifact_digest || needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ inputs.source_sha || needs.build-verity.outputs.source-sha }}
          build-key: ${{ inputs.verity_build_key || needs.build-verity.outputs.build-key }}
          verify-attestation: ${{ github.event_name != 'pull_request' }}

  discover-charts:
    name: discover charts
    needs: verity
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    if: >-
      (github.event_name == 'pull_request' || inputs.source_sha == github.sha) &&
      needs.verity.outputs.matrix != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      strict: ${{ steps.build-matrix.outputs.strict }}
      verity_source_sha: ${{ needs.verity.outputs.source-sha }}
      verity_artifact_name: ${{ needs.verity.outputs.artifact-name }}
      verity_artifact_digest: ${{ needs.verity.outputs.artifact-digest }}
      verity_build_key: ${{ needs.verity.outputs.build-key }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verity.outputs.source-sha }}
          persist-credentials: "false"
          fetch-depth: "0"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.verity.outputs.artifact-digest }}
          source-sha: ${{ needs.verity.outputs.source-sha }}
          build-key: ${{ needs.verity.outputs.build-key }}
          verify-attestation: ${{ github.event_name != 'pull_request' }}

      - name: Download exact chart publication manifest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: .producer/chart
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Verify exact chart producer artifact
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PROVENANCE_API_AUTH: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_REPOSITORY: ${{ github.repository }}
          PROVENANCE_RUN_ID: ${{ inputs.run_id }}
          PROVENANCE_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          PROVENANCE_SOURCE_SHA: ${{ inputs.source_sha }}
          PROVENANCE_PUBLICATION_ID: ${{ inputs.publication_id }}
          PROVENANCE_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          PROVENANCE_MANIFEST: .producer/chart/producer-manifest.json
        run: ./verity ci artifact-provenance verify-download

      - id: build-matrix
        name: Build chart matrix from Chart.yaml
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_CHART: ""
        run: ./verity ci workflowops chart-matrix

  chart-test:
    name: ${{ matrix.chart }}
    needs: discover-charts
    if: >-
      (github.event_name == 'pull_request' || inputs.source_sha == github.sha) &&
      needs.discover-charts.outputs.matrix != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i+m8i/cpu=16/ram=32/image=ubuntu24-full-x64/volume=150gb:gp3/extras=otel/spot=false"
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.matrix) }}
    env:
      VERITY_CHART: ${{ matrix.chart }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Activate RunsOn telemetry
        uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2.2.0
        with:
          show_env: "false"
          show_costs: summary
          metrics: cpu,memory,disk,io,network

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-charts.outputs.verity_source_sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: chart-it-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: chart-it-${{ runner.os }}-

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.discover-charts.outputs.verity_artifact_name }}
          artifact-digest: ${{ needs.discover-charts.outputs.verity_artifact_digest }}
          source-sha: ${{ needs.discover-charts.outputs.verity_source_sha }}
          build-key: ${{ needs.discover-charts.outputs.verity_build_key }}
          verify-attestation: ${{ github.event_name != 'pull_request' }}

      - name: Download exact chart publication manifest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: .producer/chart
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Verify exact chart producer artifact
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PROVENANCE_API_AUTH: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_REPOSITORY: ${{ github.repository }}
          PROVENANCE_RUN_ID: ${{ inputs.run_id }}
          PROVENANCE_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          PROVENANCE_SOURCE_SHA: ${{ inputs.source_sha }}
          PROVENANCE_PUBLICATION_ID: ${{ inputs.publication_id }}
          PROVENANCE_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          PROVENANCE_MANIFEST: .producer/chart/producer-manifest.json
        run: ./verity ci artifact-provenance verify-download

      - name: Log in to GHCR
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_LOGIN_ATTEMPTS: "5"
        run: ./verity ci workflowops retry-docker-login --jitter-seconds 0

      - name: Harness compile and unit-test gate
        env:
          VERITY_IT_SKIP_CLUSTER: "1"
          TEST_REGEX: Test(LoadAllowlist|LoadAllowlistMissing|LoadAllowlistPresentRegression|IsAccepted|ClassifyMissingAllowlist|ClassifyMissingAllowlistDoesNotConsultAllowlist|HarnessClusterCreatedFieldDefault|KindConfigPath|KindCreateWait|InstallChartRejectsArgumentInjection|ClassifyHelmFailure|ClassifyHelmFailureStringer|ClassifyHelmFailureParsesPodJSON|ClassifyHelmFailureMalformedJSON|LoadSkips|IsSkipped|ShouldSkipChart|ProductionSKIPSYAMLIsValid)
        run: >-
          go test -tags=integration -run "$TEST_REGEX" -v ./test/chart-integration/...

      - name: Run chart smoke test
        id: smoke
        # PR-strict policy (SCR-2026-04-30-001, Option E) is PARTIALLY active:
        # - Chart.yaml dependency bumps (Renovate helm PRs) run only the
        #   changed charts' shards and are STRICT (discover-charts emits
        #   strict=true): a failing shard fails this job, which fails the
        #   "Chart Integration" gate below and blocks (auto)merge. #905
        #   merged while its chart tests were still running because nothing
        #   gated the merge — this closes that hole for chart bumps.
        # - All other PR shards stay lenient (continue-on-error) because
        #   ~30 of the wrapper charts have chronic helm-install timeouts of
        #   the same class as kyverno's bug #254 (broken image refs /
        #   missing chartValues overrides). Flipping strict globally would
        #   surface those as red shards on every PR. The typed-error
        #   infrastructure (`errAllowlistMissing`, `CollectNamespaceImages`,
        #   `classifyMissingAllowlist`) is ready — flip once the
        #   chart-wrapper backlog clears.
        # Tracking issue: TBD (chart-wrapper backlog).
        continue-on-error: ${{ github.event_name == 'pull_request' && needs.discover-charts.outputs.strict != 'true' }}
        run: go test -tags=integration -v -timeout=4h ./test/chart-integration/...

      - name: Record shard outcome
        if: always()
        # SKIPS.yaml (SCR-2026-05-14-001 AC-1/AC-3) lets a chart be explicitly
        # excluded from the smoke matrix. When that happens, the Go harness
        # drops `_skip-<chart>.txt` at the repo root and `t.Skipf`s — which
        # means the integration test still exits 0 and
        # `steps.smoke.outcome` reports "success". That's misleading in the
        # summary, so we check for the sentinel and render skipped charts
        # distinctly (yellow ⚠) with the reason + tracking issue inline.
        env:
          CHART_TEST_OUTCOME: ${{ steps.smoke.outcome }}
        run: ./verity ci workflowops write-chart-summary

      - name: Upload diagnostics on failure
        # always() is required: even with continue-on-error: true on
        # the smoke step (PR events), GHA's default is to skip
        # subsequent steps when the prior step's `outcome` is failure.
        # We want diagnostics uploaded EXACTLY when the smoke step
        # failed — that's the only time they're useful — so override
        # the skip with always() and gate on the step outcome.
        if: always() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.chart }}
          path: |
            _dump-${{ matrix.chart }}
            _kind-logs-${{ matrix.chart }}
          retention-days: "7"
          if-no-files-found: ignore

  chart-integration-result:
    name: Chart Integration
    # Single stable-name aggregation gate for branch protection: matrix
    # shard names vary per PR (one job per chart), so they can't be listed
    # as required checks. This job is the required check. It runs on every
    # PR — chart-test result "skipped" (empty matrix) counts as pass — so
    # the check always reports and automerge can never bypass chart tests
    # the way #905 did.
    needs: [discover-charts, chart-test]
    if: ${{ needs.discover-charts.result == 'success' && (needs.chart-test.result == 'success' || needs.chart-test.result == 'skipped') }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      source_sha: ${{ steps.aggregate.outputs.source_sha }}
      run_id: ${{ steps.aggregate.outputs.run_id }}
      run_attempt: ${{ steps.aggregate.outputs.run_attempt }}
      publication_id: ${{ steps.aggregate.outputs.publication_id }}
      batch_id: ${{ steps.aggregate.outputs.batch_id }}
      artifact_name: ${{ steps.aggregate.outputs.artifact_name }}
      artifact_digest: ${{ steps.aggregate.outputs.artifact_digest }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-charts.outputs.verity_source_sha }}
          persist-credentials: "false"

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.discover-charts.outputs.verity_artifact_name }}
          artifact-digest: ${{ needs.discover-charts.outputs.verity_artifact_digest }}
          source-sha: ${{ needs.discover-charts.outputs.verity_source_sha }}
          build-key: ${{ needs.discover-charts.outputs.verity_build_key }}
          verify-attestation: ${{ github.event_name != 'pull_request' }}

      - name: Aggregate chart shard results
        id: aggregate
        env:
          CHART_SOURCE_SHA: ${{ inputs.source_sha }}
          CHART_RUN_ID: ${{ inputs.run_id }}
          CHART_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          CHART_PUBLICATION_ID: ${{ inputs.publication_id }}
          CHART_BATCH_ID: ${{ inputs.batch_id }}
          CHART_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          CHART_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: >-
          ./verity ci workflowops aggregate-chart-results
          --result discover-charts=${{ needs.discover-charts.result }}
          --result chart-test=${{ needs.chart-test.result }}
