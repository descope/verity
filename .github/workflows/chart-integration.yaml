name: chart-integration

on:
  workflow_run:
    workflows: ['Chart Generation']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      chart:
        description: 'Single chart name (default: all charts in Chart.yaml)'
        required: false
        type: string
  pull_request:
    paths:
      - 'test/chart-integration/**'
      - '.github/workflows/chart-integration.yaml'
      - 'mise.toml'
      - 'Makefile'
      - 'Chart.yaml'
      - 'verity.yaml'
      - 'images/**'
      - 'internal/chartgen/**'
      - 'internal/discovery/**'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: chart-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-charts:
    name: discover charts
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - id: build-matrix
        name: Build chart matrix from Chart.yaml
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.chart }}" ]]; then
            charts="${{ github.event.inputs.chart }}"
          else
            charts="$(yq -r '.dependencies[].name' Chart.yaml)"
          fi
          json="$(printf '%s\n' "$charts" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered charts: $json"

  chart-test:
    name: ${{ matrix.chart }}
    needs: discover-charts
    if: ${{ needs.discover-charts.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.matrix) }}
    env:
      VERITY_CHART: ${{ matrix.chart }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: chart-it-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: chart-it-${{ runner.os }}-

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "GHCR login failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Harness compile and unit-test gate
        env:
          VERITY_IT_SKIP_CLUSTER: "1"
        run: |
          go test -tags=integration \
            -run 'TestLoadAllowlist|TestLoadAllowlistMissing|TestLoadAllowlistPresentRegression|TestIsAccepted|TestClassifyMissingAllowlist|TestClassifyMissingAllowlistDoesNotConsultAllowlist|TestHarnessClusterCreatedFieldDefault|TestInstallChartRejectsArgumentInjection|TestClassifyHelmFailure|TestClassifyHelmFailureStringer|TestClassifyHelmFailureParsesPodJSON|TestClassifyHelmFailureMalformedJSON|TestLoadSkips|TestIsSkipped|TestProductionSKIPSYAMLIsValid' \
            -v ./test/chart-integration/...

      - name: Run chart smoke test
        id: smoke
        # PR-strict policy (SCR-2026-04-30-001, Option E) is **DEFERRED**.
        # Investigation while landing this PR revealed that ~30 of 41
        # wrapper charts have chronic helm-install timeouts of the same
        # class as kyverno's bug #254 (broken image refs / missing
        # chartValues overrides), not just a missing-allowlist gap.
        # Flipping strict mode today would surface ~30+ pre-existing
        # chart-wrapper bugs as red shards on every PR, not the ~9
        # genuine missing-allowlist cases the SCR anticipated. The
        # typed-error infrastructure (`errAllowlistMissing`,
        # `CollectNamespaceImages`, `classifyMissingAllowlist`) lands
        # in this PR — ready to activate. A follow-up PR will flip
        # the strictness once the chart-wrapper backlog clears.
        # Tracking issue: TBD (chart-wrapper backlog).
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: make chart-integration

      - name: Record shard outcome
        if: always()
        # SKIPS.yaml (SCR-2026-05-14-001 AC-1/AC-3) lets a chart be explicitly
        # excluded from the smoke matrix. When that happens, the Go harness
        # drops `_skip-<chart>.txt` at the repo root and `t.Skipf`s — which
        # means `make chart-integration` still exits 0 and
        # `steps.smoke.outcome` reports "success". That's misleading in the
        # summary, so we check for the sentinel and render skipped charts
        # distinctly (yellow ⚠) with the reason + tracking issue inline.
        run: |
          set -euo pipefail
          sentinel="_skip-${{ matrix.chart }}.txt"
          outcome="${{ steps.smoke.outcome }}"
          {
            if [ -f "$sentinel" ] && [ "$outcome" = "success" ]; then
              reason=$(grep '^reason=' "$sentinel" | head -n1 | cut -d= -f2-)
              tracking=$(grep '^tracking_issue=' "$sentinel" | head -n1 | cut -d= -f2-)
              exitcrit=$(grep '^exit_criteria=' "$sentinel" | head -n1 | cut -d= -f2-)
              echo "## ⚠️ ${{ matrix.chart }}: skipped (SKIPS.yaml)"
              echo ""
              echo "- **reason:** \`${reason}\`"
              echo "- **tracking_issue:** ${tracking}"
              echo "- **exit_criteria:** ${exitcrit}"
              echo ""
              echo "Skip is explicit and tracked. Remove from \`test/chart-integration/SKIPS.yaml\` once exit criteria are met."
            elif [ "$outcome" = "success" ]; then
              echo "## ✅ ${{ matrix.chart }}: success"
            elif [ "$outcome" = "failure" ]; then
              echo "## ❌ ${{ matrix.chart }}: failure"
              echo ""
              echo "Smoke test reported a failure. Inspect the run log above and the uploaded \`diagnostics-${{ matrix.chart }}\` artifact for kubectl cluster-info dump and kind logs."
            else
              echo "## ${{ matrix.chart }}: ${outcome}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        # always() is required: even with continue-on-error: true on
        # the smoke step (PR events), GHA's default is to skip
        # subsequent steps when the prior step's `outcome` is failure.
        # We want diagnostics uploaded EXACTLY when the smoke step
        # failed — that's the only time they're useful — so override
        # the skip with always() and gate on the step outcome.
        if: always() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.chart }}
          path: |
            _dump-${{ matrix.chart }}
            _kind-logs-${{ matrix.chart }}
          retention-days: 7
          if-no-files-found: ignore
