name: chart-integration

on:
  workflow_run:
    workflows: ['Chart Generation']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      chart:
        description: 'Single chart name (default: all charts in Chart.yaml)'
        required: false
        type: string
  pull_request:
    # No path filter: the "Chart Integration" gate job is a required status
    # check, so it must report on EVERY PR. Scoping happens in discover-charts
    # (changed-file grep -> chart matrix); PRs touching no chart-relevant
    # paths get an empty matrix and the gate passes immediately.

permissions:
  contents: read

concurrency:
  group: chart-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-charts:
    name: discover charts
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      strict: ${{ steps.build-matrix.outputs.strict }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Build verity
        run: go build -o verity .

      - id: build-matrix
        name: Build chart matrix from Chart.yaml
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_CHART: ${{ github.event.inputs.chart }}
        run: |
          set -euo pipefail
          : > changed-files.txt
          printf 'dependencies: []\n' > base-Chart.yaml
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
            git show "$BASE_SHA:Chart.yaml" > base-Chart.yaml 2>/dev/null || printf 'dependencies: []\n' > base-Chart.yaml
          fi

          ./verity ci plan \
            --kind chart \
            --event-name "$EVENT_NAME" \
            --input-chart "$INPUT_CHART" \
            --changed-files changed-files.txt \
            --base-charts-file base-Chart.yaml \
            > ci-plan.json

          json="$(jq -c '[.matrix.include[].chart]' ci-plan.json)"
          strict="$(jq -r '.strict // false' ci-plan.json)"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "strict=$strict" >> "$GITHUB_OUTPUT"
          echo "Discovered charts: $json (strict=$strict)"

  chart-test:
    name: ${{ matrix.chart }}
    needs: discover-charts
    if: ${{ needs.discover-charts.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.matrix) }}
    env:
      VERITY_CHART: ${{ matrix.chart }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: chart-it-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: chart-it-${{ runner.os }}-

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "GHCR login failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Harness compile and unit-test gate
        env:
          VERITY_IT_SKIP_CLUSTER: "1"
        run: |
          go test -tags=integration \
            -run 'TestLoadAllowlist|TestLoadAllowlistMissing|TestLoadAllowlistPresentRegression|TestIsAccepted|TestClassifyMissingAllowlist|TestClassifyMissingAllowlistDoesNotConsultAllowlist|TestHarnessClusterCreatedFieldDefault|TestKindConfigPath|TestKindCreateWait|TestInstallChartRejectsArgumentInjection|TestClassifyHelmFailure|TestClassifyHelmFailureStringer|TestClassifyHelmFailureParsesPodJSON|TestClassifyHelmFailureMalformedJSON|TestLoadSkips|TestIsSkipped|TestShouldSkipChart|TestProductionSKIPSYAMLIsValid' \
            -v ./test/chart-integration/...

      - name: Run chart smoke test
        id: smoke
        # PR-strict policy (SCR-2026-04-30-001, Option E) is PARTIALLY active:
        # - Chart.yaml dependency bumps (Renovate helm PRs) run only the
        #   changed charts' shards and are STRICT (discover-charts emits
        #   strict=true): a failing shard fails this job, which fails the
        #   "Chart Integration" gate below and blocks (auto)merge. #905
        #   merged while its chart tests were still running because nothing
        #   gated the merge — this closes that hole for chart bumps.
        # - All other PR shards stay lenient (continue-on-error) because
        #   ~30 of the wrapper charts have chronic helm-install timeouts of
        #   the same class as kyverno's bug #254 (broken image refs /
        #   missing chartValues overrides). Flipping strict globally would
        #   surface those as red shards on every PR. The typed-error
        #   infrastructure (`errAllowlistMissing`, `CollectNamespaceImages`,
        #   `classifyMissingAllowlist`) is ready — flip once the
        #   chart-wrapper backlog clears.
        # Tracking issue: TBD (chart-wrapper backlog).
        continue-on-error: ${{ github.event_name == 'pull_request' && needs.discover-charts.outputs.strict != 'true' }}
        run: make chart-integration

      - name: Record shard outcome
        if: always()
        # SKIPS.yaml (SCR-2026-05-14-001 AC-1/AC-3) lets a chart be explicitly
        # excluded from the smoke matrix. When that happens, the Go harness
        # drops `_skip-<chart>.txt` at the repo root and `t.Skipf`s — which
        # means `make chart-integration` still exits 0 and
        # `steps.smoke.outcome` reports "success". That's misleading in the
        # summary, so we check for the sentinel and render skipped charts
        # distinctly (yellow ⚠) with the reason + tracking issue inline.
        run: |
          set -euo pipefail
          sentinel="_skip-${{ matrix.chart }}.txt"
          outcome="${{ steps.smoke.outcome }}"
          {
            if [ -f "$sentinel" ] && [ "$outcome" = "success" ]; then
              reason=$(grep '^reason=' "$sentinel" | head -n1 | cut -d= -f2-)
              tracking=$(grep '^tracking_issue=' "$sentinel" | head -n1 | cut -d= -f2-)
              exitcrit=$(grep '^exit_criteria=' "$sentinel" | head -n1 | cut -d= -f2-)
              echo "## ⚠️ ${{ matrix.chart }}: skipped (SKIPS.yaml)"
              echo ""
              echo "- **reason:** \`${reason}\`"
              echo "- **tracking_issue:** ${tracking}"
              echo "- **exit_criteria:** ${exitcrit}"
              echo ""
              echo "Skip is explicit and tracked. Remove from \`test/chart-integration/SKIPS.yaml\` once exit criteria are met."
            elif [ "$outcome" = "success" ]; then
              echo "## ✅ ${{ matrix.chart }}: success"
            elif [ "$outcome" = "failure" ]; then
              echo "## ❌ ${{ matrix.chart }}: failure"
              echo ""
              echo "Smoke test reported a failure. Inspect the run log above and the uploaded \`diagnostics-${{ matrix.chart }}\` artifact for kubectl cluster-info dump and kind logs."
            else
              echo "## ${{ matrix.chart }}: ${outcome}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        # always() is required: even with continue-on-error: true on
        # the smoke step (PR events), GHA's default is to skip
        # subsequent steps when the prior step's `outcome` is failure.
        # We want diagnostics uploaded EXACTLY when the smoke step
        # failed — that's the only time they're useful — so override
        # the skip with always() and gate on the step outcome.
        if: always() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.chart }}
          path: |
            _dump-${{ matrix.chart }}
            _kind-logs-${{ matrix.chart }}
          retention-days: 7
          if-no-files-found: ignore

  chart-integration-result:
    name: Chart Integration
    # Single stable-name aggregation gate for branch protection: matrix
    # shard names vary per PR (one job per chart), so they can't be listed
    # as required checks. This job is the required check. It runs on every
    # PR — chart-test result "skipped" (empty matrix) counts as pass — so
    # the check always reports and automerge can never bypass chart tests
    # the way #905 did.
    needs: [discover-charts, chart-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Aggregate chart shard results
        env:
          DISCOVER_RESULT: ${{ needs.discover-charts.result }}
          TEST_RESULT: ${{ needs.chart-test.result }}
        run: |
          set -euo pipefail
          echo "discover-charts: ${DISCOVER_RESULT}"
          echo "chart-test: ${TEST_RESULT}"
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "::error::discover-charts did not succeed"
            exit 1
          fi
          if [[ "$TEST_RESULT" == "failure" || "$TEST_RESULT" == "cancelled" ]]; then
            echo "::error::one or more chart shards failed"
            exit 1
          fi
