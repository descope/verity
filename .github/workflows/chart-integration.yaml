name: chart-integration

on:
  workflow_run:
    workflows: [chart-gen]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      chart:
        description: 'Single chart name (default: all charts in Chart.yaml)'
        required: false
        type: string
  pull_request:
    paths:
      - 'test/chart-integration/**'
      - '.github/workflows/chart-integration.yaml'
      - 'mise.toml'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: chart-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-charts:
    name: discover charts
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - id: build-matrix
        name: Build chart matrix from Chart.yaml
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.chart }}" ]]; then
            charts="${{ github.event.inputs.chart }}"
          else
            charts="$(yq -r '.dependencies[].name' Chart.yaml)"
          fi
          json="$(printf '%s\n' "$charts" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered charts: $json"

  chart-test:
    name: ${{ matrix.chart }}
    needs: discover-charts
    if: ${{ needs.discover-charts.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.matrix) }}
    env:
      VERITY_CHART: ${{ matrix.chart }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: chart-it-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: chart-it-${{ runner.os }}-

      - name: Run chart smoke test
        run: make chart-integration

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.chart }}
          path: |
            _dump-${{ matrix.chart }}
            _kind-logs-${{ matrix.chart }}
          retention-days: 7
          if-no-files-found: ignore
