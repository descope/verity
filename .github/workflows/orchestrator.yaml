name: Orchestrator

# Discovers all images from copa-config.yaml and dispatches an independent
# patch-image.yaml run for each image+tag combo. Fire-and-forget — does NOT
# wait for individual patch runs to complete.

on:
  schedule:
    - cron: '0 2 * * *'   # Nightly at 02:00 UTC
  push:
    branches: [main]
    paths:
      - 'copa-config.yaml'
      - 'Chart.yaml'
      - 'verity.yaml'
      - '.github/workflows/orchestrator.yaml'
      - '.github/workflows/patch-image.yaml'
  workflow_dispatch:
    inputs:
      image:
        description: "Image name to patch (empty = all)"
        required: false
        default: ""
      preflight:
        description: "Scan published targets first and dispatch only missing, scan-failing, or vulnerable images instead of forcing the selected image set"
        required: false
        type: boolean
        default: false

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write   # needed to dispatch patch-image.yaml

env:
  TARGET_REGISTRY: ghcr.io/verity-org
  STAGING_REGISTRY: ghcr.io/verity-org/cache
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: ghcr.io/verity-org/cache/buildkit:buildx-stable-1@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

jobs:
  # ── Job 1: Warm caches on both arches + mirror BuildKit ────────────
  prepare:
    name: "Prepare (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            do-mirror: true
          - runner: ubuntu-24.04-arm
            do-mirror: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Login to GHCR
        if: matrix.do-mirror
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror BuildKit to GHCR
        if: matrix.do-mirror
        run: |
          crane copy mirror.gcr.io/moby/buildkit:buildx-stable-1 "${BUILDKIT_IMAGE}" \
            || crane digest "${BUILDKIT_IMAGE}" > /dev/null \
            || { echo "Error: no BuildKit available (upstream down, no GHCR mirror)"; exit 1; }

  # ── Job 2: Detect changed images (push only) ────────────────────────
  detect:
    name: Detect Changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      filter: ${{ steps.detect.outputs.filter }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Detect which images changed
        id: detect
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

          if ! echo "$changed" | grep -q '^copa-config.yaml$'; then
            echo "copa-config.yaml not changed — workflow files only, run all"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_NAMES=$(git show "${{ github.event.before }}":copa-config.yaml 2>/dev/null | yq -r '.images[].name' 2>/dev/null | sort || true)
          NEW_NAMES=$(yq -r '.images[].name' copa-config.yaml | sort)

          ADDED=$(comm -13 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") | paste -sd,)

          CHANGED_NAMES=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            old_block=$(git show "${{ github.event.before }}":copa-config.yaml 2>/dev/null | yq ".images[] | select(.name == \"$name\")" 2>/dev/null || true)
            new_block=$(yq ".images[] | select(.name == \"$name\")" copa-config.yaml)
            if [ "$old_block" != "$new_block" ]; then
              CHANGED_NAMES="${CHANGED_NAMES:+$CHANGED_NAMES,}$name"
            fi
          done <<< "$NEW_NAMES"

          FILTER="${ADDED}${ADDED:+${CHANGED_NAMES:+,}}${CHANGED_NAMES}"

          if [ -z "$FILTER" ]; then
            echo "No image changes detected in copa-config.yaml"
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "Changed images: $FILTER"
            echo "mode=filter" >> "$GITHUB_OUTPUT"
            echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 3: Discover image+tag combos ───────────────────────────────
  discover:
    name: Discover Images
    needs: [prepare, detect]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.discover.outputs.images }}
      count: ${{ steps.discover.outputs.count }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity
        run: go build -o verity .

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan dirty images
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETECT_MODE: ${{ needs.detect.outputs.mode }}
          DETECT_FILTER: ${{ needs.detect.outputs.filter }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          PLAN_ARGS=(
            nightly plan
            --family copa
            --config copa-config.yaml
            --target-registry "${TARGET_REGISTRY}"
            --output images.json
            --github-output "$GITHUB_OUTPUT"
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_IMAGE" ]; then
            # Validate dispatch input matches safe pattern
            if [[ ! "$DISPATCH_IMAGE" =~ ^[a-z0-9][a-z0-9./_-]*$ ]]; then
              echo "Invalid image name: ${DISPATCH_IMAGE}" >&2
              exit 1
            fi
            PLAN_ARGS+=(--only "$DISPATCH_IMAGE")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.preflight }}" != "true" ]; then
            PLAN_ARGS+=(--force)
          elif [ "${{ github.event_name }}" = "push" ] && [ "$DETECT_MODE" = "filter" ] && [ -n "$DETECT_FILTER" ]; then
            PLAN_ARGS+=(--only "$DETECT_FILTER" --force)
          fi

          ./verity "${PLAN_ARGS[@]}"
          echo "✓ Planned $(jq 'length' images.json) Copa remediation run(s)"
          jq -r '.[] | "  - \(.name): \(.source)"' images.json

  # ── Job 4: Dispatch one patch-image.yaml run per dirty image+tag ───
  dispatch:
    name: Dispatch Patches
    needs: discover
    runs-on: ubuntu-24.04
    # GHA propagates skipped state from transitive `needs:` ancestors into
    # this job's implicit success() check; `detect` is push-only so schedule
    # and workflow_dispatch runs need always()+!failure()+!cancelled() to
    # escape the skip. See PR #203 (#256).
    if: always() && !failure() && !cancelled() && needs.discover.outputs.count != '0'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity
        run: go build -o verity .

      - name: Dispatch patch-image.yaml for each image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES: ${{ needs.discover.outputs.images }}
        run: |
          printf '%s' "$IMAGES" > "$RUNNER_TEMP/patch-images.json"
          ./verity nightly dispatch \
            --family copa \
            --input "$RUNNER_TEMP/patch-images.json" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
