name: Chart Generation

# Generates patched wrapper Helm charts for each chart in Chart.yaml.
# Runs after the nightly orchestrator (02:00 UTC) has had time to patch
# all chart-discovered images. Also triggerable manually.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily (2h after orchestrator)
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'verity.yaml'
      - 'copa-config.yaml'
      - 'internal/chartgen/**'
      - 'cmd/chart_gen.go'
      - '.github/workflows/chart-gen.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: read

env:
  TARGET_REGISTRY: ghcr.io/verity-org
  CHART_REGISTRY: oci://ghcr.io/verity-org/charts

jobs:
  chart-gen:
    name: Generate Wrapper Charts
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Wait for nightly patch producers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/wait-for-workflows.sh patch-image.yaml

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build verity
        run: go build -o verity .

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive exclude names from Integer images
        id: exclude
        run: |
          EXCLUDE_NAMES=$(find images -maxdepth 1 -name '*.yaml' -printf '%f\n' 2>/dev/null | sed 's/\.yaml$//' | paste -sd, || true)
          echo "names=${EXCLUDE_NAMES}" >> "$GITHUB_OUTPUT"

      - name: Generate and push wrapper charts
        run: |
          ./verity chart-gen \
            --charts-file Chart.yaml \
            --verity-config verity.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            --chart-registry "${CHART_REGISTRY}" \
            --exclude-names "${{ steps.exclude.outputs.names }}" \
            --strict
