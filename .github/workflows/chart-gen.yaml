name: Chart Generation

# Reusable chart producer for one exact successful COPA publication.

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact COPA source commit"
        required: true
        type: string
      run_id:
        description: "Exact COPA producer run ID"
        required: true
        type: string
      run_attempt:
        description: "Exact COPA producer run attempt"
        required: true
        type: string
      publication_id:
        description: "Exact chart publication identity"
        required: true
        type: string
      batch_id:
        description: "Exact COPA publication batch"
        required: true
        type: string
      artifact_name:
        description: "Exact immutable COPA manifest artifact"
        required: true
        type: string
      artifact_digest:
        description: "Exact immutable COPA manifest digest"
        required: true
        type: string
      verity_artifact_name:
        description: "Exact current-run Verity artifact name"
        required: true
        type: string
      verity_artifact_digest:
        description: "Exact current-run Verity artifact digest"
        required: true
        type: string
      verity_build_key:
        description: "Exact current-run Verity build key"
        required: true
        type: string
    outputs:
      source_sha:
        description: "Chart publication source commit"
        value: ${{ jobs.chart-gen.outputs.source_sha }}
      run_id:
        description: "Chart publication run ID"
        value: ${{ jobs.chart-gen.outputs.run_id }}
      run_attempt:
        description: "Chart publication run attempt"
        value: ${{ jobs.chart-gen.outputs.run_attempt }}
      publication_id:
        description: "Chart publication identity"
        value: ${{ jobs.chart-gen.outputs.publication_id }}
      batch_id:
        description: "Chart publication batch"
        value: ${{ jobs.chart-gen.outputs.batch_id }}
      artifact_name:
        description: "Immutable chart publication manifest artifact"
        value: ${{ jobs.chart-gen.outputs.artifact_name }}
      artifact_digest:
        description: "Immutable chart publication manifest digest"
        value: ${{ jobs.chart-gen.outputs.artifact_digest }}

permissions: {}

env:
  TARGET_REGISTRY: ghcr.io/verity-org
  CHART_REGISTRY: oci://ghcr.io/verity-org/charts

jobs:
  verity:
    name: Resolve exact caller Verity coordinates
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions: {}
    outputs:
      source-sha: ${{ inputs.source_sha }}
      artifact-name: ${{ inputs.verity_artifact_name }}
      artifact-digest: ${{ inputs.verity_artifact_digest }}
      build-key: ${{ inputs.verity_build_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: "false"

      - name: Activate exact caller Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ inputs.verity_artifact_name }}
          artifact-digest: ${{ inputs.verity_artifact_digest }}
          source-sha: ${{ inputs.source_sha }}
          build-key: ${{ inputs.verity_build_key }}
          verify-attestation: "true"

  chart-gen:
    name: Generate Wrapper Charts
    needs: verity
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    outputs:
      source_sha: ${{ inputs.source_sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      publication_id: ${{ inputs.publication_id }}
      batch_id: ${{ inputs.batch_id }}
      artifact_name: chart-publication-${{ inputs.publication_id }}
      artifact_digest: ${{ steps.upload-publication.outputs.artifact-digest }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verity.outputs.source-sha }}

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: "true"
          cache: "true"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Set up exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.verity.outputs.artifact-digest }}
          source-sha: ${{ needs.verity.outputs.source-sha }}
          build-key: ${{ needs.verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Download exact COPA publication manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: .producer/copa
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Verify exact COPA producer artifact
        env:
          PROVENANCE_API_AUTH: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_REPOSITORY: ${{ github.repository }}
          PROVENANCE_RUN_ID: ${{ inputs.run_id }}
          PROVENANCE_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          PROVENANCE_SOURCE_SHA: ${{ inputs.source_sha }}
          PROVENANCE_PUBLICATION_ID: ${{ inputs.publication_id }}
          PROVENANCE_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          PROVENANCE_MANIFEST: .producer/copa/producer-manifest.json
        run: ./verity ci artifact-provenance verify-download

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and push wrapper charts
        run: >-
          ./verity chart-gen
          --charts-file Chart.yaml
          --verity-config verity.yaml
          --target-registry "${TARGET_REGISTRY}"
          --chart-registry "${CHART_REGISTRY}"
          --exclude-images-dir images
          --strict

      - name: Write exact chart producer manifest
        env:
          PROVENANCE_REPOSITORY: ${{ github.repository }}
          PROVENANCE_RUN_ID: ${{ github.run_id }}
          PROVENANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROVENANCE_SOURCE_SHA: ${{ inputs.source_sha }}
          PROVENANCE_PUBLICATION_ID: ${{ inputs.publication_id }}
          PROVENANCE_ARTIFACT_NAME: chart-publication-${{ inputs.publication_id }}
          PROVENANCE_MANIFEST: producer-manifest.json
        run: ./verity ci artifact-provenance write-manifest

      - name: Upload immutable chart publication manifest
        id: upload-publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-publication-${{ inputs.publication_id }}
          path: |
            Chart.yaml
            verity.yaml
            copa-config.yaml
            .producer/copa
            producer-manifest.json
          retention-days: "7"
          if-no-files-found: error
