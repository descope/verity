name: Handle New Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-image:
    name: Add Image to copa-config.yaml
    runs-on: ubuntu-24.04
    if: contains(github.event.issue.labels.*.name, 'new-image')
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PEM }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Parse issue form
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: ./.github/scripts/parse-image-issue-form.sh

      - name: Add image and create PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_NAME: ${{ steps.parse.outputs.name }}
          IMAGE_REPOSITORY: ${{ steps.parse.outputs.repository }}
          IMAGE_TAG: ${{ steps.parse.outputs.tag }}
          IMAGE_REGISTRY: ${{ steps.parse.outputs.registry }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: ./.github/scripts/add-standalone-image.sh
