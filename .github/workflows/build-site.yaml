name: Build Site

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      trigger_event:
        required: true
        type: string
      authorize_bootstrap:
        required: true
        type: boolean
      authorize_restore:
        required: true
        type: boolean
      previous_run_id:
        required: false
        default: ""
        type: string
      previous_run_attempt:
        required: false
        default: ""
        type: string
      previous_source_sha:
        required: false
        default: ""
        type: string
      previous_artifact_digest:
        required: false
        default: ""
        type: string
      previous_manifest_digest:
        required: false
        default: ""
        type: string
permissions: {}

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  build-verity:
    name: Build protected Verity once
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/build-verity-protected.yaml

  protected-context:
    name: Validate publication context before secret access
    needs: build-verity
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions: {}
    steps:
      - name: Reject unprotected or unexpected reusable caller
        if: >-
          github.repository != 'verity-org/verity' ||
          github.ref != 'refs/heads/main' ||
          github.ref_protected != true ||
          github.sha != needs.build-verity.outputs.source-sha ||
          github.workflow_ref != 'verity-org/verity/.github/workflows/publish.yaml@refs/heads/main'
        run: exit 1

      - name: Reject unauthorized bootstrap
        if: inputs.mode == 'bootstrap' && inputs.authorize_bootstrap != true
        run: exit 1

      - name: Reject incomplete explicit restore authorization
        if: >-
          inputs.mode == 'restore' &&
          (inputs.authorize_restore != true ||
          inputs.previous_run_id == '' ||
          inputs.previous_run_attempt == '' ||
          inputs.previous_source_sha == '' ||
          inputs.previous_artifact_digest == '' ||
          inputs.previous_manifest_digest == '')
        run: exit 1

      - name: Reject authorization outside matching mode
        if: >-
          (inputs.authorize_bootstrap == true && inputs.mode != 'bootstrap') ||
          (inputs.authorize_restore == true && inputs.mode != 'restore')
        run: exit 1

      - name: Reject unsupported mode
        if: >-
          inputs.mode != 'auto' &&
          inputs.mode != 'full' &&
          inputs.mode != 'bootstrap' &&
          inputs.mode != 'restore'
        run: exit 1

  integer:
    name: Produce exact Integer snapshot manifest
    needs: [build-verity, protected-context]
    if: ${{ success() && inputs.mode != 'restore' }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/integer-orchestrator-reusable.yaml
    with:
      source_sha: ${{ needs.build-verity.outputs.source-sha }}
      verity_artifact_name: ${{ needs.build-verity.outputs.artifact-name }}
      verity_artifact_digest: ${{ needs.build-verity.outputs.artifact-digest }}
      verity_build_key: ${{ needs.build-verity.outputs.build-key }}
      run_id: ${{ format('{0}', github.run_id) }}
      run_attempt: ${{ format('{0}', github.run_attempt) }}
      publication_id: ${{ format('build-site-{0}-{1}', github.run_id, github.run_attempt) }}
      batch_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      event: workflow_call
      base_sha: ""
      image: ""
      package_targets_only: true

  charts:
    name: Produce exact COPA and chart manifest
    needs: [build-verity, protected-context]
    if: ${{ success() && inputs.mode != 'restore' }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/orchestrator.yaml
    with:
      source_sha: ${{ needs.build-verity.outputs.source-sha }}
      run_id: ${{ format('{0}', github.run_id) }}
      run_attempt: ${{ format('{0}', github.run_attempt) }}
      publication_id: ${{ format('build-site-{0}-{1}', github.run_id, github.run_attempt) }}
      batch_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      image: ""
      preflight: false
      verity_artifact_name: ${{ needs.build-verity.outputs.artifact-name }}
      verity_artifact_digest: ${{ needs.build-verity.outputs.artifact-digest }}
      verity_build_key: ${{ needs.build-verity.outputs.build-key }}
    secrets: inherit

  prepare:
    name: Resolve previous state and plan publication
    needs: [build-verity, protected-context, integer, charts]
    if: ${{ success() && inputs.mode != 'restore' }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      artifact_name: build-site-plan-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_digest: ${{ steps.upload-plan.outputs.artifact-digest }}
      manifest_digest: ${{ steps.plan-bootstrap.outputs.manifest_digest || steps.plan-snapshot.outputs.manifest_digest }}
      mode: ${{ steps.plan-bootstrap.outputs.mode || steps.plan-snapshot.outputs.mode }}
      plan_digest: ${{ steps.plan-bootstrap.outputs.plan_digest || steps.plan-snapshot.outputs.plan_digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out protected caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - name: Activate protected same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Download exact Integer manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.integer.outputs.manifest_artifact_name }}
          path: producer/integer

      - name: Download exact chart manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.charts.outputs.artifact_name }}
          path: producer/charts

      - name: Download and verify exact assembled packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./verity ci apk-repository download-approved
          "${{ github.run_id }}-${{ github.run_attempt }}" packages

      - name: Create publication directories and public key
        run: mkdir -p previous-pages signed-apk && cp keys/apk/verity.rsa.pub verity.rsa.pub

      - name: Resolve latest trusted previous publication
        id: previous
        if: inputs.mode == 'auto' || inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./verity ci site-publication resolve-previous
          --repository "${{ github.repository }}"
          --workflow .github/workflows/publish.yaml
          --branch main
          --artifact-name github-pages
          --before-run-id "${{ github.run_id }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Restore resolved trusted previous publication
        if: inputs.mode == 'auto' || inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./verity ci site-publication restore previous-pages
          --repository "${{ github.repository }}"
          --run-id "${{ steps.previous.outputs.run_id }}"
          --run-attempt "${{ steps.previous.outputs.run_attempt }}"
          --source-sha "${{ steps.previous.outputs.source_sha }}"
          --artifact-digest "${{ steps.previous.outputs.artifact_digest }}"
          --manifest-digest "${{ steps.previous.outputs.manifest_digest }}"
          --authorize-restore

      - name: Compose authorized bootstrap publication
        id: compose-bootstrap
        if: inputs.mode == 'bootstrap'
        run: >-
          ./verity ci publication compose
          --source-sha "${{ needs.build-verity.outputs.source-sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --batch-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --mode bootstrap
          --signer-lock ci/apk-signer.lock.json
          --signing-key-state ci/apk-signing-key-state.json
          --publication-sha "${{ needs.build-verity.outputs.source-sha }}"
          --producer-manifest "integer=${{ needs.integer.outputs.manifest_artifact_name }}=${{ needs.integer.outputs.manifest_artifact_digest }}=producer/integer/integer-manifest.json"
          --producer-manifest "charts=${{ needs.charts.outputs.artifact_name }}=${{ needs.charts.outputs.artifact_digest }}=producer/charts/producer-manifest.json"
          --publication-output publication.json
          --components-output components.json
          --github-output "$GITHUB_OUTPUT"
          --authorize-bootstrap
          --repo-dir .

      - name: Compose snapshot publication
        id: compose-snapshot
        if: inputs.mode == 'auto' || inputs.mode == 'full'
        run: >-
          ./verity ci publication compose
          --source-sha "${{ needs.build-verity.outputs.source-sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --batch-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --mode snapshot
          --previous-manifest previous-pages/.verity/publication-manifest.json
          --previous-manifest-digest "${{ steps.previous.outputs.manifest_digest }}"
          --signer-lock ci/apk-signer.lock.json
          --signing-key-state ci/apk-signing-key-state.json
          --publication-sha "${{ needs.build-verity.outputs.source-sha }}"
          --producer-manifest "integer=${{ needs.integer.outputs.manifest_artifact_name }}=${{ needs.integer.outputs.manifest_artifact_digest }}=producer/integer/integer-manifest.json"
          --producer-manifest "charts=${{ needs.charts.outputs.artifact_name }}=${{ needs.charts.outputs.artifact_digest }}=producer/charts/producer-manifest.json"
          --publication-output publication.json
          --components-output components.json
          --github-output "$GITHUB_OUTPUT"
          --repo-dir .

      - name: Plan authorized bootstrap publication
        id: plan-bootstrap
        if: inputs.mode == 'bootstrap'
        run: >-
          ./verity ci site-publication plan publication.json
          --source-sha "${{ needs.build-verity.outputs.source-sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --batch-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --mode bootstrap
          --components components.json
          --signer-lock ci/apk-signer.lock.json
          --signer-source-sha "${{ steps.compose-bootstrap.outputs.signer_source_sha }}"
          --publication-sha "${{ needs.build-verity.outputs.source-sha }}"
          --authorize-bootstrap
          --repo-dir .
          --record-output publication-plan.json
          --github-output "$GITHUB_OUTPUT"

      - name: Plan snapshot publication
        id: plan-snapshot
        if: inputs.mode == 'auto' || inputs.mode == 'full'
        run: >-
          ./verity ci site-publication plan publication.json
          --source-sha "${{ needs.build-verity.outputs.source-sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --batch-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --mode snapshot
          --components components.json
          --signer-lock ci/apk-signer.lock.json
          --signer-source-sha "${{ steps.compose-snapshot.outputs.signer_source_sha }}"
          --publication-sha "${{ needs.build-verity.outputs.source-sha }}"
          --previous-manifest previous-pages/.verity/publication-manifest.json
          --repo-dir .
          --record-output publication-plan.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload exact unprivileged publication plan
        id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-site-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            components.json
            packages
            previous-pages
            publication.json
            publication-plan.json
            signed-apk
            verity.rsa.pub
          if-no-files-found: error
          retention-days: "7"

  sign:
    name: Sign APK repository in protected environment
    needs: [build-verity, prepare]
    if: ${{ success() && inputs.mode != 'restore' }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    environment:
      name: apk-signing
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      artifact_name: build-site-signed-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_digest: ${{ steps.upload-signed.outputs.artifact-digest }}
      output_digest: ${{ steps.signer.outputs.output_digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out protected caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - name: Activate protected same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Download exact publication plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: .

      - name: Ensure signer output directory exists
        run: mkdir -p signed-apk

      - name: Build signer execution plan
        run: >-
          ./verity ci site-publication signer-plan publication-plan.json
          --runtime docker
          --repository "${{ github.repository }}"
          --workspace "$GITHUB_WORKSPACE"
          --key-directory "$RUNNER_TEMP/apk-signing-key"
          --manifest publication.json
          --packages packages
          --base-apk previous-pages/apk
          --output-apk signed-apk
          --public-key verity.rsa.pub
          --record-output signer-plan.json

      - name: Execute isolated signer with Go-owned key lifecycle
        id: signer
        env:
          APK_REPOSITORY_PRIVATE_KEY: ${{ secrets.APK_REPOSITORY_PRIVATE_KEY }}
        run: ./verity ci site-publication signer-execute signer-plan.json --record-output signer-result.json --github-output "$GITHUB_OUTPUT"

      - name: Revalidate signed APK repository
        run: ./verity ci apk-repository validate --require-signature --verify-crypto signed-apk

      - name: Upload exact signed repository
        id: upload-signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-site-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signed-apk
            signer-result.json
          if-no-files-found: error
          retention-days: "7"

  finalize:
    name: Assemble and finalize exact Build Site artifact
    needs: [build-verity, prepare, sign]
    if: ${{ success() && inputs.mode != 'restore' }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_digest: ${{ steps.finalize-bootstrap.outputs.artifact_digest || steps.finalize-snapshot.outputs.artifact_digest }}
      manifest_digest: ${{ steps.finalize-bootstrap.outputs.manifest_digest || steps.finalize-snapshot.outputs.manifest_digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out protected caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - name: Activate protected same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Download exact publication plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: .

      - name: Download exact signed repository artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.artifact_name }}
          path: .

      - name: Assemble deterministic site
        run: >-
          ./verity ci site-publication assemble publication.json publication-plan.json
          --base previous-pages
          --signed-apk signed-apk
          --output site-output
          --record-output assembly.json

      - name: Validate final signed repository
        run: ./verity ci apk-repository validate --require-signature --verify-crypto site-output/apk

      - name: Finalize authorized bootstrap archive
        id: finalize-bootstrap
        if: needs.prepare.outputs.mode == 'bootstrap'
        run: >-
          ./verity ci site-publication finalize publication-plan.json site-output "$RUNNER_TEMP/artifact.tar"
          --plan-digest "${{ needs.prepare.outputs.plan_digest }}"
          --record-output final-plan.json
          --github-output "$GITHUB_OUTPUT"

      - name: Finalize snapshot archive with exact previous CAS
        id: finalize-snapshot
        if: needs.prepare.outputs.mode == 'snapshot'
        run: >-
          ./verity ci site-publication finalize publication-plan.json site-output "$RUNNER_TEMP/artifact.tar"
          --plan-digest "${{ needs.prepare.outputs.plan_digest }}"
          --current-manifest previous-pages/.verity/publication-manifest.json
          --record-output final-plan.json
          --github-output "$GITHUB_OUTPUT"

      - name: Attest exact finalized Pages archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/artifact.tar

      - name: Upload the single exact Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: "30"
          overwrite: "true"

  restore-publication:
    name: Restore one explicitly authorized publication
    needs: [build-verity, protected-context]
    if: ${{ success() && inputs.mode == 'restore' }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out protected caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - name: Activate protected same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Restore exact authorized Build Site publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./verity ci site-publication restore site-output
          --repository "${{ github.repository }}"
          --run-id "${{ inputs.previous_run_id }}"
          --run-attempt "${{ inputs.previous_run_attempt }}"
          --source-sha "${{ inputs.previous_source_sha }}"
          --artifact-digest "${{ inputs.previous_artifact_digest }}"
          --manifest-digest "${{ inputs.previous_manifest_digest }}"
          --authorize-restore

      - name: Validate restored signed repository
        run: ./verity ci apk-repository validate --require-signature --verify-crypto site-output/apk

      - name: Upload restored Pages artifact
        uses: ./.github/actions/upload-pages-artifact
        with:
          name: github-pages
          path: site-output
          retention-days: "30"
          overwrite: "true"

  deploy:
    name: Deploy Site
    needs: [finalize, restore-publication]
    if: >-
      always() &&
      (needs.finalize.result == 'success' || needs.restore-publication.result == 'success')
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the single validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
