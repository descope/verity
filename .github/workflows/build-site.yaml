name: Build Site

# Assembles the vulnerability catalog from three independent sources:
#   1. copa-config.yaml  — source of truth for intended images (verity discover)
#   2. reports branch    — pre/post Trivy scan reports written by patch-image.yaml
#   3. Registry          — crane to confirm patched images are actually published
#
# Fully decoupled from patching; runs on its own schedule or manually.

on:
  schedule:
    - cron: '0 5 * * *'   # After nightly builds complete (Copa 02:00, Integer 03:00)
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

env:
  TARGET_REGISTRY: ghcr.io/verity-org

jobs:
  # ── Job 1: Build catalog and site ──────────────────────────────────
  catalog:
    name: Build Catalog
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    env:
      HAS_APK_REPOSITORY_PRIVATE_KEY: ${{ secrets.APK_REPOSITORY_PRIVATE_KEY != '' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout main (copa-config + source)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main

      - name: Checkout reports branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: reports
          path: ./reports-branch
          # Clone only the reports directory (sparse checkout)
          sparse-checkout: reports
          sparse-checkout-cone-mode: false

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Cache npm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/dev/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verity
        run: go build -o verity .

      - name: Discover intended images
        run: |
          ./verity discover \
            --config copa-config.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            > discovered.json

          COUNT=$(jq 'length' discovered.json)
          echo "✓ Discovered ${COUNT} image+tag combos"

      - name: Build images.json (cross-reference registry with reports)
        run: |
          mkdir -p .verity

          jq -c '.[]' discovered.json | while IFS= read -r img; do
            NAME=$(echo "$img" | jq -r '.name')
            SOURCE=$(echo "$img" | jq -r '.source')
            TAG="${SOURCE##*:}"
            REGISTRY=$(echo "$img" | jq -r '."target-registry"')

            REPO="${REGISTRY}/${NAME}"
            if crane digest "${REPO}:${TAG}" > /dev/null 2>&1; then
              PATCHED_REF="${REPO}:${TAG}"
            else
              PATCHED_REF=""
            fi

            jq -n \
              --arg original "$SOURCE" \
              --arg patched "$PATCHED_REF" \
              --arg report "${NAME}/${TAG}/pre.json" \
              --arg post_report "reports/${NAME}/${TAG}/post.json" \
              '{original: $original, patched: $patched, report: $report, "post-report": $post_report}'

          done | jq -s '.' > .verity/images.json

          echo "✓ Built images.json with $(jq 'length' .verity/images.json) entries"

      - name: Flatten post-reports for catalog
        run: |
          mkdir -p .verity/post-reports
          jq -c '.[]' .verity/images.json | while IFS= read -r entry; do
            patched=$(echo "$entry" | jq -r '.patched')
            post_report=$(echo "$entry" | jq -r '."post-report"')
            if [ -n "$patched" ] && [ "$patched" != "null" ] && [ -f "./reports-branch/${post_report}" ]; then
              safe=$(echo "$patched" | sed 's/[\/:]/_/g')
              cp "./reports-branch/${post_report}" ".verity/post-reports/${safe}.json"
            fi
          done
          echo "✓ Flattened $(find .verity/post-reports/ -name '*.json' 2>/dev/null | wc -l | tr -d ' ') post-reports"

      - name: Generate integer catalog
        run: |
          ./verity integer catalog \
            --images-dir images \
            --reports-dir reports-branch/reports \
            --output integer-catalog.json

          cp integer-catalog.json site/src/data/integer-catalog.json
          echo "✓ Generated integer catalog ($(jq '.images|length' integer-catalog.json) images)"

      - name: Generate catalog
        run: |
          args=(
            --images-json .verity/images.json
            --reports-dir ./reports-branch/reports
            --post-reports-dir .verity/post-reports
            --registry "${TARGET_REGISTRY}"
            --output site/src/data/catalog.json
          )
          [ -f integer-catalog.json ] && args+=(--integer-catalog integer-catalog.json)
          ./verity catalog "${args[@]}"
          echo "✓ Catalog generated"

      - name: Generate charts catalog
        run: |
          EXCLUDE_NAMES=$(find images -maxdepth 1 -name '*.yaml' -printf '%f\n' 2>/dev/null | sed 's/\.yaml$//' | paste -sd, || true)
          ./verity chart-gen \
            --charts-file Chart.yaml \
            --verity-config verity.yaml \
            --target-registry "${TARGET_REGISTRY}" \
            --chart-registry "oci://ghcr.io/verity-org/charts" \
            --exclude-names "${EXCLUDE_NAMES}" \
            --dry-run \
            > site/src/data/charts-catalog.json
          echo "✓ Generated charts catalog ($(jq '.charts | length' site/src/data/charts-catalog.json) charts)"

      - name: Build site
        working-directory: site
        env:
          VITE_CACHE_DIR: ${{ runner.temp }}/verity-vite-cache
        run: npm ci && npm run build

      - name: Assemble APK repository overlay
        env:
          APK_REPOSITORY_PRIVATE_KEY: ${{ secrets.APK_REPOSITORY_PRIVATE_KEY }}
        run: bash .github/scripts/assemble-apk-repository.sh --output site/dist/apk packages/repo apk-artifacts

      - name: Validate APK repository overlay
        run: bash .github/scripts/validate-apk-repository.sh site/dist/apk

      - name: Validate signed APK repository overlay
        if: env.HAS_APK_REPOSITORY_PRIVATE_KEY == 'true'
        run: bash .github/scripts/validate-apk-repository.sh --require-signature site/dist/apk

      - name: Upload Pages artifact
        uses: ./.github/actions/upload-pages-artifact
        with:
          path: site/dist
          overwrite: "true"

  # ── Job 2: Deploy to GitHub Pages ──────────────────────────────────
  deploy:
    name: Deploy Site
    needs: catalog
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
