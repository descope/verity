name: Build Protected Verity

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Immutable Verity artifact name
        value: ${{ jobs.build.outputs.artifact-name }}
      artifact-digest:
        description: Immutable Verity artifact archive digest
        value: ${{ jobs.build.outputs.artifact-digest }}
      source-sha:
        description: Exact source commit embedded in Verity
        value: ${{ jobs.build.outputs.source-sha }}
      build-key:
        description: Exact production build key embedded in Verity
        value: ${{ jobs.build.outputs.build-key }}

permissions: {}

jobs:
  build:
    if: ${{ github.repository == 'verity-org/verity' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i+m8i/cpu=16/ram=32/image=ubuntu24-full-x64/volume=100gb:gp3/extras=otel/spot=false"
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      artifact-digest: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
      source-sha: ${{ steps.build.outputs.source-sha }}
      build-key: ${{ steps.build.outputs.build-key }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Activate RunsOn telemetry
        uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2.2.0
        with:
          show_env: "false"
          show_costs: summary
          metrics: cpu,memory,disk,io,network

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"

      - name: Set up toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: "false"

      - name: Build canonical protected Verity artifact
        id: build
        env:
          VERITY_SOURCE_SHA: ${{ github.sha }}
          VERITY_ARTIFACT_DIR: ${{ runner.temp }}/verity-artifact
          VERITY_RUN_ID: ${{ github.run_id }}
          VERITY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          go run ./.github/actions/setup-verity/cmd/setup-verity build
          --source-sha "$VERITY_SOURCE_SHA"
          --run-id "$VERITY_RUN_ID"
          --run-attempt "$VERITY_RUN_ATTEMPT"
          --artifact-directory "$VERITY_ARTIFACT_DIR"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload exact protected Verity artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/verity-artifact/
          if-no-files-found: error
          compression-level: "0"
          overwrite: "false"
          include-hidden-files: "false"

  attest:
    needs: build
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          persist-credentials: "false"

      - name: Recover exact built binary
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build.outputs.artifact-name }}
          artifact-digest: ${{ needs.build.outputs.artifact-digest }}
          source-sha: ${{ needs.build.outputs.source-sha }}
          build-key: ${{ needs.build.outputs.build-key }}
          protected-producer: "true"
          verify-attestation: "false"

      - name: Attest exact Verity binary
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: verity
