name: Integer Build Shard
run-name: "Integer shard ${{ inputs.shard }}"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      verity_artifact_name:
        required: true
        type: string
      verity_artifact_digest:
        required: true
        type: string
      verity_build_key:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_attempt:
        required: true
        type: string
      publication_id:
        required: true
        type: string
      batch_id:
        required: true
        type: string
      event:
        required: true
        type: string
      mode:
        required: true
        type: string
      shard:
        required: true
        type: string
      entries:
        required: true
        type: string
      component_count:
        required: true
        type: number
      plan_artifact_name:
        required: true
        type: string
      plan_artifact_digest:
        required: true
        type: string
    outputs:
      manifest_artifact_name:
        value: ${{ jobs.aggregate.outputs.manifest_artifact_name }}
      manifest_artifact_digest:
        value: ${{ jobs.aggregate.outputs.manifest_artifact_digest }}
      package_artifact_name:
        value: ${{ jobs.aggregate.outputs.package_artifact_name }}
      package_artifact_digest:
        value: ${{ jobs.aggregate.outputs.package_artifact_digest }}

permissions:
  contents: read

jobs:
  validate-coordinates:
    name: Validate reusable-call coordinates
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      contents: read
    steps:
      - name: Reject incomplete Verity coordinates
        if: >-
          inputs.source_sha == '' ||
          inputs.verity_artifact_name == '' ||
          inputs.verity_artifact_digest == '' ||
          inputs.verity_build_key == ''
        run: exit 1

      - name: Reject incomplete shard metadata
        if: >-
          inputs.run_id == '' ||
          inputs.run_attempt == '' ||
          inputs.publication_id == '' ||
          inputs.batch_id == '' ||
          inputs.event == '' ||
          inputs.mode == '' ||
          inputs.shard == '' ||
          inputs.entries == '' ||
          inputs.plan_artifact_name == '' ||
          inputs.plan_artifact_digest == ''
        run: exit 1

      - name: Accept complete reusable-call coordinates
        if: >-
          inputs.source_sha != '' &&
          inputs.verity_artifact_name != '' &&
          inputs.verity_artifact_digest != '' &&
          inputs.verity_build_key != ''
        run: "true"

  build:
    name: Build ${{ matrix.name }}:${{ matrix.version }}-${{ matrix.type }}
    needs: validate-coordinates
    if: needs.validate-coordinates.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(inputs.entries) }}
    uses: ./.github/workflows/integer-build-image-reusable.yaml
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      source_sha: ${{ inputs.source_sha }}
      verity_artifact_name: ${{ inputs.verity_artifact_name }}
      verity_artifact_digest: ${{ inputs.verity_artifact_digest }}
      verity_build_key: ${{ inputs.verity_build_key }}
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      publication_id: ${{ inputs.publication_id }}
      batch_id: ${{ inputs.batch_id }}
      event: ${{ inputs.event }}
      mode: ${{ inputs.mode }}
      shard: ${{ inputs.shard }}
      plan_artifact_name: ${{ inputs.plan_artifact_name }}
      plan_artifact_digest: ${{ inputs.plan_artifact_digest }}
      image: ${{ matrix.name }}
      version: ${{ matrix.version }}
      type: ${{ matrix.type }}
      tags: ${{ join(matrix.tags, ',') }}
      registry: ${{ matrix.registry }}
      expected_packages: ${{ toJSON(matrix.expected_packages) }}
      publish_packages: ${{ toJSON(matrix.publish_packages) }}
      artifact_key: ${{ matrix.artifact_key }}

  aggregate:
    name: Aggregate shard ${{ inputs.shard }}
    needs: build
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    outputs:
      manifest_artifact_name: integer-shard-manifest-${{ inputs.publication_id }}-${{ inputs.shard }}
      manifest_artifact_digest: ${{ steps.upload-manifest.outputs.artifact-digest }}
      package_artifact_name: apk-repository-${{ inputs.publication_id }}-${{ inputs.shard }}
      package_artifact_digest: ${{ steps.upload-packages.outputs.artifact-digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: "false"

      - name: Activate exact Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ inputs.verity_artifact_name }}
          artifact-digest: ${{ inputs.verity_artifact_digest }}
          source-sha: ${{ inputs.source_sha }}
          build-key: ${{ inputs.verity_build_key }}
          verify-attestation: "true"

      - name: Download exact Integer plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: integer-plan

      - name: Download exact component artifacts
        if: inputs.component_count != 0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integer-component-${{ inputs.publication_id }}-${{ inputs.shard }}-*
          path: integer-components

      - name: Validate and stage exact shard packages
        run: >-
          ./verity ci integer-batch shard
          --plan integer-plan/plan.json
          --shard "${{ inputs.shard }}"
          --components-dir integer-components
          --output-dir integer-shard
          --inventory-output integer-shard/shard-inventory.json

      - name: Attest every exact shard APK
        if: hashFiles('integer-shard/packages/**/*.apk') != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: integer-shard/packages/**/*.apk

      - name: Attest exact shard inventory
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: integer-shard/shard-inventory.json

      - name: Upload exact shard package artifact
        id: upload-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-repository-${{ inputs.publication_id }}-${{ inputs.shard }}
          path: integer-shard/
          if-no-files-found: error
          retention-days: "7"

      - name: Bind package artifact to exact shard manifest
        run: >-
          ./verity ci integer-batch finalize-shard
          --inventory integer-shard/shard-inventory.json
          --publication-id "${{ inputs.publication_id }}"
          --artifact-name "apk-repository-${{ inputs.publication_id }}-${{ inputs.shard }}"
          --artifact-digest "${{ steps.upload-packages.outputs.artifact-digest }}"
          --output integer-shard/shard-manifest.json

      - name: Attest exact shard manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: integer-shard/shard-manifest.json

      - name: Upload exact shard manifest
        id: upload-manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integer-shard-manifest-${{ inputs.publication_id }}-${{ inputs.shard }}
          path: integer-shard/shard-manifest.json
          if-no-files-found: error
          retention-days: "7"
