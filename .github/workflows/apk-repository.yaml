name: APK Repository (retired)

on:
  workflow_call:

permissions: {}

jobs:
  retired:
    name: Reject standalone APK publication
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions: {}
    steps:
      - name: Fail closed before publication or secret access
        run: exit 1
