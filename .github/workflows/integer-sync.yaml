name: Integer Package Stream Sync

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: integer-package-stream-sync
  cancel-in-progress: false

jobs:
  build-verity:
    name: Build protected Verity once
    if: ${{ startsWith(github.workflow_ref, 'verity-org/verity/.github/workflows/integer-sync.yaml@') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-verity-protected.yaml

  sync:
    needs: build-verity
    runs-on: "runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i/cpu=4/ram=8/image=ubuntu24-full-x64/volume=40gb:gp3/extras=otel/spot=false"
    permissions:
      actions: read
      attestations: read
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PEM }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: "0"
          token: ${{ steps.app-token.outputs.token }}

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: "true"
          cache: "true"

      - name: Activate protected same-run Verity
        uses: ./.github/actions/setup-verity
        with:
          artifact-name: ${{ needs.build-verity.outputs.artifact-name }}
          artifact-digest: ${{ needs.build-verity.outputs.artifact-digest }}
          source-sha: ${{ needs.build-verity.outputs.source-sha }}
          build-key: ${{ needs.build-verity.outputs.build-key }}
          verify-attestation: "true"

      - name: Discover new Wolfi package streams
        run: ./verity integer sync --apply

      - name: Open or update sync pull request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          ./verity ci repository-ops sync-pr
          --base main
          --branch automation/integer-package-streams
          --max-changed-images 20
