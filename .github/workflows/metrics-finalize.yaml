name: Metrics Finalize

on:
  workflow_call:
    inputs:
      run-id:
        description: "Patch Image workflow run containing metrics artifacts"
        required: true
        type: string
      run-attempt:
        description: "Patch Image workflow run attempt"
        required: true
        type: string
    secrets:
      archive-token:
        description: "Token scoped to reading artifacts and writing the archive branch"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: metrics-finalize-${{ inputs.run-id }}
  cancel-in-progress: false

jobs:
  commit-metrics:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # No fetch-depth needed; we'll fetch _metrics separately

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Probe artifact existence
        id: probe
        env:
          GH_TOKEN: ${{ secrets.archive-token }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("metrics-"))] | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No metrics artifacts found for run ${RUN_ID}"
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Download metrics artifacts
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.archive-token }}
          pattern: metrics-*
          merge-multiple: true
          path: ./downloaded-metrics

      - name: Validate metrics
        env:
          RUN_ID: ${{ inputs.run-id }}
          RUN_ATTEMPT: ${{ inputs.run-attempt }}
        run: |
          bash .github/scripts/validate-metrics-json.sh \
            "$RUN_ID" "$RUN_ATTEMPT" ./downloaded-metrics

      - name: Resolve workflow creation time
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.archive-token }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          set -euo pipefail
          created_at=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.created_at')
          echo "created-at=${created_at}" >> "$GITHUB_OUTPUT"

      - name: Commit metrics to _metrics branch
        env:
          RUN_ID: ${{ inputs.run-id }}
          RUN_ATTEMPT: ${{ inputs.run-attempt }}
          RUN_CREATED_AT: ${{ steps.metadata.outputs.created-at }}
        run: |
          set -euo pipefail
          DATE=$(date -u -d "${RUN_CREATED_AT}" +%Y-%m-%d)
          TARGET_DIR="_metrics/runs/${DATE}/${RUN_ID}-attempt-${RUN_ATTEMPT}"

          STASH=$(mktemp -d)
          cp ./downloaded-metrics/metrics-*.json "$STASH/"

          for attempt in 1 2 3 4 5; do
            echo "::group::Attempt ${attempt}"

            if git fetch origin _metrics:_metrics 2>/dev/null; then
              git switch _metrics
              git reset --hard origin/_metrics
            else
              echo "::notice::_metrics branch missing — initializing as orphan"
              git switch --orphan _metrics
              git rm -rf . 2>/dev/null || true
            fi

            mkdir -p "$TARGET_DIR"
            for f in "$STASH"/metrics-*.json; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .json)
              image="${base#metrics-}"
              cp "$f" "$TARGET_DIR/${image}.json"
            done

            git add _metrics/
            if git diff --cached --quiet; then
              echo "::notice::No changes to commit"
              echo "::endgroup::"
              break
            fi

            COUNT=$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*.json' | wc -l)
            git commit -m "metrics: run ${RUN_ID} attempt ${RUN_ATTEMPT}" -m "${COUNT} image(s)"

            if git push origin _metrics; then
              echo "::notice::Pushed on attempt ${attempt}"
              echo "::endgroup::"
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push metrics after 5 attempts"
              echo "::endgroup::"
              exit 1
            fi

            sleep_time=$((RANDOM % 10 + 1))
            echo "::warning::Push failed, retrying in ${sleep_time}s"
            sleep "$sleep_time"

            git switch -
            echo "::endgroup::"
          done
