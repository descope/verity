name: Setup Binaries
description: Build and cache the verity binary. Copa is now bundled as a Go library inside verity (see internal/patch), so no separate copa binary is installed.

inputs:
  github-token:
    description: GitHub token for API access (reserved for future use)
    required: false
    default: ""

outputs:
  verity-cache-hit:
    description: Whether verity was found in cache
    value: ${{ steps.verity-cache.outputs.cache-hit }}
  verity-version:
    description: Verity git commit hash
    value: ${{ steps.verity-version.outputs.version }}

runs:
  using: composite
  steps:
    # ── Verity Setup ──────────────────────────────────────────────────────
    # Copa is bundled into the verity binary via `internal/patch` importing
    # `github.com/project-copacetic/copacetic/pkg/patch` as a Go module
    # dependency. Building verity builds copa too — no separate `copa`
    # binary is needed.
    - name: Get Verity version
      id: verity-version
      shell: bash
      run: |
        VERSION=$(git rev-parse HEAD)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Verity version: $VERSION"

    - name: Restore Verity from cache
      id: verity-cache
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ./verity
        key: verity-${{ runner.os }}-${{ runner.arch }}-${{ steps.verity-version.outputs.version }}

    - name: Build Verity from source
      if: steps.verity-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go build -o verity .

    - name: Make Verity executable
      if: steps.verity-cache.outputs.cache-hit != 'true'
      shell: bash
      run: chmod +x verity

    - name: Save Verity to cache
      if: steps.verity-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ./verity
        key: verity-${{ runner.os }}-${{ runner.arch }}-${{ steps.verity-version.outputs.version }}
