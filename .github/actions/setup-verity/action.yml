name: Setup Verity
description: Download, verify, and activate one exact current-run Verity artifact.

inputs:
  artifact-name:
    description: Exact artifact name returned by build-verity
    required: true
  artifact-digest:
    description: Exact artifact archive digest returned by build-verity
    required: true
  source-sha:
    description: Exact source commit built into Verity
    required: true
  build-key:
    description: Exact production build key embedded in Verity
    required: true
  verify-attestation:
    description: Verify protected GitHub build provenance before activation
    required: false
    default: "false"
  protected-producer:
    description: Require the protected main-only Verity producer identity
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up trusted Go toolchain
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        cache: "false"

    - name: Verify exact current-run artifact identity
      id: verify-remote
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERITY_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        VERITY_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        VERITY_SOURCE_SHA: ${{ inputs.source-sha }}
        VERITY_BUILD_KEY: ${{ inputs.build-key }}
        VERITY_PROTECTED_PRODUCER: ${{ inputs.protected-producer == 'true' || inputs.verify-attestation == 'true' }}
        VERITY_PROTECTED: ${{ inputs.verify-attestation }}
      run: >-
        go run ./.github/actions/setup-verity/cmd/setup-verity verify-remote
        --artifact-name "$VERITY_ARTIFACT_NAME"
        --artifact-digest "$VERITY_ARTIFACT_DIGEST"
        --source-sha "$VERITY_SOURCE_SHA"
        --build-key "$VERITY_BUILD_KEY"
        --repository "$GITHUB_REPOSITORY"
        --run-id "$GITHUB_RUN_ID"
        --run-attempt "$GITHUB_RUN_ATTEMPT"
        --protected-producer "$VERITY_PROTECTED_PRODUCER"
        --protected-attestation "$VERITY_PROTECTED"
        --github-output "$GITHUB_OUTPUT"

    - name: Remove stale download paths
      shell: bash
      env:
        VERITY_DOWNLOAD_DIR: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/download
        VERITY_ARTIFACT_DIR: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/artifact
      run: rm -rf -- "$VERITY_DOWNLOAD_DIR" "$VERITY_ARTIFACT_DIR"

    - name: Download exact current-run artifact archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.verify-remote.outputs.artifact-id }}
        path: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/download
        skip-decompress: "true"
        digest-mismatch: error

    - name: Verify archive and canonical artifact payload
      shell: bash
      env:
        VERITY_DOWNLOAD_DIR: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/download
        VERITY_ARTIFACT_DIR: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/artifact
        VERITY_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        VERITY_SOURCE_SHA: ${{ inputs.source-sha }}
        VERITY_BUILD_KEY: ${{ inputs.build-key }}
      run: >-
        go run ./.github/actions/setup-verity/cmd/setup-verity extract
        --download-directory "$VERITY_DOWNLOAD_DIR"
        --artifact-directory "$VERITY_ARTIFACT_DIR"
        --artifact-digest "$VERITY_ARTIFACT_DIGEST"
        --source-sha "$VERITY_SOURCE_SHA"
        --build-key "$VERITY_BUILD_KEY"

    - name: Verify protected GitHub attestation
      if: ${{ steps.verify-remote.outputs.verify-attestation == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERITY_BINARY: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/artifact/verity
        VERITY_SOURCE_SHA: ${{ inputs.source-sha }}
      run: >-
        gh attestation verify "$VERITY_BINARY"
        --repo "$GITHUB_REPOSITORY"
        --signer-workflow "github.com/verity-org/verity/.github/workflows/build-verity-protected.yaml"
        --signer-digest "$VERITY_SOURCE_SHA"
        --source-digest "$VERITY_SOURCE_SHA"
        --predicate-type "https://slsa.dev/provenance/v1"

    - name: Activate verified Verity binary
      shell: bash
      env:
        VERITY_ARTIFACT_DIR: ${{ runner.temp }}/setup-verity/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/artifact
        VERITY_SOURCE_SHA: ${{ inputs.source-sha }}
        VERITY_BUILD_KEY: ${{ inputs.build-key }}
      run: >-
        go run ./.github/actions/setup-verity/cmd/setup-verity activate
        --artifact-directory "$VERITY_ARTIFACT_DIR"
        --source-sha "$VERITY_SOURCE_SHA"
        --build-key "$VERITY_BUILD_KEY"
        --destination "$GITHUB_WORKSPACE/verity"
